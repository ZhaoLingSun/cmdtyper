simulated_output = ""
id = "redirect_stdin-example-003"
command_id = "shared-9dd4fdad130269ff"

[[symbols]]
id = "heredoc"
char_repr = "<<"
name = "Here Document"
summary = "将多行文本作为命令的标准输入，直到遇到指定的结束标记"
explanation = "<< 用于创建\"Here Document\"（此处文档），允许在命令行中直接嵌入多行输入。\n\n语法：\n  命令 << 结束标记\n  第一行内容\n  第二行内容\n  结束标记\n\n结束标记可以是任意字符串，常用 EOF、END、HEREDOC 等。\n结束标记必须独占一行，前面不能有空格（除非使用 <<- 来忽略前导 Tab）。\n\nHere Document 中支持变量展开和命令替换。\n如果要禁止展开，可以给结束标记加单引号：<< 'EOF'"

[[symbols.examples]]
explanation = "使用 Here Document 创建包含变量和命令替换的多行文本"
simulated_output = "Hello, ace!\nToday is Sunday."
id = "heredoc-example-001"
command_id = "v04-ref-023c24397c"

[[symbols.examples]]
explanation = "使用加引号的结束标记来禁止变量展开，所有 $ 符号保持原样"
simulated_output = "Price is $100\nPath is $HOME"
id = "heredoc-example-002"
command_id = "shared-a5e11ea05dd98923"

[[symbols.examples]]
explanation = "使用 Here Document 配合 tee 创建配置文件"
simulated_output = "[database]\nhost = localhost\nport = 5432\nname = myapp"
id = "heredoc-example-003"
command_id = "shared-43907aece9c810f3"

[[symbols]]
id = "tee"
char_repr = "tee"
name = "tee 分流器"
summary = "从标准输入读取数据，同时输出到标准输出和一个或多个文件"
explanation = "tee 命令的名字来源于 T 型管道接头——它将数据流一分为二：\n一份继续流向标准输出（可在终端显示或通过管道传递），\n一份写入指定的文件。\n\n语法：命令 | tee [选项] 文件名\n\n常用选项：\n  -a    追加模式（等价于 >> 的效果），不覆盖文件已有内容\n  文件1 文件2    可以同时写入多个文件\n\n典型场景：\n  - 需要同时查看输出并保存日志\n  - 在管道链中间保存中间结果\n  - 配合 sudo 写入需要权限的文件"

[[symbols.examples]]
explanation = "查看磁盘使用情况，结果同时显示在终端并保存到文件"
simulated_output = "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1        50G   32G   16G  67% /\ntmpfs           3.9G  1.2M  3.9G   1% /dev/shm\n/dev/sda2       200G  128G   62G  68% /home"
id = "tee-example-001"
command_id = "v04-ref-bd05b158bd"

[[symbols.examples]]
explanation = "使用 tee 配合 sudo 写入需要 root 权限的文件（直接用 sudo > 是不行的）"
simulated_output = "deb http://archive.ubuntu.com/ubuntu jammy main"
id = "tee-example-002"
command_id = "shared-0c51aab12e4cfa30"

[[symbols.examples]]
explanation = "过滤日志中的错误，追加保存到报告文件，同时统计错误总数"
simulated_output = "17"
id = "tee-example-003"
command_id = "shared-a6a0dd424f3e242a"

