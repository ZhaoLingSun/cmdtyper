simulated_output = "Item 1\nItem 2\nItem 3"
id = "redirect_stdout_append-example-003"
command_id = "shared-fb6caaa35b3457cd"

[[symbols]]
id = "redirect_stderr"
char_repr = "2>"
name = "标准错误重定向"
summary = "将命令的标准错误（stderr）重定向到文件"
explanation = "在 Linux 中，每个进程有三个标准文件描述符：\n  0 = stdin（标准输入）\n  1 = stdout（标准输出）\n  2 = stderr（标准错误）\n\n2> 将文件描述符 2（标准错误）重定向到指定文件。\n这常用于将错误信息和正常输出分开保存。\n\n同样，2>> 表示将 stderr 追加到文件。\n2>/dev/null 表示丢弃所有错误信息（/dev/null 是\"黑洞\"设备）。"

[[symbols.examples]]
explanation = "先把缺失路径的错误写入 errors.txt；回车后单独读取文件，前一步失败也继续检查"
simulated_output = "ls: cannot access '/nonexistent': No such file or directory"
id = "redirect_stderr-example-001"
command_id = "v04-ref-8aee894088"

[[symbols.examples]]
explanation = "查找所有 .conf 文件，将权限不足等错误信息丢弃到 /dev/null，只显示正常结果"
simulated_output = "/etc/sysctl.conf\n/etc/resolv.conf\n/etc/adduser.conf"
id = "redirect_stderr-example-002"
command_id = "shared-fd36303c5fc53224"

[[symbols.examples]]
explanation = "编译 C 程序，将编译错误和警告保存到文件中以便后续分析"
simulated_output = ""
id = "redirect_stderr-example-003"
command_id = "shared-05f3442c1aeed85d"

[[symbols]]
id = "redirect_stderr_to_stdout"
char_repr = "2>&1"
name = "合并标准错误到标准输出"
summary = "将 stderr 重定向到 stdout 所指向的同一目标"
explanation = "2>&1 表示将文件描述符 2（stderr）重定向到文件描述符 1（stdout）\n当前所指向的位置。注意顺序很重要：\n\n  命令 > file 2>&1   — stdout 和 stderr 都写入 file ✓\n  命令 2>&1 > file   — 只有 stdout 写入 file，stderr 仍到终端 ✗\n\n在 Bash 中也可以用简写 &> 来同时重定向 stdout 和 stderr：\n  命令 &> file   等价于   命令 > file 2>&1\n\n常见用法是在管道中同时捕获正常输出和错误输出：\n  命令 2>&1 | grep something"

[[symbols.examples]]
explanation = "同时列出存在和不存在的路径，将 stderr 合并到 stdout 后过滤错误信息"
simulated_output = "ls: cannot access '/nonexistent': No such file or directory"
id = "redirect_stderr_to_stdout-example-001"
command_id = "v04-ref-3295d2a9d6"

[[symbols.examples]]
explanation = "将编译的正常输出和错误输出都保存到 build.log 中"
simulated_output = ""
id = "redirect_stderr_to_stdout-example-002"
command_id = "shared-d748a83a2d90172f"

[[symbols.examples]]
explanation = "运行 Python 脚本，合并 stdout 和 stderr，同时显示在终端并保存到文件"
simulated_output = "Processing data...\nWarning: missing value at line 42\nResult: 128 records processed"
id = "redirect_stderr_to_stdout-example-003"
command_id = "shared-cf68c97664903134"

[[symbols]]
id = "redirect_stdin"
char_repr = "<"
name = "输入重定向"
summary = "将文件内容作为命令的标准输入"
explanation = "< 将指定文件的内容作为命令的标准输入（stdin，文件描述符 0）。\n\n语法：命令 < 文件名\n\n虽然很多命令本身可以直接读取文件参数（如 cat file），但 < 在以下场景更有用：\n  - 命令只接受 stdin 不接受文件参数时\n  - 需要明确表示数据方向时\n  - 与其他重定向组合使用时\n\n组合示例：\n  sort < unsorted.txt > sorted.txt\n  将 unsorted.txt 的内容排序后保存到 sorted.txt"

[[symbols.examples]]
explanation = "统计 /etc/passwd 文件的行数。与 wc -l /etc/passwd 不同的是，不会显示文件名"
simulated_output = "42"
id = "redirect_stdin-example-001"
command_id = "v04-ref-91000503b6"

[[symbols.examples]]
explanation = "将 names.txt 的内容排序后保存到新文件，同时演示输入输出重定向的组合"
simulated_output = "Alice\nBob\nCharlie"
id = "redirect_stdin-example-002"
command_id = "shared-739ca57423684b68"

[[symbols.examples]]
