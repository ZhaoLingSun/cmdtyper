
[meta]
id = "pipe_redirect"
topic = "管道与重定向"
description = "学习 Shell 中管道和重定向操作符，掌握数据流的连接、输出重定向、错误重定向等核心概念"
difficulty = "basic"
icon = "🔀"

[[symbols]]
id = "pipe"
char_repr = "|"
name = "管道"
summary = "将前一个命令的标准输出连接到后一个命令的标准输入"
explanation = "管道（pipe）是 Unix/Linux 中最强大的概念之一。\n它用竖线符号 | 将两个或多个命令串联起来，前一个命令的标准输出（stdout）\n会自动成为后一个命令的标准输入（stdin），无需创建临时文件。\n\n管道可以无限链接，形成强大的命令流水线：\n  命令A | 命令B | 命令C | ...\n\n注意：管道只传递 stdout，不传递 stderr。如果需要同时传递 stderr，\n需要先用 2>&1 将 stderr 合并到 stdout。"

[[symbols.examples]]
explanation = "列出 /etc 目录下所有文件的详细信息，通过管道只显示前 5 行"
simulated_output = "total 1284\ndrwxr-xr-x 142 root root   12288 Mar  5 08:30 .\ndrwxr-xr-x  20 root root    4096 Jan 12 14:22 ..\n-rw-r--r--   1 root root    3028 Jan 12 14:22 adduser.conf\n-rw-r--r--   1 root root      44 Feb 20 09:15 adjtime"
id = "pipe-example-001"
command_id = "v04-ref-b3851cdafc"

[[symbols.examples]]
explanation = "读取系统日志文件，过滤包含 error 的行，最后统计行数——典型的三段管道链"
simulated_output = "42"
id = "pipe-example-002"
command_id = "shared-125410a46509ac33"

[[symbols.examples]]
explanation = "列出所有进程，过滤出 nginx 相关进程，再排除 grep 自身的进程"
simulated_output = "root      1234  0.0  0.1  65432  2048 ?        Ss   08:00   0:00 nginx: master process /usr/sbin/nginx\nwww-data  1235  0.0  0.3  65896  6144 ?        S    08:00   0:05 nginx: worker process\nwww-data  1236  0.0  0.3  65896  6080 ?        S    08:00   0:04 nginx: worker process"
id = "pipe-example-003"
command_id = "shared-21715d6bfbd69986"

[[symbols]]
id = "redirect_stdout_overwrite"
char_repr = ">"
name = "输出重定向（覆盖）"
summary = "将命令的标准输出写入文件，若文件已存在则覆盖"
explanation = "> 将命令的标准输出（stdout，文件描述符 1）重定向到指定文件。\n如果目标文件不存在，系统会自动创建它；如果文件已存在，其内容会被完全覆盖。\n\n语法：命令 > 文件名\n\n注意：> 等价于 1>，因为文件描述符 1 代表标准输出。\n在 Bash 中可以设置 set -o noclobber 来防止意外覆盖已有文件，\n此时需要用 >| 来强制覆盖。"

[[symbols.examples]]
explanation = "将字符串写入 greeting.txt 文件。如果文件已存在，原内容被覆盖"
simulated_output = ""
id = "redirect_stdout_overwrite-example-001"
command_id = "v04-ref-5b5f79fc42"

[[symbols.examples]]
explanation = "将 /home 目录的详细文件列表保存到 file_list.txt 中"
simulated_output = ""
id = "redirect_stdout_overwrite-example-002"
command_id = "shared-6e0b044dfe8435f8"

[[symbols.examples]]
explanation = "将当前日期时间写入文件，然后用 cat 验证内容"
simulated_output = "Sun Mar  8 15:30:42 CST 2026"
id = "redirect_stdout_overwrite-example-003"
command_id = "shared-d0323ff63a26e904"

[[symbols]]
id = "redirect_stdout_append"
char_repr = ">>"
name = "输出重定向（追加）"
summary = "将命令的标准输出追加到文件末尾，不覆盖已有内容"
explanation = ">> 与 > 类似，但不会覆盖文件原有内容，而是将输出追加到文件末尾。\n如果文件不存在，同样会自动创建。\n\n这在日志记录、逐步构建文件等场景中非常常用。\n\n语法：命令 >> 文件名\n\n常见用法：\n  echo \"新的一行\" >> logfile.txt\n  date >> build_log.txt"

[[symbols.examples]]
explanation = "先用 > 创建文件写入第一行，再用 >> 追加第二行，最后查看完整内容"
simulated_output = "第一行\n第二行"
id = "redirect_stdout_append-example-001"
command_id = "v04-ref-53347128cc"

[[symbols.examples]]
