command_id = "shared-78fddb678bd9fd52"

[[symbols]]
id = "current_pid"
char_repr = "$$"
name = "当前进程 ID"
summary = "返回当前 Shell 进程的 PID（进程标识符）"
explanation = "$$ 是一个特殊变量，保存当前 Shell 进程的进程 ID（PID）。\n每个正在运行的进程都有一个唯一的 PID 编号。\n\n常见用途：\n  - 创建唯一的临时文件名：tmpfile=\"/tmp/myapp_$$.tmp\"\n  - 在日志中记录进程信息：echo \"[PID $$] 开始处理...\"\n  - 创建锁文件防止脚本重复运行：\n    LOCKFILE=\"/var/run/myscript.lock\"\n    echo $$ > \"$LOCKFILE\"\n\n注意事项：\n  - $$ 在子 Shell 中保持与父 Shell 相同的值（不会更新为子 Shell 的 PID）\n  - 如果需要子 Shell 的 PID，可以使用 $BASHPID（Bash 4.0+）\n  - PID 是由操作系统分配的，每次运行可能不同"

[[symbols.examples]]
explanation = "显示当前 Shell 进程的 PID"
simulated_output = "28450"
id = "current_pid-example-001"
command_id = "v04-ref-a5f78a681e"

[[symbols.examples]]
explanation = "在字符串中嵌入当前进程 ID，可用于日志记录"
simulated_output = "PID: 28450"
id = "current_pid-example-002"
command_id = "shared-afe7a8029387f1a2"

[[symbols.examples]]
