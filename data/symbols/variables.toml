command_id = "shared-17a42a385b5576b3"

[[symbols]]
id = "exit_status"
char_repr = "$?"
name = "退出状态码"
summary = "保存上一个命令的退出状态码，0 表示成功，非零表示失败"
explanation = "$? 是一个特殊变量，保存最近一次执行的命令的退出状态码（exit code）。\n\n退出状态码约定：\n  0     命令执行成功\n  1     一般性错误\n  2     命令使用方式错误（如参数不对）\n  126   命令存在但不可执行（权限不足）\n  127   命令未找到\n  128+N 被信号 N 终止（如 130 = Ctrl+C 中断）\n\n$? 在脚本中非常重要，常用于条件判断：\n  if [ $? -eq 0 ]; then\n      echo \"成功\"\n  else\n      echo \"失败\"\n  fi\n\n注意：$? 的值在每次执行命令后都会更新，所以如果需要保存某个命令的退出码，\n应该立即将其赋值给变量：status=$?"

[[symbols.examples]]
explanation = "列出 /etc 目录（输出丢弃），然后显示退出码。ls 成功则输出 0"
simulated_output = "0"
id = "exit_status-example-001"
command_id = "v04-ref-dcf61be114"

[[symbols.examples]]
explanation = "尝试列出不存在的目录（错误信息丢弃），然后显示退出码。失败返回 2"
simulated_output = "2"
id = "exit_status-example-002"
command_id = "shared-ed810cb663ca76f3"

[[symbols.examples]]
explanation = "true 命令总是返回成功（0），用于测试退出状态机制"
simulated_output = "0"
id = "exit_status-example-003"
command_id = "shared-4445add24054b5e1"

[[symbols]]
id = "script_name"
char_repr = "$0"
name = "脚本/Shell 名称"
summary = "保存当前脚本的名称或当前 Shell 的名称"
explanation = "$0 是一个特殊的位置参数，保存当前正在运行的脚本名称或 Shell 名称。\n\n不同场景下的值：\n  - 在交互式 Shell 中：$0 通常是 bash、-bash 或 /bin/bash\n  - 在脚本中运行：$0 是脚本被调用时的名称（如 ./deploy.sh 或 /usr/local/bin/deploy.sh）\n  - 通过 bash -c 执行：$0 是 -c 后面紧跟的第一个非选项参数\n\n$0 的常见用途：\n  - 在脚本中显示使用帮助：echo \"用法: $0 [选项] <参数>\"\n  - 获取脚本所在目录：DIR=$(dirname \"$0\")\n  - 根据调用名称改变行为（类似 busybox 的多命令合一方式）\n\n注意：$0 不包含在 $# 的参数计数中，也不包含在 $@ 的参数列表中。"

[[symbols.examples]]
explanation = "在交互式终端中显示当前 Shell 的名称"
simulated_output = "bash"
id = "script_name-example-001"
command_id = "shell-invocation-name"

[[symbols.examples]]
explanation = "通过 bash -c 执行时，紧跟在命令字符串后面的 myscript 会赋值给 $0"
simulated_output = "myscript"
id = "script_name-example-002"
command_id = "shared-cd8af30682a37503"

[[symbols]]
id = "arg_count"
char_repr = "$#"
name = "参数个数"
summary = "返回传递给脚本或函数的位置参数个数"
explanation = "$# 是一个特殊变量，保存传递给当前脚本或函数的位置参数总数。\n它不包含 $0（脚本名本身），只计算 $1、$2、$3... 等参数。\n\n常见用途：\n  - 检查参数个数是否正确：\n    if [ $# -lt 2 ]; then\n        echo \"用法: $0 <源文件> <目标文件>\"\n        exit 1\n    fi\n\n  - 判断是否有参数传入：\n    if [ $# -eq 0 ]; then\n        echo \"未提供参数\"\n    fi\n\n在函数内部，$# 返回的是传递给函数的参数个数，而不是脚本的参数个数。"

[[symbols.examples]]
explanation = "传入 a、b、c 三个参数（_ 是 $0 的占位符），$# 显示参数个数为 3"
simulated_output = "3"
id = "arg_count-example-001"
command_id = "v04-ref-8e83434495"

[[symbols.examples]]
explanation = "不传入任何参数时，$# 为 0"
simulated_output = "0"
id = "arg_count-example-002"
command_id = "shared-7af13b7ffc522c29"

[[symbols.examples]]
explanation = "在字符串中嵌入参数个数，显示更友好的提示信息"
simulated_output = "共 2 个参数"
id = "arg_count-example-003"
command_id = "shared-e3063a03f9d0e352"

[[symbols]]
id = "all_args"
char_repr = "$@"
name = "所有位置参数"
summary = "展开为所有位置参数，每个参数作为独立的单词"
explanation = "$@ 展开为传递给脚本或函数的所有位置参数（$1 $2 $3 ...）。\n\n$@ 与 $* 的关键区别：\n  - \"$@\" 将每个参数作为独立的字符串保留：\"$1\" \"$2\" \"$3\" ...\n  - \"$*\" 将所有参数合并为一个字符串：\"$1 $2 $3 ...\"\n\n这个区别在参数包含空格时尤为重要：\n  假设传入参数为 \"hello world\" 和 \"foo\"\n  \"$@\"  → \"hello world\" \"foo\"    （2 个参数，保持原样）\n  \"$*\"  → \"hello world foo\"      （1 个字符串，空格无法区分）\n\n最佳实践：\n  - 遍历参数时始终使用 \"$@\"：for arg in \"$@\"; do ... done\n  - 传递参数给其他命令时使用 \"$@\"：some_command \"$@\"\n  - 除非明确需要合并参数，否则不要使用 $*"

[[symbols.examples]]
explanation = "显示所有传入的位置参数，每个参数保持独立"
simulated_output = "hello world"
id = "all_args-example-001"
command_id = "v04-ref-65def0ea7d"

[[symbols.examples]]
