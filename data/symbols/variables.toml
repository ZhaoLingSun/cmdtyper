
[meta]
id = "variables"
topic = "Shell 变量"
description = "学习 Shell 中的特殊变量与变量展开语法，掌握变量引用、退出状态、位置参数和进程标识等核心概念"
difficulty = "basic"
icon = "📦"

[[symbols]]
id = "var_reference"
char_repr = "$VAR"
name = "变量引用"
summary = "通过 $ 前缀引用变量的值，Shell 会将其展开为变量的实际内容"
explanation = "$ 是 Shell 中最基本的变量展开操作符。在变量名前加上 $ 符号，\nShell 会在执行命令之前将其替换为该变量的实际值。\n\n常见的环境变量：\n  $HOME     当前用户的家目录（如 /home/ace）\n  $USER     当前登录的用户名\n  $PATH     可执行文件搜索路径列表\n  $SHELL    当前用户的默认 Shell 程序\n  $PWD      当前工作目录\n  $LANG     系统语言和编码设置\n\n注意事项：\n  - 引用未定义的变量会得到空字符串（不会报错）\n  - 变量名区分大小写：$HOME 和 $home 是不同的变量\n  - 在双引号内 $ 仍然会展开，在单引号内则不会"

[[symbols.examples]]
explanation = "显示当前用户的家目录路径"
simulated_output = "/home/ace"
id = "var_reference-example-001"
command_id = "echo-var-home"

[[symbols.examples]]
explanation = "显示系统的可执行文件搜索路径，各路径之间用冒号分隔"
simulated_output = "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
id = "var_reference-example-002"
command_id = "shared-3c823467ea66ecb3"

[[symbols.examples]]
explanation = "显示当前用户的默认 Shell 程序路径"
simulated_output = "/bin/bash"
id = "var_reference-example-003"
command_id = "echo-var-shell"

[[symbols]]
id = "var_brace"
char_repr = "${VAR}"
name = "花括号变量引用"
summary = "用花括号明确界定变量名的边界，避免与相邻字符混淆"
explanation = "${VAR} 与 $VAR 的作用相同，但花括号明确标出了变量名的边界。\n当变量名紧跟其他字符时，必须使用花括号来消除歧义。\n\n对比示例：\n  $USERname    — Shell 会尝试找名为 USERname 的变量（通常未定义，返回空）\n  ${USER}name  — Shell 找到 USER 变量并在其值后拼接 name\n\n花括号形式还支持更高级的变量操作：\n  ${VAR:-默认值}    变量未定义时使用默认值\n  ${VAR:=默认值}    变量未定义时赋予默认值\n  ${#VAR}          返回变量值的字符长度\n  ${VAR%后缀}      删除最短匹配的后缀\n  ${VAR%%后缀}     删除最长匹配的后缀\n  ${VAR#前缀}      删除最短匹配的前缀\n  ${VAR##前缀}     删除最长匹配的前缀\n\n建议：在脚本中始终使用 ${VAR} 形式，可读性更好，也更不容易出错。"

[[symbols.examples]]
explanation = "在变量后拼接路径，花括号确保 Shell 正确识别变量名为 HOME"
simulated_output = "/home/ace/docs"
id = "var_brace-example-001"
command_id = "v04-ref-521aa3cf1e"

[[symbols.examples]]
