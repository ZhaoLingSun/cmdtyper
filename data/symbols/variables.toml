id = "current_pid-example-003"
command_id = "shared-1c9356df2612b1c3"

[[symbols]]
id = "last_bg_pid"
char_repr = "$!"
name = "后台进程 PID"
summary = "返回最近一个被放入后台运行的进程的 PID"
explanation = "$! 保存最近一个被放入后台执行的进程的 PID（进程标识符）。\n\n当使用 & 符号将命令放入后台运行时，Shell 会立即返回控制权，\n同时将该后台进程的 PID 存入 $! 变量。\n\n常见用途：\n  - 记录后台进程以便稍后终止：\n    long_task &\n    BG_PID=$!\n    # ... 其他操作 ...\n    kill $BG_PID\n\n  - 等待特定后台进程完成：\n    some_command &\n    wait $!\n    echo \"后台任务已完成\"\n\n  - 监控后台进程是否仍在运行：\n    if kill -0 $! 2>/dev/null; then\n        echo \"进程仍在运行\"\n    fi\n\n注意：如果没有后台进程，$! 的值为空。"

[[symbols.examples]]
explanation = "将 sleep 命令放入后台运行，立即显示其 PID"
simulated_output = "[1] 31592\n31592"
id = "last_bg_pid-example-001"
command_id = "v04-ref-08aee02fbd"

[[symbols.examples]]
