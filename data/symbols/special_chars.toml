[[symbols]]
id = "exclamation"
char_repr = "!"
name = "感叹号（历史展开与逻辑非）"
summary = "用于历史命令展开和逻辑非操作"
explanation = "感叹号 ! 在 Shell 中有两个主要用途：\n\n1. 历史命令展开（History Expansion）：\n   !!        重复执行上一条命令（最常见的用法：sudo !!）\n   !-2       执行倒数第二条命令\n   !字符串   执行最近一条以该字符串开头的命令（如 !vim）\n   !?模式    执行最近一条包含该模式的命令\n   !$        上一条命令的最后一个参数\n   !^        上一条命令的第一个参数\n\n2. 逻辑非操作（在条件表达式中）：\n   ! command    反转命令的退出码（成功变失败，失败变成功）\n   if ! grep -q pattern file; then ... fi\n\n常见用法：\n  sudo !!    —— 用 sudo 重新执行上一条命令（忘记加 sudo 时非常实用）\n\n注意：在双引号内，! 可能会触发历史展开。\n可以用单引号或反斜杠转义来避免：echo '!' 或 echo \\!"

[[symbols.examples]]
explanation = "重新执行上一条命令。最经典的用法是 sudo !! —— 用 root 权限重新运行刚才的命令"
simulated_output = "apt update\nE: Could not open lock file - open (13: Permission denied)"
id = "exclamation-example-001"
command_id = "history-repeat-last"

[[symbols.examples]]
explanation = "执行倒数第二条历史命令"
simulated_output = "ls -la /home/ace/Documents"
id = "exclamation-example-002"
command_id = "shared-c6e9ec062e689ef2"

[[symbols.examples]]
