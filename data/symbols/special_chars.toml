simulated_output = "逻辑非：false 取反为 true"
id = "exclamation-example-003"
command_id = "shared-83933fc5059a442a"

[[symbols]]
id = "comment"
char_repr = "#"
name = "井号（注释符）"
summary = "标记注释内容，Shell 会忽略 # 之后的所有文字"
explanation = "井号 # 用于在 Shell 脚本和命令行中添加注释。\n# 之后到行末的所有内容都会被 Shell 忽略，不会被执行。\n\n用法：\n  # 这是整行注释\n  echo hello   # 这是行尾注释\n\n在脚本中的特殊用法：\n  #!/bin/bash  —— Shebang（释伴），位于脚本第一行，\n  告诉系统用哪个解释器来执行这个脚本。\n  常见的 Shebang：\n    #!/bin/bash\n    #!/usr/bin/env python3\n    #!/bin/sh\n\n注意事项：\n  - # 只有在行首或者空格之后才被识别为注释符\n  - 在引号内的 # 不会被当作注释：echo \"价格是 #1\"\n  - 在参数展开中 ${#var} 表示获取变量长度，此时 # 不是注释"

[[symbols.examples]]
explanation = "Shell 只执行 echo hello，# 后面的文字被当作注释忽略"
simulated_output = "hello"
id = "comment-example-001"
command_id = "v04-ref-bc4e985372"

[[symbols.examples]]
explanation = "整行都是注释，Shell 会完全跳过，不产生任何输出"
simulated_output = ""
id = "comment-example-002"
command_id = "shared-6738c8fd57085ab9"

[[symbols.examples]]
