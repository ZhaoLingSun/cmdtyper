[[symbols]]
id = "dot_command"
char_repr = "."
name = "点号（source 命令 / 当前目录）"
summary = "在当前 Shell 环境中执行脚本文件，或表示当前目录"
explanation = "点号 . 在 Shell 中有两个重要含义：\n\n1. 点命令（source）—— 在当前 Shell 中加载执行脚本：\n   . 脚本文件    等价于 source 脚本文件\n\n   普通执行脚本（bash script.sh 或 ./script.sh）会启动一个子 Shell，\n   脚本中设置的变量和环境更改在脚本结束后就消失了。\n   而 . 或 source 命令在当前 Shell 环境中执行脚本，\n   脚本中所做的更改（如变量赋值、函数定义、cd 目录）会保留在当前 Shell 中。\n\n   最常见的用法：\n     . ~/.bashrc    —— 重新加载 Bash 配置文件\n     . .env         —— 加载环境变量文件\n\n2. 表示当前目录：\n   .              当前目录\n   ..             上级目录\n   ./script.sh    执行当前目录下的脚本"

[[symbols.examples]]
explanation = "在当前 Shell 中重新加载 .bashrc 配置文件，使修改立即生效"
simulated_output = ""
id = "dot_command-example-001"
command_id = "v04-ref-63eeb676b1"

[[symbols.examples]]
explanation = "与 . ~/.bashrc 完全等价，source 是点命令的可读性更好的写法"
simulated_output = ""
id = "dot_command-example-002"
