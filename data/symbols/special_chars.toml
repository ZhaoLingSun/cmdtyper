command_id = "shared-0d59864df8274e94"

[[symbols]]
id = "background"
char_repr = "&"
name = "后台执行符"
summary = "将命令放到后台执行，立即返回终端控制权"
explanation = "在命令末尾加上 & 符号，Shell 会将该命令放到后台执行，\n并立即返回命令提示符，让你可以继续输入其他命令。\n\n语法：命令 &\n\n后台执行后，Shell 会输出两个信息：\n  [作业号] 进程ID\n  例如：[1] 12345\n\n常用操作：\n  jobs        查看所有后台作业\n  fg %1       将作业 1 切换到前台\n  bg %1       让暂停的作业 1 在后台继续运行\n  kill %1     终止后台作业 1\n\n注意事项：\n  - 后台命令的输出仍然会显示在终端中，可能干扰你的输入\n  - 如果要完全静默后台执行：命令 > /dev/null 2>&1 &\n  - 关闭终端时后台进程会收到 SIGHUP 信号并退出，\n    使用 nohup 命令可以避免这个问题：nohup 命令 &"

[[symbols.examples]]
explanation = "将 sleep 命令放到后台执行，终端立即可用"
simulated_output = "[1] 28456"
id = "background-example-001"
command_id = "v04-ref-7dcc710e11"

[[symbols.examples]]
