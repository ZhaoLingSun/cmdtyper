[[symbols]]
id = "logical_or"
char_repr = "||"
name = "逻辑或（OR）"
summary = "仅当前一条命令失败时，才执行下一条命令"
explanation = "|| 是 Shell 中的逻辑或运算符，与 && 相反。\n只有当左侧命令的退出码为非 0（表示失败）时，右侧命令才会执行。\n如果左侧命令成功（退出码为 0），右侧命令会被跳过。\n\n语法：命令A || 命令B\n\n同样是\"短路求值\"：\n  A OR B —— 如果 A 已经为真，整个表达式必定为真，无需再计算 B。\n\n典型使用场景：\n  - 错误处理：cd /important || echo \"目录不存在\"\n  - 提供备选方案：command -v vim || command -v nano\n  - 默认值模式：grep pattern file || echo \"未找到匹配项\"\n\n常见组合技巧（&& 和 || 搭配使用，模拟 if-else）：\n  命令 && echo \"成功\" || echo \"失败\"\n  注意：这不是严格的 if-else，如果 echo \"成功\" 自身失败，\"失败\" 也会执行。"

[[symbols.examples]]
explanation = "尝试进入一个不存在的目录，失败后执行 echo 输出提示信息"
simulated_output = "bash: cd: /nonexistent: No such file or directory\n目录不存在"
id = "logical_or-example-001"
command_id = "v04-ref-f7b6ee0c8e"

