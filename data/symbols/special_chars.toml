[[symbols]]
id = "tilde"
char_repr = "~"
name = "波浪号（主目录快捷方式）"
summary = "表示当前用户的主目录路径，也可以指定其他用户的主目录"
explanation = "波浪号 ~ 是 Shell 中主目录（Home Directory）的快捷表示。\nShell 在执行命令前会将 ~ 展开为实际的目录路径。\n\n展开规则：\n  ~         当前用户的主目录（等价于 $HOME，如 /home/ace）\n  ~/路径    当前用户主目录下的子路径\n  ~用户名   指定用户的主目录（如 ~root 展开为 /root）\n  ~+        当前工作目录（等价于 $PWD）\n  ~-        前一个工作目录（等价于 $OLDPWD）\n\n常见用法：\n  cd ~            回到主目录\n  ls ~/Documents  列出主目录下 Documents 文件夹\n  cp file ~       将文件复制到主目录\n\n注意：\n  - ~ 只有在路径开头时才会被展开\n  - 在引号内不展开：\"~\" 保持原样为字符 ~\n  - 不加引号时才会展开：cd ~"

[[symbols.examples]]
explanation = "快速返回当前用户的主目录，等价于 cd $HOME 或 cd /home/ace"
simulated_output = ""
id = "tilde-example-001"
command_id = "cd-home-tilde"

