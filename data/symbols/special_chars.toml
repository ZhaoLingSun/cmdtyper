
[meta]
id = "special_chars"
topic = "特殊字符"
description = "学习 Shell 中常见的特殊字符：命令分隔、逻辑运算、后台执行、注释等"
difficulty = "basic"
icon = "⚡"

[[symbols]]
id = "semicolon"
char_repr = ";"
name = "分号（命令分隔符）"
summary = "按顺序依次执行多条命令，无论前一条是否成功"
explanation = "分号 ; 是最简单的命令连接符，用于将多条命令写在同一行上依次执行。\nShell 会按从左到右的顺序逐条运行，无论前一条命令是成功还是失败，\n后面的命令都会继续执行。\n\n语法：命令A ; 命令B ; 命令C\n\n与换行的关系：\n  分号的作用和换行符完全一样——在脚本中，每条命令各占一行时不需要分号，\n  但如果要把多条命令写在同一行，就必须用分号分隔。\n\n与 && 和 || 的区别：\n  ; 不检查前一条命令的退出码（exit code），总是继续执行。\n  && 只在前一条成功（exit code 0）时才执行下一条。\n  || 只在前一条失败（exit code 非 0）时才执行下一条。"

[[symbols.examples]]
explanation = "依次输出两个字符串，无论第一条是否成功，第二条都会执行"
simulated_output = "hello\nworld"
id = "semicolon-example-001"
command_id = "v04-ref-0cc404dda0"

[[symbols.examples]]
explanation = "创建目录、进入目录、打印当前路径——三条命令顺序执行"
simulated_output = "/home/ace/test"
id = "semicolon-example-002"
command_id = "shared-d0c3b1242d16f169"

[[symbols.examples]]
explanation = "即使 ls 访问不存在的路径报错，分号后的 echo 仍然会执行"
simulated_output = "ls: cannot access '/nonexistent': No such file or directory\n依然会执行"
id = "semicolon-example-003"
command_id = "shared-8d3285aa2966d721"

[[symbols]]
id = "logical_and"
char_repr = "&&"
name = "逻辑与（AND）"
summary = "仅当前一条命令成功时，才执行下一条命令"
explanation = "&& 是 Shell 中的逻辑与运算符，用于条件性地连接两条命令。\n只有当左侧命令的退出码为 0（表示成功）时，右侧命令才会执行。\n如果左侧命令失败（退出码非 0），右侧命令会被跳过。\n\n语法：命令A && 命令B\n\n这种行为被称为\"短路求值\"（short-circuit evaluation），来源于布尔逻辑：\n  A AND B —— 如果 A 已经为假，整个表达式必定为假，无需再计算 B。\n\n典型使用场景：\n  - 先编译再运行：gcc main.c -o main && ./main\n  - 先进入目录再操作：cd /project && make\n  - 安全的多步操作：apt update && apt upgrade\n\n&& 可以链接多条命令，每一步都必须成功才会继续：\n  命令A && 命令B && 命令C && 命令D"

[[symbols.examples]]
explanation = "创建目录成功后才进入该目录，进入成功后才打印路径。任何一步失败就会停止"
simulated_output = "/home/ace/newdir"
id = "logical_and-example-001"
command_id = "v04-ref-1f031c60cf"

[[symbols.examples]]
