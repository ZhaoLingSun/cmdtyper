
[meta]
id = "regex_basics"
topic = "正则表达式基础"
description = "学习 Shell 和命令行工具中常用的正则表达式元字符，掌握文本模式匹配的核心概念"
difficulty = "advanced"
icon = "🔤"

[[symbols]]
id = "regex_dot"
char_repr = "."
name = "点号元字符"
summary = "匹配除换行符以外的任意单个字符"
explanation = "点号 . 是正则表达式中最基础的元字符之一，它匹配任意一个字符（除换行符 \\n 外）。\n\n基本规则：\n  h.t       匹配 hat、hit、hot、hut 等（中间恰好一个任意字符）\n  c.t       匹配 cat、cut、cot 等\n  ..t       匹配任意两个字符后面跟 t 的模式\n\n重要特性：\n  - 一个 . 恰好匹配一个字符，不多不少\n  - 可以连续使用多个点号：... 匹配任意三个字符\n  - 如果要匹配字面量的点号，需要用反斜杠转义：\\.\n\n常见用法：\n  grep 'h.t' file       在 file 中搜索 h 加任意字符加 t 的模式\n  grep '...' file       搜索至少包含三个连续字符的行"

[[symbols.examples]]
explanation = "用点号匹配 h 和 t 之间的任意一个字符，ht 因为中间没有字符所以不匹配"
simulated_output = "hat\nhit\nhot\nhut"
id = "regex_dot-example-001"
command_id = "v04-ref-2b197f9615"

[[symbols.examples]]
explanation = "匹配 c 加任意一个字符加 t 的模式；cart 不匹配因为 c 和 t 之间有两个字符"
simulated_output = "cat\ncut\ncot"
id = "regex_dot-example-002"
command_id = "shared-5f6840c0ef5020b1"

[[symbols.examples]]
explanation = "在 /etc 目录下查找文件名中包含 h 加两个任意字符加 t 的文件"
simulated_output = "host.conf\nhosts"
id = "regex_dot-example-003"
command_id = "shared-0fb096b6071a53c2"

[[symbols]]
id = "regex_star"
char_repr = "*"
name = "星号量词"
summary = "匹配前面的元素出现零次或多次（贪婪匹配）"
explanation = "在正则表达式中，星号 * 表示前面的字符或元素可以出现零次或多次。\n\n注意区别：\n  - Shell 通配符中 * 单独表示\"任意字符串\"\n  - 正则表达式中 * 是量词，必须跟在某个元素后面\n\n基本规则：\n  ab*c      匹配 ac、abc、abbc、abbbc ...（b 出现零次或多次）\n  go*gle    匹配 ggle、gogle、google、gooogle ...\n  .*        匹配任意长度的任意字符串（. 加 * 的组合）\n\n特殊组合：\n  .*  是\"万能匹配\"，等同于 Shell 通配符中的 *\n  它在 grep 中常用于模糊搜索：grep 'error.*fail' 表示匹配\n  error 和 fail 之间有任意内容的行。\n\n重要：* 是贪婪的，它会尽可能多地匹配字符。"

[[symbols.examples]]
explanation = "星号使 b 可以出现零次或多次，因此 ac（零个 b）和 abc、abbc 等都匹配"
simulated_output = "ac\nabc\nabbc\nabbbc"
id = "regex_star-example-001"
command_id = "v04-ref-53eb9456ab"

[[symbols.examples]]
explanation = "o 出现零次或多次都匹配，所以 ggle 到 gooogle 全部被选中"
simulated_output = "ggle\ngogle\ngoogle\ngooogle"
id = "regex_star-example-002"
command_id = "shared-34a4c271befb01f4"

[[symbols.examples]]
explanation = "搜索同一行中先出现 error 后出现 timeout 的日志条目，中间可以有任意内容"
simulated_output = "Mar  8 10:15:23 server kernel: error: connection timeout after 30s\nMar  8 14:22:01 server app[1234]: error reading socket: timeout exceeded"
id = "regex_star-example-003"
command_id = "shared-6ce5f988fa252d6e"

[[symbols]]
id = "regex_plus"
char_repr = "+"
name = "加号量词"
summary = "匹配前面的元素出现一次或多次（扩展正则表达式）"
explanation = "加号 + 是扩展正则表达式（ERE）中的量词，表示前面的元素必须出现至少一次。\n\n与 * 的区别：\n  * 匹配零次或多次 → 前面的元素可以不出现\n  + 匹配一次或多次 → 前面的元素至少出现一次\n\n使用要求：\n  + 属于扩展正则表达式，需要使用以下方式之一：\n  - grep -E（或 egrep）\n  - sed -E\n  - awk（默认支持 ERE）\n\n基本规则：\n  go+gle    匹配 gogle、google、gooogle ...（但不匹配 ggle）\n  [0-9]+    匹配一个或多个连续数字\n\n在基本正则表达式（BRE）中需要转义：grep 'go\\+gle' 等价于 grep -E 'go+gle'"

[[symbols.examples]]
explanation = "加号要求 o 至少出现一次，所以 ggle（零个 o）不匹配，其余都匹配"
simulated_output = "gogle\ngoogle\ngooogle"
id = "regex_plus-example-001"
command_id = "v04-ref-ccdc4ac912"

[[symbols.examples]]
explanation = "匹配 g 后面跟一个或多个 o 再跟 l 的模式，gl 因为没有 o 而不匹配"
simulated_output = "gol\ngool\ngoool"
id = "regex_plus-example-002"
command_id = "shared-7faabda4b08594e4"

[[symbols.examples]]
explanation = "匹配包含一个或多个连续数字的行"
simulated_output = "a1b2c3\n123\nabc123"
id = "regex_plus-example-003"
command_id = "shared-e280a2ee37a0bba4"

[[symbols]]
id = "regex_question"
char_repr = "?"
name = "问号量词"
summary = "匹配前面的元素出现零次或一次（扩展正则表达式）"
explanation = "问号 ? 是扩展正则表达式中的量词，表示前面的元素可以出现零次或恰好一次。\n\n它使前面的元素变成\"可选的\"：\n  colou?r     匹配 color 和 colour（u 是可选的）\n  https?      匹配 http 和 https（s 是可选的）\n  -?[0-9]+    匹配可选负号后跟数字（匹配正数和负数）\n\n使用要求：\n  和 + 一样，? 属于扩展正则表达式，需要：\n  - grep -E（或 egrep）\n  - sed -E\n\n在基本正则表达式中需要转义：grep 'colou\\?r' 等价于 grep -E 'colou?r'\n\n典型应用场景：\n  - 处理美式/英式拼写差异\n  - 匹配协议前缀（http/https）\n  - 处理可选的符号或前缀"

[[symbols.examples]]
explanation = "问号使 u 可选，color 和 colour 都匹配，但 colouur 有两个 u 所以不匹配整个模式"
simulated_output = "color\ncolour"
id = "regex_question-example-001"
command_id = "v04-ref-03fd4156f8"

[[symbols.examples]]
explanation = "匹配 http:// 和 https:// 两种协议前缀，s 是可选的"
simulated_output = "http://example.com\nhttps://example.com"
id = "regex_question-example-002"
command_id = "shared-d750ecb50dcb07a2"

[[symbols.examples]]
explanation = "匹配可选负号后跟一个或多个数字的整数，+10 和 3.14 不匹配"
simulated_output = "42\n-7"
id = "regex_question-example-003"
command_id = "shared-a30a2d57137c145e"

[[symbols]]
id = "regex_caret"
char_repr = "^"
name = "脱字符（行首锚点）"
summary = "匹配行的开头位置，限定模式必须出现在行首"
explanation = "脱字符 ^ 是一个位置锚点，它不匹配任何字符，而是匹配行的起始位置。\n\n将 ^ 放在模式开头，表示该模式必须出现在行首：\n  ^root      匹配以 root 开头的行\n  ^#         匹配以 # 开头的行（通常是注释）\n  ^$         匹配空行（行首紧接行尾）\n\n注意 ^ 在不同位置的含义：\n  - 在模式开头：行首锚点\n  - 在 [] 字符类中的第一个位置 [^abc]：取反，表示\"不是 a、b、c 中的任何一个\"\n  - 在其他位置：匹配字面量 ^\n\n常用场景：\n  - 过滤配置文件中的注释行：grep '^#' config\n  - 查找特定用户的条目：grep '^username:' /etc/passwd\n  - 删除空行：grep -v '^$' file"

[[symbols.examples]]
explanation = "查找 /etc/passwd 中以 root 开头的行，通常会匹配到 root 用户的条目"
simulated_output = "root:x:0:0:root:/root:/bin/bash"
id = "regex_caret-example-001"
command_id = "v04-ref-80bca3c0cf"

[[symbols.examples]]
explanation = "过滤出以 # 号开头的注释行"
simulated_output = "# 这是注释\n# 另一个注释"
id = "regex_caret-example-002"
command_id = "shared-455ebd690477634e"

[[symbols.examples]]
explanation = "统计配置文件中空行的数量（^$ 表示行首紧接行尾，即空行）"
simulated_output = "5"
id = "regex_caret-example-003"
command_id = "shared-0ff5b496d91c8b70"

[[symbols]]
id = "regex_dollar"
char_repr = "$"
name = "美元符号（行尾锚点）"
summary = "匹配行的结尾位置，限定模式必须出现在行尾"
explanation = "美元符号 $ 是行尾锚点，它不匹配任何字符，而是匹配行的结束位置。\n\n将 $ 放在模式末尾，表示该模式必须出现在行尾：\n  bash$       匹配以 bash 结尾的行\n  \\.conf$     匹配以 .conf 结尾的行（\\. 转义点号）\n  ^$          匹配空行（配合 ^ 使用）\n\n注意：在正则表达式中，$ 只有在模式末尾时才是行尾锚点。\n在其他位置它可能匹配字面量 $（取决于工具的具体实现）。\n\n常见组合：\n  ^...$       精确匹配整行内容\n  ^.*pattern$ 匹配以 pattern 结尾的行\n  grep -v '^ *$'  过滤空行和只包含空格的行\n\n常用场景：\n  - 查找使用特定 Shell 的用户：grep 'bash$' /etc/passwd\n  - 查找特定类型的文件名：grep '\\.log$' filelist.txt\n  - 配合 ^ 做精确匹配：grep '^exact_match$' file"

[[symbols.examples]]
explanation = "查找 /etc/passwd 中以 bash 结尾的行，即使用 bash 作为登录 Shell 的用户"
simulated_output = "root:x:0:0:root:/root:/bin/bash\nace:x:1000:1000:Ace:/home/ace:/bin/bash"
id = "regex_dollar-example-001"
command_id = "v04-ref-8ac908ef45"

[[symbols.examples]]
explanation = "查找以 .conf 结尾的行；用 \\. 转义确保匹配字面量点号，$ 确保在行尾"
simulated_output = "readme.conf\nsetup.conf"
id = "regex_dollar-example-002"
command_id = "shared-396b93f323ae6053"

[[symbols.examples]]
explanation = "查找长度不超过 40 个字符的行（从行首到行尾最多 40 个任意字符）"
simulated_output = "short line\nthis is a medium line here\nanother short one"
id = "regex_dollar-example-003"
command_id = "shared-e9268f8002ee7025"

[[symbols]]
id = "regex_bracket"
char_repr = "[]"
name = "方括号字符类"
summary = "匹配方括号内指定的任意一个字符或字符范围"
explanation = "方括号 [] 定义一个字符类，匹配其中列出的任意一个字符。\n\n基本语法：\n  [aeiou]     匹配任意一个元音字母\n  [0-9]       匹配任意一个数字（范围表示法）\n  [a-zA-Z]    匹配任意一个英文字母\n  [a-z0-9_]   匹配小写字母、数字或下划线\n\n取反（否定字符类）：\n  [^abc]      匹配除 a、b、c 以外的任意一个字符\n  [^0-9]      匹配任意一个非数字字符\n  [^a-z]      匹配任意一个非小写字母字符\n\n特殊字符在 [] 内的处理：\n  - ] 需要放在第一个位置或转义：[]abc] 或 [a\\]bc]\n  - - 需要放在首尾位置或转义：[-abc] 或 [abc-]\n  - ^ 只在第一个位置表示取反，其他位置是普通字符\n  - . * + 等元字符在 [] 内失去特殊含义\n\n字符类是正则表达式中精确控制匹配范围的核心工具。"

[[symbols.examples]]
explanation = "匹配包含至少一个元音字母的行（几乎所有英文单词都会匹配）"
simulated_output = "apple\nbanana\norange\numbrella"
id = "regex_bracket-example-001"
command_id = "v04-ref-f66555e840"

[[symbols.examples]]
explanation = "匹配包含至少一个数字的行"
simulated_output = "a1b2\n123"
id = "regex_bracket-example-002"
command_id = "shared-66eb182d9b67d3a2"

[[symbols.examples]]
explanation = "匹配包含至少一个非小写字母字符的行；hello 纯小写所以不匹配"
simulated_output = "Hello\nHELLO\n123abc"
id = "regex_bracket-example-003"
command_id = "shared-c14ba0084337728e"

[[symbols]]
id = "regex_group"
char_repr = "()"
name = "圆括号分组"
summary = "将多个元素组合为一个整体，可配合量词或交替使用（扩展正则表达式）"
explanation = "圆括号 () 在扩展正则表达式中用于将模式元素分组，使其作为一个整体参与运算。\n\n分组的主要用途：\n\n1. 配合量词重复整组模式：\n   (ab)+      匹配 ab、abab、ababab ...（整个 ab 重复）\n   (ha){2,}   匹配 haha、hahaha ...（ha 至少重复两次）\n\n2. 配合交替符 | 进行\"或\"匹配：\n   (error|warning)     匹配 error 或 warning\n   (cat|dog) food      匹配 cat food 或 dog food\n\n3. 反向引用（在支持的工具中）：\n   (word).*\\1          匹配同一个 word 出现两次的行\n\n使用要求：\n  () 属于扩展正则表达式，需要 grep -E 或 egrep。\n  在基本正则表达式中需要转义：grep '\\(ab\\)\\+' 等价于 grep -E '(ab)+'\n\n注意：在交替匹配中，| 的优先级很低，所以 abc|def 匹配的是 abc 或 def，\n而不是 ab(c|d)ef。使用分组可以精确控制 | 的作用范围。"

[[symbols.examples]]
explanation = "用行首行尾锚点限制整行只由一个或多个 ab 分组组成，aabb 不匹配"
simulated_output = "ab\nabab\nababab"
id = "regex_group-example-001"
command_id = "v04-ref-7452f01c9c"

[[symbols.examples]]
explanation = "在系统日志中搜索包含 error 或 warning 的行，使用分组配合交替符"
simulated_output = "Mar  8 08:01:12 server kernel: warning: low memory\nMar  8 08:15:33 server app[921]: error: connection refused\nMar  8 09:22:01 server sshd[1042]: warning: authentication failure\nMar  8 10:05:44 server nginx[780]: error: upstream timeout\nMar  8 10:30:17 server kernel: warning: disk space low"
id = "regex_group-example-002"
command_id = "shared-233669ba9c5a0777"

[[symbols.examples]]
explanation = "匹配 ha 重复两次或更多次且占满整行的字符串"
simulated_output = "haha\nhahaha"
id = "regex_group-example-003"
command_id = "shared-980f161ee091bd1d"

