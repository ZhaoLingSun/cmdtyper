
[meta]
id = "quotes_escape"
topic = "引号与转义"
description = "学习 Shell 中单引号、双引号、反斜杠转义、反引号和命令替换的用法，掌握字符串引用与特殊字符处理"
difficulty = "basic"
icon = "💬"

[[symbols]]
id = "single_quote"
char_repr = "'"
name = "单引号"
summary = "强引用：阻止所有变量展开和命令替换，内容原样保留"
explanation = "单引号 ' 是 Shell 中最强的引用方式，被称为\"强引用\"（strong quoting）。\n在单引号内部，所有特殊字符都失去其特殊含义，被当作普通字符处理：\n  - $ 不会触发变量展开\n  - ` 不会触发命令替换\n  - \\ 不会被当作转义符\n  - 甚至换行符也被原样保留\n\n唯一的限制：单引号内部不能包含单引号本身。\n如果需要在单引号字符串中嵌入单引号，常用技巧是：\n  'It'\\''s done'\n这实际上是三段拼接：'It' + \\' + 's done'\n\n适用场景：\n  - 需要原样输出包含 $ 等特殊字符的字符串时\n  - 在 grep、awk 等命令中传递正则表达式时\n  - 避免意外的变量展开导致安全问题时"

[[symbols.examples]]
explanation = "单引号阻止变量展开，$HOME 被原样输出而非展开为家目录路径"
simulated_output = "$HOME"
id = "single_quote-example-001"
command_id = "env-echo-home-literal"

[[symbols.examples]]
explanation = "使用单引号保护包含空格的字符串，防止 Shell 进行单词分割"
simulated_output = "hello world"
id = "single_quote-example-002"
command_id = "echo-text"

[[symbols.examples]]
explanation = "单引号内 $100 不会被当作变量展开，原样输出美元符号和数字"
simulated_output = "price is $100"
id = "single_quote-example-003"
command_id = "shared-0109c6ff806056cc"

[[symbols]]
id = "double_quote"
char_repr = "\""
name = "双引号"
summary = "弱引用：允许变量展开和命令替换，但阻止单词分割和通配符展开"
explanation = "双引号 \" 是 Shell 中的\"弱引用\"（weak quoting）。\n在双引号内部，大部分特殊字符失去含义，但以下三种仍然有效：\n  - $ 仍然触发变量展开（$VAR）和命令替换（$(cmd)）\n  - ` 仍然触发命令替换（旧语法）\n  - \\ 仍然可以转义 $、`、\"、\\ 和换行符\n\n双引号的核心作用：\n  1. 防止单词分割（word splitting）：含空格的变量值不会被拆成多个参数\n  2. 防止通配符展开（globbing）：* 和 ? 被当作普通字符\n  3. 允许变量插值：可以在字符串中嵌入变量值\n\n最佳实践：在引用变量时，几乎总是应该加双引号：\n  \"$variable\" 而不是 $variable\n这是 Shell 脚本中最常见的安全建议。"

[[symbols.examples]]
explanation = "双引号内 $HOME 会被展开为用户家目录的实际路径"
simulated_output = "/home/ace"
id = "double_quote-example-001"
command_id = "env-echo-home-quoted"

[[symbols.examples]]
explanation = "双引号允许变量插值，$USER 被替换为当前登录的用户名"
simulated_output = "hello ace"
id = "double_quote-example-002"
command_id = "shared-5bfd67c74f42b94b"

[[symbols.examples]]
explanation = "双引号内的 $() 命令替换仍然有效，ls 的输出被嵌入到字符串中"
simulated_output = "files: Desktop Documents Downloads Music Pictures"
id = "double_quote-example-003"
command_id = "shared-02f71699ff0d26dc"

[[symbols]]
id = "backslash"
char_repr = "\\"
name = "反斜杠（转义符）"
summary = "转义单个字符，使其失去特殊含义或产生特殊效果"
explanation = "反斜杠 \\ 是 Shell 中的转义字符（escape character）。\n它可以移除紧跟其后的单个字符的特殊含义。\n\n常见用法：\n  \\$ — 输出字面量的美元符号，阻止变量展开\n  \\\" — 在双引号内输出字面量的双引号\n  \\\\ — 输出字面量的反斜杠本身\n  \\  — 转义空格，使其不触发单词分割（常用于文件名包含空格的情况）\n\n在双引号内部，\\ 只能转义以下字符：$、`、\"、\\ 和换行符。\n对于其他字符（如 \\n），反斜杠会被原样保留。\n\n在命令行末尾，\\ 加换行符表示\"续行\"：\n  ls \\\n    -la \\\n    /home\n等价于 ls -la /home，常用于将长命令分成多行书写。"

[[symbols.examples]]
explanation = "在双引号内用 \\$ 阻止变量展开，输出字面量的美元符号"
simulated_output = "price is $100"
id = "backslash-example-001"
command_id = "v04-ref-7b96a288ac"

[[symbols.examples]]
explanation = "用反斜杠转义空格，使 Shell 将其视为单个文件名而非三个参数"
simulated_output = "file with spaces"
id = "backslash-example-002"
command_id = "shared-7e385177ee770a84"

[[symbols.examples]]
explanation = "在双引号内用 \\\" 输出字面量的双引号字符"
simulated_output = "she said \"hello\""
id = "backslash-example-003"
command_id = "shared-fbac92780ebb408f"

[[symbols]]
id = "backtick"
char_repr = "`"
name = "反引号（旧式命令替换）"
summary = "执行反引号内的命令并用其输出替换该位置（已被 $() 取代）"
explanation = "反引号 ` 是早期 Shell 中进行命令替换的语法。\n将命令写在一对反引号之间，Shell 会先执行该命令，\n然后将整个反引号表达式替换为命令的标准输出。\n\n语法：`命令`\n\n反引号的问题：\n  1. 难以嵌套：`cmd1 \\`cmd2\\`` 可读性极差\n  2. 反斜杠行为不一致：在反引号内 \\ 的处理规则复杂且容易出错\n  3. 视觉上容易与单引号 ' 混淆\n\n因此，现代 Shell 脚本推荐使用 $() 代替反引号。\n$() 语法清晰、支持嵌套、反斜杠行为可预测。\n\n但在阅读旧脚本或兼容 POSIX sh 的场景中，仍会遇到反引号。"

[[symbols.examples]]
explanation = "反引号内的 date 命令被执行，其输出替换了反引号表达式"
simulated_output = "Sun Mar  8 15:30:42 CST 2026"
id = "backtick-example-001"
command_id = "v04-ref-72ea6fefa3"

[[symbols.examples]]
explanation = "在双引号内使用反引号进行命令替换，获取格式化的当前日期"
simulated_output = "today is 2026-03-08"
id = "backtick-example-002"
command_id = "shared-5ec792848443ff7c"

[[symbols.examples]]
explanation = "组合两个反引号命令替换，显示 用户名@主机名 的格式"
simulated_output = "ace@cmdtyper"
id = "backtick-example-003"
command_id = "shared-1e5adadc3e23861d"

[[symbols]]
id = "command_substitution"
char_repr = "$()"
name = "命令替换"
summary = "执行括号内的命令并用其标准输出替换该位置（推荐用法）"
explanation = "$() 是现代 Shell 中推荐的命令替换语法。\n它执行括号内的命令，将命令的标准输出（去掉末尾换行）替换到当前位置。\n\n语法：$(命令)\n\n相比反引号 ` 的优势：\n  1. 支持清晰的嵌套：$(cmd1 $(cmd2))\n  2. 反斜杠行为一致且可预测\n  3. 不会与单引号混淆，可读性更好\n  4. 所有现代 Shell（bash、zsh、dash 等）都支持\n\n常见使用模式：\n  变量赋值：result=$(some_command)\n  字符串插值：\"当前目录：$(pwd)\"\n  条件判断：if [ $(id -u) -eq 0 ]; then ...\n  命令参数：tar czf backup-$(date +%F).tar.gz /data\n\n嵌套示例：\n  echo \"lines: $(cat $(find . -name '*.log') | wc -l)\"\n  先查找所有 .log 文件，再统计总行数。"

[[symbols.examples]]
explanation = "$(whoami) 执行 whoami 命令，输出被替换为当前用户名"
simulated_output = "ace"
id = "command_substitution-example-001"
command_id = "v04-ref-3a8a258d43"

[[symbols.examples]]
