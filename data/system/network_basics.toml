[[sections]]
id = "firewall-ufw"
title = "防火墙 (ufw)"
description = "UFW（Uncomplicated Firewall）是 Ubuntu/Debian 系统默认的防火墙管理工具，\n它是 iptables 的简化前端，使防火墙配置更加直观。\n\n防火墙核心概念：\n  - 默认策略：允许所有出站（outgoing），拒绝所有入站（incoming）\n  - 规则按顺序匹配，第一条匹配的规则生效\n  - 常见操作：允许/拒绝 特定端口或服务\n\n注意：修改防火墙规则前，务必确保 SSH（22端口）已允许，\n否则远程连接将被中断！"

[[sections.commands]]
summary = "查看防火墙状态和规则（详细模式）"
simulated_output = "Status: active\nLogging: on (low)\nDefault: deny (incoming), allow (outgoing), disabled (routed)\nNew profiles: skip\n\nTo                         Action      From\n--                         ------      ----\n22/tcp                     ALLOW IN    Anywhere\n80/tcp                     ALLOW IN    Anywhere\n443/tcp                    ALLOW IN    Anywhere\n22/tcp (v6)                ALLOW IN    Anywhere (v6)\n80/tcp (v6)                ALLOW IN    Anywhere (v6)\n443/tcp (v6)               ALLOW IN    Anywhere (v6)"
id = "command-001"
command_id = "ufw-status"

