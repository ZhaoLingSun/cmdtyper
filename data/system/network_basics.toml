[[sections]]
id = "network-diagnostics"
title = "网络诊断"
description = "网络出问题时，需要系统性地排查。常用诊断思路：\n\n1. 本机网络是否正常？     → ip addr, ping 127.0.0.1\n2. 能否到达网关？         → ping 192.168.1.1\n3. 能否到达外网？         → ping 8.8.8.8\n4. DNS 是否正常？         → ping google.com, dig google.com\n5. 路径上哪一跳出问题？    → traceroute\n6. 特定端口是否可达？      → curl, telnet, nc\n\n这套排查流程从底层到应用层逐步验证，能快速定位问题所在。"

