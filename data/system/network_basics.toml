[[sections]]
id = "dns"
title = "DNS 解析"
description = "DNS（Domain Name System）将人类可读的域名转换为 IP 地址。\n\nDNS 解析过程：\n  浏览器缓存 → 系统缓存 → /etc/hosts → 本地 DNS 服务器 → 根域名服务器 → 顶级域服务器 → 权威服务器\n\nLinux 中的 DNS 配置：\n  /etc/resolv.conf — 指定 DNS 服务器地址\n  /etc/hosts       — 本地静态域名解析\n  /etc/nsswitch.conf — 名称解析顺序配置\n\n常用 DNS 工具：dig（推荐）、nslookup（传统）、host（简洁）"

