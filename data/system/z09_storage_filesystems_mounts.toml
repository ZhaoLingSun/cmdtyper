
[meta]
id = "storage_filesystems_mounts"
topic = "存储、文件系统与挂载"
description = "从块设备、文件系统、挂载点、容量和 inode 五个层次理解磁盘空间"
difficulty = "basic"
icon = "DISK"
overview = "块设备提供扇区，文件系统组织目录与 inode，挂载把文件系统根连接到目录树中的挂载点。\n“磁盘满”可能是字节空间、inode、配额或挂载目标错误。所有命令均为静态观察教材，应用不会读取或修改真实磁盘。"

[[sections]]
id = "block-device-filesystem-layer"
title = "块设备、分区与文件系统不是同一层"
description = "磁盘或虚拟磁盘通常表现为 /dev/sda、/dev/nvme0n1；分区是其中的范围；LVM、RAID、加密层还可能继续组合。\n文件系统（ext4、xfs、btrfs 等）在块设备之上管理文件名、inode、权限和空闲空间。\nlsblk 展示设备拓扑，-f 增加文件系统类型、UUID 和挂载信息；blkid 从设备元数据观察标识。\n先识别层次再讨论挂载，避免把“设备名”“UUID”“目录”混为一个对象。"

[[sections.commands]]
id = "lsblk-topology"
command_id = "disk-lsblk-size-mountpoints"

[[sections.commands]]
id = "lsblk-filesystems"
command_id = "disk-lsblk-filesystems"

[[sections.commands]]
id = "blkid-identifiers"
command_id = "disk-blkid-all"
deep_explanation = "UUID 适合稳定标识文件系统；设备名可能随启动和硬件顺序变化。"

[[sections]]
id = "mount-tree-and-namespace"
title = "挂载点把文件系统接入统一目录树"
description = "mount 不会把文件复制到目录，而是让某个文件系统在挂载点处可见。挂载后，挂载点原有内容会被暂时遮蔽，卸载后才再次可见。\nfindmnt 从当前挂载表按树或目标路径观察来源、类型和选项。容器可能拥有独立 mount namespace，因此宿主机与容器看到的挂载树可以不同。\n/etc/fstab 描述持久挂载意图，但编辑错误可能影响启动。真实变更前应先备份、校验设备标识与挂载点，再使用只读观察确认。\n卸载前还要验证没有进程占用路径；本专题不提供自动修改或强制卸载流程。"

[[sections.commands]]
id = "findmnt-root"
command_id = "disk-findmnt-root"

[[sections.commands]]
id = "findmnt-path-target"
command_id = "disk-findmnt-path-target"

[[sections.commands]]
id = "findmnt-static-columns"
summary = "观察根挂载的目标、来源、文件系统与选项"
simulated_output = "TARGET SOURCE         FSTYPE OPTIONS\n/      /dev/nvme0n1p2 ext4   rw,relatime"
command_id = "v04-ref-9993965839"

[[sections]]
id = "capacity-inodes-and-usage"
title = "df 看文件系统，du 看目录树；inode 也可能耗尽"
description = "df 从文件系统视角报告总量、已用、可用和挂载点；du 遍历目录项并汇总可见文件占用。\n两者不一致可能来自已删除但仍被进程打开的文件、稀疏文件、快照、权限不可见区域或挂载边界。\ndf -i 观察 inode 数量。大量小文件可能让 inode 先耗尽，即使仍有字节空间也无法创建新文件。\n先确定满的是哪个挂载点，再限定 du 的范围；不要从 / 开始盲目删除，也不要跨文件系统误算。"

[[sections.commands]]
id = "df-root-capacity"
command_id = "disk-df-human-root"

[[sections.commands]]
id = "df-root-inodes"
command_id = "disk-df-inodes-root"

[[sections.commands]]
id = "du-downloads-summary"
command_id = "disk-du-summary-downloads"

[[sections.commands]]
id = "du-project-depth"
command_id = "disk-du-project-depth-one"

[[sections]]
id = "disk-full-diagnosis-scenario"
title = "七步场景：应用报告 No space left on device"
description = "按顺序处理：\n1. 观察根文件系统字节使用率，不先假设就是根分区满。\n2. 验证目标路径实际属于哪个挂载点，防止检查错设备。\n3. 观察该文件系统的 inode 使用率，区分大文件与海量小文件。\n4. 核对块设备和文件系统映射，确认来源、类型与挂载点。\n5. 在已确认的边界内汇总目录，不跨挂载点扩大扫描。\n6. 复核候选大目录和业务保留策略，不凭文件名直接删除。\n7. 选择安全动作：清理已确认可再生数据、调整保留期或扩容；动作后重新观察 df/findmnt。"

[[sections.commands]]
id = "scenario-step-1-observe-bytes"
command_id = "disk-df-human-root"

[[sections.commands]]
id = "scenario-step-2-verify-mount"
command_id = "disk-findmnt-path-target"
deep_explanation = "findmnt -T 按路径找到承载它的挂载点，避免把 /var/log 错当成独立磁盘。"

[[sections.commands]]
id = "scenario-step-3-observe-inodes"
command_id = "disk-df-inodes-root"

[[sections.commands]]
id = "scenario-step-4-map-device"
command_id = "disk-lsblk-filesystems"

[[sections.commands]]
id = "scenario-step-5-scope-usage"
summary = "步骤 5：只在 /var 所在文件系统内汇总一级目录"
simulated_output = "120M    /var/cache\n640M    /var/log\n2.1G    /var/lib\n3.0G    /var"
deep_explanation = "-x 限制在同一文件系统；静态结果只用于理解范围控制。"
command_id = "shared-4a3a149cf0df4031"

[[sections.commands]]
id = "scenario-step-6-review-candidates"
summary = "步骤 6：列出候选大文件供人工核对，不执行删除"
simulated_output = "734003200 /var/log/app/archive.log"
