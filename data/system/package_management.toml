[[sections]]
id = "common-tasks"
title = "常见包管理任务"
description = "不同发行版的包管理命令虽然语法不同，但核心操作是一致的。\n掌握跨发行版的对照关系，可以在不同系统间快速切换。\n\n常见操作对照表：\n  ┌──────────────┬──────────────────┬──────────────────┬────────────────┐\n  │    操作       │  apt (Debian)    │  yum/dnf (RHEL)  │ pacman (Arch)  │\n  ├──────────────┼──────────────────┼──────────────────┼────────────────┤\n  │ 更新索引      │ apt update       │ yum makecache    │ pacman -Sy     │\n  │ 安装软件      │ apt install pkg  │ yum install pkg  │ pacman -S pkg  │\n  │ 卸载软件      │ apt remove pkg   │ yum remove pkg   │ pacman -R pkg  │\n  │ 搜索软件      │ apt search pkg   │ yum search pkg   │ pacman -Ss pkg │\n  │ 查看信息      │ apt show pkg     │ yum info pkg     │ pacman -Qi pkg │\n  │ 系统升级      │ apt upgrade      │ yum update       │ pacman -Syu    │\n  │ 列出已安装    │ apt list         │ yum list inst.   │ pacman -Q      │\n  │ 清理缓存      │ apt autoclean    │ yum clean all    │ pacman -Sc     │\n  └──────────────┴──────────────────┴──────────────────┴────────────────┘\n\n以下示例基于 Debian/Ubuntu 系统演示一些常用的包管理辅助操作。"

