[[sections]]
id = "apt"
title = "APT 包管理（Debian/Ubuntu）"
description = "APT（Advanced Package Tool）是 Debian 及其衍生发行版（Ubuntu、Linux Mint 等）的包管理工具。\n它是日常 Linux 使用中最常接触的命令之一。\n\nAPT 工具链：\n  apt       — 高级包管理前端（推荐日常使用）\n  apt-get   — 传统包管理命令（脚本中常用）\n  apt-cache — 包信息查询工具\n  dpkg      — 底层 .deb 包管理工具\n\n软件源配置文件：\n  /etc/apt/sources.list           — 主软件源列表\n  /etc/apt/sources.list.d/*.list  — 第三方软件源\n\n工作流程：apt update（更新索引）→ apt install（安装）→ apt upgrade（升级）"

