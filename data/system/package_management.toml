id = "pacman"
title = "Pacman 包管理（Arch Linux）"
description = "Pacman 是 Arch Linux 及其衍生发行版（Manjaro 等）的包管理工具。\n它以简洁高效著称，使用单字母选项组合来执行不同操作。\n\n核心选项说明：\n  -S  — Sync（同步/安装）    pacman -S nginx\n  -R  — Remove（卸载）       pacman -R nginx\n  -Q  — Query（查询本地）     pacman -Q\n  -Ss — 在仓库中搜索包\n  -Qi — 查询已安装包的详细信息\n  -Sy — 同步包数据库\n  -Syu— 系统完整升级\n\n软件源配置：\n  /etc/pacman.conf       — 主配置文件\n  /etc/pacman.d/mirrorlist — 镜像源列表\n\nArch 遵循滚动更新模型，建议经常执行 pacman -Syu 保持系统最新。"

