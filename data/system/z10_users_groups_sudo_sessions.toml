[[sections]]
id = "access-denied-scenario"
title = "七步场景：training 用户无法读取文件且 sudo 被拒绝"
description = "按顺序排查：\n1. 观察账户 UID、主组和补充组，不先修改权限。\n2. 验证账户记录、家目录和登录 Shell，排除名称服务异常。\n3. 验证相关组记录及成员来源，注意旧会话可能尚未刷新组列表。\n4. 沿路径检查每级目录权限和所有者，定位真正阻断点。\n5. 观察 sudo 规则，区分“文件权限不足”和“没有该 sudo 授权”。\n6. 核对当前登录会话，必要时让用户安全重新登录后再次验证。\n7. 选择最小动作：修正单个目录组权限、更新明确组成员或增加窄 sudo 规则；变更后复查，不授予 777 或宽泛 ALL。"

