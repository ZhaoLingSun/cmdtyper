
[meta]
id = "users_groups_sudo_sessions"
topic = "用户、组、sudo 与登录会话"
description = "区分账户身份、有效权限、组成员、sudo 授权和当前登录会话"
difficulty = "basic"
icon = "UID"
overview = "Linux 授权依赖数字 UID/GID，用户名和组名是便于人类读取的映射。登录会话、进程身份、文件所有权与 sudo 规则相互关联但不等价。\n安全排查先观察当前身份和对象权限，再验证账户数据库与授权规则，最后选择最小变更。所有命令仅显示预设输出。"

[[sections]]
id = "identity-and-group-membership"
title = "真实身份、有效身份与补充组"
description = "账户记录把用户名映射到 UID、主 GID、家目录和登录 Shell。内核实际比较数字 ID，而不是显示名称。\nid 同时展示 UID、主组和补充组；groups 更侧重组名列表；getent 通过系统配置的名称服务读取 passwd/group 数据，可能来自本地文件、LDAP 或其他来源。\n进程继承启动时的组列表。管理员刚把用户加入新组后，旧会话通常不会自动获得新组，应重新登录并再次验证。\n不要因为用户名相似就推断身份相同，也不要手工解析 /etc/passwd 代替 getent。"

