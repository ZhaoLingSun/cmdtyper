[[sections]]
id = "login-sessions-and-process-context"
title = "账户存在、用户已登录、进程正在运行是三件事"
description = "who 展示当前登录会话和终端；w 在此基础上加入负载与前台活动；last 从登录历史数据库读取过去会话。\n一个服务账户可以运行进程却没有交互登录；一个用户也可以同时拥有多个 SSH、控制台或 tmux 会话。\nsu - user 会切换账户并建立类似登录 Shell 的环境，但不会证明这是远程登录记录。sudo 与 su 的审计路径也不同。\n排查会话时要把 USER、TTY、来源地址、登录时间和进程树结合起来，避免仅凭一列命令名判断。"

