[[sections]]
id = "sudo-authorization-boundary"
title = "sudo 授权的是命令边界，不是永久变成 root"
description = "sudo 根据调用者身份、主机、目标用户和命令规则决定是否允许一次操作。sudoers 中的通配、参数匹配和包含文件都可能影响结果。\nsudo -l 用于观察当前用户可运行的规则；sudo -l -U user 适合管理员审查指定账户，但真实环境仍需相应权限。\n能运行某条 sudo 命令不代表拥有任意 root Shell。应优先授权最小命令、固定路径和可审计参数，避免宽泛 ALL。\n编辑规则应使用 visudo 的语法校验流程；本专题不执行编辑，也不建议用 sudo 绕过所有者核对。\n\n以下题目分别演示不同账号的授权环境，不组成同一受限账号的连续执行脚本。查看他人 sudo 规则和账号状态的题目使用已授权的管理员账号；仅获准 systemctl status 的账号不能执行这些管理查询。"

