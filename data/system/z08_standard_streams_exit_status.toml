command_id = "v04-ref-3808f4ab77"

[[sections]]
id = "stream-diagnosis-scenario"
title = "六步场景：命令有报错但统计结果仍是 0"
description = "按顺序排查：\n1. 观察原始命令，区分正常输出和错误文本。\n2. 验证管道只接 stdout，确认 stderr 是否绕过统计程序。\n3. 观察当前写法得到的计数与屏幕错误。\n4. 显式合并 stderr 后再次比较静态结果，理解 2>&1 的位置。\n5. 查看退出状态，区分“计数为 0”与“命令成功”。\n6. 选择安全动作：保留错误日志或明确合并流，不用丢弃错误来制造成功假象。"

[[sections.commands]]
id = "scenario-step-1-observe-command"
summary = "步骤 1：观察错误属于 stderr"
