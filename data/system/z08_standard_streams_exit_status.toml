
[meta]
id = "standard_streams_exit_status"
topic = "标准流、重定向与退出状态"
description = "理解 stdin/stdout/stderr、文件描述符、管道边界和退出状态如何驱动可靠流程"
difficulty = "basic"
icon = "0>1>2"
overview = "每个进程通常从三个标准文件描述符开始：0 是标准输入，1 是标准输出，2 是标准错误。\nShell 在启动命令前建立重定向和管道；命令结束后用退出状态表达成功或失败。这里所有命令与输出都是静态教材，不会访问真实文件或进程。"

[[sections]]
id = "three-standard-streams"
title = "stdin、stdout、stderr 与文件描述符"
description = "标准输入 stdin（fd 0）提供数据来源，标准输出 stdout（fd 1）承载正常结果，标准错误 stderr（fd 2）承载诊断信息。\n终端里它们看起来可能混在同一屏幕，但仍是独立通道。程序可以把正常结果送入管道，同时让错误保留在终端。\n文件描述符只是进程内部的整数句柄；重定向改变句柄指向，不改变命令本身的业务语义。\n排查时先问“这行来自哪个流”，再问“Shell 把该流连接到了哪里”。"

[[sections.commands]]
id = "stdin-from-file"
command_id = "redirect-file-to-stdin"
deep_explanation = "< 把文件连接到 fd 0；sort 读取标准输入，而不是要求文件名参数。"

[[sections.commands]]
id = "stdout-to-file"
command_id = "redirect-overwrite-config"
deep_explanation = "> 重定向 fd 1 并覆盖目标；本应用只展示字符串，绝不创建该文件。"

[[sections.commands]]
id = "stderr-to-file"
command_id = "redirect-silence-stderr"
deep_explanation = "2> 只移动 fd 2。规范命令会先创建唯一 0700 私有练习目录，再把诊断写入其中的 grep-errors.log。"

[[sections]]
id = "redirection-pipeline-order"
title = "重定向从左到右，管道默认只接 stdout"
description = "Shell 按从左到右处理重定向。> file 2>&1 先让 stdout 指向文件，再让 stderr 复制 stdout 当前目标，因此两者都进入文件。\n2>&1 > file 则先让 stderr 复制当时的终端目标，随后只改变 stdout，所以 stderr 仍留在终端。\n管道 A | B 默认把 A 的 stdout 接到 B 的 stdin，不自动传递 stderr。\n要分析结果必须同时观察命令结构和流向，不能只凭屏幕上“看到了什么”推断。"

[[sections.commands]]
id = "redirect-both-canonical"
command_id = "redirect-both-after-stdout"
deep_explanation = "规范命令在各自新建的唯一 0700 私有练习目录中使用相对 listing.log，重点仍是从左到右的描述符复制顺序。"

[[sections.commands]]
id = "redirect-order-canonical"
command_id = "redirect-order-stderr-terminal"
deep_explanation = "规范命令在各自新建的唯一 0700 私有练习目录中使用相对 listing.log，重点仍是从左到右的描述符复制顺序。"

