command_id = "pipe-merge-stderr-count"

[[sections]]
id = "exit-status-and-short-circuit"
title = "退出状态：0 表示成功，非 0 表示未完成预期"
description = "退出状态是一个小整数，0 通常表示命令完成了约定目标，非 0 表示失败、未匹配或其他条件结果。\n$? 只保存最近一个前台管道/命令的状态，执行 echo $? 本身后，下一次 $? 又会改变。\n&& 只在左侧状态为 0 时继续，|| 只在左侧非 0 时继续。管道默认通常报告最后一个命令的状态；Bash 的 pipefail 可改变这一规则。\n不要把所有非 0 都解释成系统故障，例如 grep 未找到匹配通常返回 1，这是可处理的业务结果。"

[[sections.commands]]
id = "last-exit-status"
command_id = "shell-last-exit-status"

[[sections.commands]]
id = "pipe-count-errors"
command_id = "pipe-count-error-lines"

