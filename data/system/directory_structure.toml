
[meta]
id = "directory_structure"
topic = "Linux 目录结构"
description = "理解 Linux 文件系统层次标准（FHS）：根目录下各子目录的用途、系统配置、日志、设备文件与伪文件系统"
difficulty = "beginner"
icon = "🏗️"
overview = "┌─────────────────────────────────────────────────────────┐\n│            Linux 文件系统层次结构 (FHS)                    │\n│                                                         │\n│  /                        ← 根目录，一切的起点             │\n│  ├── bin/     基本用户命令（ls, cp, cat ...）              │\n│  ├── boot/    启动文件（内核 vmlinuz, 引导 grub）          │\n│  ├── dev/     设备文件（硬盘 sda, 特殊设备 null）          │\n│  ├── etc/     系统配置文件（ssh, nginx, passwd ...）       │\n│  ├── home/    普通用户的家目录                             │\n│  ├── lib/     共享库文件（.so 动态链接库）                  │\n│  ├── media/   可移动设备挂载点（U盘, 光盘）                │\n│  ├── mnt/     临时手动挂载点                               │\n│  ├── opt/     第三方可选软件（/opt/google/chrome）          │\n│  ├── proc/    进程信息伪文件系统（虚拟，内核动态生成）       │\n│  ├── root/    root 用户的家目录                            │\n│  ├── run/     运行时数据（PID 文件, 套接字）                │\n│  ├── sbin/    系统管理命令（fdisk, iptables, reboot）      │\n│  ├── srv/     服务数据（Web 站点, FTP 文件）                │\n│  ├── sys/     系统硬件信息伪文件系统（虚拟）                │\n│  ├── tmp/     临时文件（重启可能清除）                      │\n│  ├── usr/     用户程序和数据（二级层次结构）                 │\n│  │   ├── bin/     大多数用户命令                            │\n│  │   ├── lib/     库文件                                   │\n│  │   ├── local/   本地编译安装的软件                        │\n│  │   └── share/   架构无关的共享数据                        │\n│  └── var/     可变数据（日志, 缓存, 邮件）                  │\n│      ├── log/     系统日志                                 │\n│      ├── cache/   应用缓存                                 │\n│      └── tmp/     持久临时文件                              │\n│                                                         │\n│  记忆口诀：                                                │\n│    etc 配置 var 日志，home 用户 tmp 临时                    │\n│    proc sys 虚拟看，dev 设备 boot 启动                     │\n│    usr 程序 bin 命令，lib 库文件 opt 可选                   │\n└─────────────────────────────────────────────────────────┘"

[[sections]]
id = "etc"
title = "/etc 系统配置目录"
description = "/etc 是 Linux 中最重要的目录之一，存放几乎所有系统和服务的配置文件。\n\n名称来源：早期 Unix 中 etc 是\"et cetera\"（其他）的缩写，后来演变为\"Editable Text Configuration\"的含义。\n\n常见子目录和文件：\n  /etc/passwd      — 用户账户信息\n  /etc/shadow      — 用户密码（加密存储）\n  /etc/group       — 用户组信息\n  /etc/fstab       — 文件系统挂载表\n  /etc/hostname    — 主机名\n  /etc/hosts       — 本地 DNS 映射\n  /etc/ssh/        — SSH 服务配置\n  /etc/nginx/      — Nginx 配置\n  /etc/systemd/    — Systemd 单元文件\n\n修改 /etc 下的文件通常需要 root 权限（sudo）。"

[[sections.commands]]
summary = "列出 /etc 目录下的前 20 个文件和子目录"
