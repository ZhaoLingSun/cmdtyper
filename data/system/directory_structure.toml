[[sections]]
id = "home"
title = "/home 用户家目录"
description = "/home 是普通用户个人文件的存放地。每个用户在 /home 下有一个与用户名同名的子目录。\n\n用户家目录结构：\n  /home/username/\n  ├── Desktop/      桌面文件\n  ├── Documents/    文档\n  ├── Downloads/    下载\n  ├── .bashrc       Bash 配置\n  ├── .ssh/         SSH 密钥\n  ├── .config/      应用配置\n  └── .local/       用户本地数据\n\n波浪号 ~ 是当前用户家目录的快捷方式。\n例如 ~ 对于用户 alice 等于 /home/alice。\n\n注意：root 用户的家目录不在 /home 下，而是 /root。"

