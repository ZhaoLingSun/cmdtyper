[[sections]]
id = "dev"
title = "/dev 设备文件目录"
description = "/dev 包含设备文件（device files），是 Linux \"一切皆文件\"哲学的核心体现。\n\n设备文件类型：\n  块设备（b）— 按块读写，如硬盘 /dev/sda\n  字符设备（c）— 按字符读写，如终端 /dev/tty\n\n常见设备文件：\n  /dev/sda      — 第一块 SCSI/SATA 硬盘\n  /dev/sda1     — 第一块硬盘的第一个分区\n  /dev/nvme0n1  — 第一块 NVMe 固态硬盘\n  /dev/null     — 黑洞，丢弃所有写入的数据\n  /dev/zero     — 无限产生空字节（\\0）\n  /dev/random   — 生成随机数据（加密级别）\n  /dev/urandom  — 生成伪随机数据（非阻塞）\n  /dev/tty      — 当前终端\n  /dev/loop0    — 回环设备（挂载镜像文件用）\n\n/dev 由 udev 守护进程动态管理，设备插入时自动创建对应文件。"

[[sections.commands]]
summary = "列出所有 SCSI/SATA 磁盘设备文件"
simulated_output = "/dev/sda\n/dev/sda1\n/dev/sda2\n/dev/sda3\n/dev/sdb\n/dev/sdb1"
id = "command-001"
command_id = "v04-ref-1cb130f268"

[[sections.commands]]
