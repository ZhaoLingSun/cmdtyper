[[sections]]
id = "var"
title = "/var 可变数据目录"
description = "/var 存放运行时会不断变化的数据，如日志、缓存、邮件队列、数据库文件等。\n\nvar 是\"variable\"（可变的）的缩写。与 /etc（配置基本不变）不同，/var 下的内容随系统运行持续增长和变化。\n\n常见子目录：\n  /var/log/    — 系统和应用日志（syslog, auth.log, nginx/）\n  /var/cache/  — 应用程序缓存（apt, man）\n  /var/lib/    — 应用程序状态数据（dpkg, mysql, docker）\n  /var/mail/   — 用户邮件\n  /var/spool/  — 排队等待处理的数据（打印队列, cron）\n  /var/tmp/    — 重启后保留的临时文件\n  /var/run/    — 运行时数据（通常是 /run 的符号链接）\n\n运维中最常关注的是 /var/log/，磁盘空间不足时 /var 往往是第一个检查的目录。"

[[sections.commands]]
