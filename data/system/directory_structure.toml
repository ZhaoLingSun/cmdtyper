[[sections]]
id = "sys"
title = "/sys 系统信息伪文件系统"
description = "/sys 是另一个虚拟文件系统（sysfs），提供内核对象、设备驱动和硬件信息的结构化视图。\n\n与 /proc 的区别：\n  /proc — 主要关注进程和内核运行时状态\n  /sys  — 主要关注设备、驱动和内核子系统的层次结构\n\n常见子目录：\n  /sys/block/       — 块设备信息（磁盘）\n  /sys/bus/         — 总线类型（pci, usb, scsi）\n  /sys/class/       — 设备分类（net, input, tty）\n  /sys/devices/     — 所有设备的统一层次\n  /sys/firmware/    — 固件信息（ACPI, EFI）\n  /sys/fs/          — 文件系统相关参数\n  /sys/kernel/      — 内核参数\n  /sys/module/      — 已加载的内核模块\n  /sys/power/       — 电源管理\n\n/sys 中的文件可以读取硬件信息，某些文件也支持写入以调整内核参数。"

[[sections.commands]]
summary = "列出 /sys 目录下的所有子目录"
simulated_output = "block\nbus\nclass\ndev\ndevices\nfirmware\nfs\nhypervisor\nkernel\nmodule\npower"
id = "command-001"
command_id = "v04-ref-a5cbdb161a"

