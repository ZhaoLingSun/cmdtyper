simulated_output = "crw-rw-rw- 1 root root 1, 3 Mar  9 00:00 /dev/null\ncrw-rw-rw- 1 root root 1, 8 Mar  9 00:00 /dev/random\ncrw-rw-rw- 1 root root 1, 5 Mar  9 00:00 /dev/zero"
id = "command-002"
command_id = "v04-ref-1879de6367"

[[sections]]
id = "proc"
title = "/proc 进程信息伪文件系统"
description = "/proc 是一个虚拟文件系统（procfs），不占用磁盘空间，由内核在内存中动态生成。\n\n它提供了一个查看内核和进程状态的窗口：\n  /proc/[PID]/    — 每个运行中的进程有一个以 PID 命名的子目录\n  /proc/cpuinfo   — CPU 详细信息\n  /proc/meminfo   — 内存使用情况\n  /proc/version   — 内核版本信息\n  /proc/uptime    — 系统运行时间\n  /proc/loadavg   — 系统负载\n  /proc/mounts    — 已挂载的文件系统\n  /proc/net/      — 网络相关统计\n\n进程子目录中的常用文件：\n  /proc/[PID]/cmdline  — 进程启动命令\n  /proc/[PID]/status   — 进程状态\n  /proc/[PID]/fd/      — 进程打开的文件描述符\n\n/proc 是排查系统问题和监控性能的重要信息源。"

[[sections.commands]]
