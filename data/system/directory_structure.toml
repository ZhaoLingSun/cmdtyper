[[sections]]
id = "usr"
title = "/usr 用户程序目录"
description = "/usr 是 Linux 中最大的目录之一，包含用户级别的程序、库和文档。\n\nusr 最初是\"user\"的缩写，现在通常理解为\"Unix System Resources\"。\n\n/usr 内部是一个二级层次结构，镜像了根目录的组织方式：\n  /usr/bin/    — 大部分用户命令（非启动必需的）\n  /usr/sbin/   — 非必需的系统管理命令\n  /usr/lib/    — 库文件\n  /usr/local/  — 本地编译安装的软件（不受包管理器管理）\n  /usr/share/  — 架构无关的共享数据（文档、图标、语言文件）\n  /usr/include/ — C/C++ 头文件\n  /usr/src/    — 内核源代码\n\n在现代 Linux 发行版中，/bin 和 /sbin 通常是指向 /usr/bin 和 /usr/sbin 的符号链接。"

[[sections.commands]]
