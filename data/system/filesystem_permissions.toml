[[sections]]
id = "chown-chgrp"
title = "chown/chgrp 修改归属"
description = "chown（change owner）用于修改文件的所有者和所属组。\nchgrp（change group）仅修改文件的所属组。\n\nchown 语法：\n  chown 用户 文件           — 只改所有者\n  chown 用户:组 文件        — 同时改所有者和组\n  chown :组 文件            — 只改组（等同于 chgrp）\n\n常用选项：\n  -R  递归修改目录及其内容的归属\n  -v  显示详细操作信息\n  -c  仅在发生更改时显示信息\n\n注意：修改文件归属通常需要 root 权限（sudo）。\n普通用户只能用 chgrp 将文件改为自己所属的组。"

