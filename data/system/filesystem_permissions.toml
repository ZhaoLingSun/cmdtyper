[[sections]]
id = "chmod"
title = "chmod 修改权限"
description = "chmod（change mode）命令用于修改文件或目录的权限。支持两种模式：\n\n数字模式（推荐）：\n  chmod 755 file  — 直接设定完整权限\n  chmod 600 file  — 只有所有者可读写\n\n符号模式（灵活）：\n  chmod u+x file  — 给所有者添加执行权限\n  chmod go-w file — 去除组和其他用户的写权限\n  chmod a+r file  — 给所有人添加读权限\n\n符号含义：\n  u = user（所有者）  g = group（组）  o = other（其他）  a = all（全部）\n  + 添加权限          - 移除权限       = 设定权限\n\n-R 选项可递归修改目录及其所有内容的权限。"

[[sections.commands]]
summary = "将 script.sh 设为所有者可读写执行、其他人可读执行"
simulated_output = "-rwxr-xr-x 1 alice developers 2048 Mar  9 10:15 script.sh"
id = "command-001"
command_id = "v04-ref-97cea508df"

[[sections.commands]]
