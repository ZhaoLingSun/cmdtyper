
[meta]
id = "filesystem_permissions"
topic = "文件系统权限"
description = "理解 Linux 文件权限体系：rwx 权限位、数字权限、umask、特殊权限（SUID/SGID/Sticky）、chmod/chown 命令"
difficulty = "basic"
icon = "🔒"
overview = "┌─────────────────────────────────────────────────────────────┐\n│              Linux 文件权限结构详解                            │\n│                                                             │\n│  -rwxr-xr-- 1 alice developers 4096 Mar  5 10:30 script.sh │\n│  │└┬┘└┬┘└┬┘                                                │\n│  │ │  │  └── 其他用户 (other): r-- (只读)                    │\n│  │ │  └───── 所属组 (group):  r-x (读+执行)                  │\n│  │ └──────── 所有者 (owner):  rwx (读+写+执行)               │\n│  └────────── 文件类型: - (普通文件)                           │\n│                                                             │\n│  文件类型标识：                                               │\n│    -  普通文件        l  符号链接                              │\n│    d  目录            c  字符设备                              │\n│    b  块设备          s  套接字                                │\n│    p  管道 (FIFO)                                            │\n│                                                             │\n│  权限数字对照表：                                              │\n│  ┌─────┬───────┬───────┐                                    │\n│  │ 数字 │ 权限   │ 含义   │                                   │\n│  ├─────┼───────┼───────┤                                    │\n│  │  4  │  r--  │ 只读   │                                    │\n│  │  2  │  -w-  │ 只写   │                                    │\n│  │  1  │  --x  │ 只执行  │                                   │\n│  │  5  │  r-x  │ 读+执行 │                                   │\n│  │  6  │  rw-  │ 读+写   │                                   │\n│  │  7  │  rwx  │ 全部    │                                   │\n│  │  0  │  ---  │ 无权限  │                                    │\n│  └─────┴───────┴───────┘                                    │\n│                                                             │\n│  常见权限组合：                                               │\n│    755 = rwxr-xr-x  — 可执行文件/目录                        │\n│    644 = rw-r--r--  — 普通文件                               │\n│    600 = rw-------  — 私密文件（如 SSH 密钥）                  │\n│    777 = rwxrwxrwx  — 所有人可读写执行（⚠ 危险）              │\n│                                                             │\n│  特殊权限位：                                                 │\n│    4xxx — SUID  所有者权限执行 (如 /usr/bin/passwd)           │\n│    2xxx — SGID  所属组权限执行/继承组                          │\n│    1xxx — Sticky Bit 仅所有者可删 (如 /tmp)                  │\n└─────────────────────────────────────────────────────────────┘"

[[sections]]
id = "rwx-basics"
title = "rwx 权限基础"
description = "Linux 中每个文件和目录都有三组权限，分别针对三类用户：\n\n  所有者 (owner/user) — 文件的创建者或指定拥有者\n  所属组 (group)      — 文件关联的用户组\n  其他用户 (other)     — 系统上的其他所有用户\n\n每组权限由三个位组成：\n  r (read)    = 4  — 读取文件内容 / 列出目录内容\n  w (write)   = 2  — 修改文件内容 / 在目录中创建、删除文件\n  x (execute) = 1  — 执行文件 / 进入目录（cd）\n\n数字权限由三位组成，每位是 r+w+x 的和：\n  rwx = 4+2+1 = 7    r-x = 4+0+1 = 5\n  rw- = 4+2+0 = 6    r-- = 4+0+0 = 4\n\n例如 755 表示：所有者 rwx(7)，所属组 r-x(5)，其他用户 r-x(5)。"

[[sections.commands]]
summary = "查看 /home/ 目录下所有文件和目录的详细权限信息"
simulated_output = "total 16\ndrwxr-xr-x  4 root  root  4096 Jan 15 09:00 .\ndrwxr-xr-x 20 root  root  4096 Jan 10 08:00 ..\ndrwxr-x--- 18 alice alice 4096 Mar  9 08:30 alice\ndrwxr-x--- 12 bob   bob   4096 Mar  8 17:45 bob\ndrwxr-xr-x  5 guest users 4096 Feb 20 14:00 guest"
