simulated_output = "u=rwx,g=rx,o=rx"
id = "command-002"
command_id = "v04-ex-0e86550cb5"

[[sections]]
id = "special-permissions"
title = "特殊权限（SUID/SGID/Sticky Bit）"
description = "除了基本的 rwx 权限外，Linux 还有三种特殊权限位：\n\nSUID (Set User ID) — 数字 4：\n  设置在可执行文件上，运行时以文件所有者身份执行。\n  典型例子：/usr/bin/passwd（普通用户也能修改 /etc/shadow）。\n  权限标识：所有者的 x 位变为 s（如 rwsr-xr-x）。\n\nSGID (Set Group ID) — 数字 2：\n  设置在可执行文件上：运行时以文件所属组身份执行。\n  设置在目录上：新建文件自动继承目录的所属组。\n  权限标识：组的 x 位变为 s（如 rwxr-sr-x）。\n\nSticky Bit — 数字 1：\n  通常设置在公共目录上（如 /tmp），\n  只有文件所有者和 root 才能删除或重命名其中的文件。\n  权限标识：其他用户的 x 位变为 t（如 rwxrwxrwt）。\n\n设置特殊权限：使用四位数字权限的第一位。\n  chmod 4755 file  — 设置 SUID\n  chmod 2755 dir   — 设置 SGID\n  chmod 1777 dir   — 设置 Sticky Bit"

