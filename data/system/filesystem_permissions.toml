[[sections]]
id = "umask"
title = "umask 默认权限掩码"
description = "umask（user file-creation mode mask）决定了新建文件和目录的默认权限。\n\n工作原理：\n  新文件默认权限 = 666 - umask\n  新目录默认权限 = 777 - umask\n\n常见 umask 值：\n  022 → 文件 644 (rw-r--r--)，目录 755 (rwxr-xr-x) — 最常见\n  027 → 文件 640 (rw-r-----)，目录 750 (rwxr-x---) — 更安全\n  077 → 文件 600 (rw-------)，目录 700 (rwx------) — 最严格\n\numask 是一个\"掩码\"，它指定要从默认权限中去掉的位。\n例如 umask 022：去掉组和其他用户的写权限 (w=2)。\n\n可在 ~/.bashrc 或 /etc/profile 中设置永久 umask。"

[[sections.commands]]
summary = "显示当前的 umask 值（八进制）"
simulated_output = "0022"
id = "command-001"
command_id = "umask-show"

[[sections.commands]]
