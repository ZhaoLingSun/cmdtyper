[[sections.config_files.lessons]]
title = "添加新磁盘挂载"
before = "tmpfs                                      /tmp           tmpfs   defaults,noatime   0       0"
after = "tmpfs                                      /tmp           tmpfs   defaults,noatime   0       0\nUUID=d4e5f6a7-b8c9-0123-defa-234567890123 /data          ext4    defaults,noatime   0       2"
explanation = "添加新磁盘到系统的步骤：\n  1. 使用 lsblk 或 fdisk -l 确认新磁盘设备名（如 /dev/sdb1）\n  2. 使用 blkid /dev/sdb1 获取 UUID\n  3. 创建挂载点目录：sudo mkdir -p /data\n  4. 在 fstab 中添加条目\n  5. 执行 sudo mount -a 测试挂载\n\n各字段含义：\n  UUID=...    — 使用 UUID 比设备名更可靠（磁盘顺序可能变化）\n  /data       — 挂载到 /data 目录\n  ext4        — 文件系统类型\n  defaults    — 默认选项（rw,suid,dev,exec,auto,nouser,async）\n  noatime     — 不更新访问时间戳（提高性能）\n  0           — 不使用 dump 备份\n  2           — fsck 检查顺序为 2（非根分区）"
practice_command = "sudo blkid /dev/sdb1 && sudo mkdir -p /data && sudo mount -a"

[[sections.config_files.lessons]]
title = "添加 NFS 网络挂载"
before = "tmpfs                                      /tmp           tmpfs   defaults,noatime   0       0"
after = "tmpfs                                      /tmp           tmpfs   defaults,noatime   0       0\n192.168.1.10:/shared                       /mnt/nfs       nfs     defaults,_netdev   0       0"
explanation = "NFS（Network File System）允许通过网络挂载远程目录。\n\n各字段含义：\n  192.168.1.10:/shared — NFS 服务器 IP 和共享目录\n  /mnt/nfs             — 本地挂载点\n  nfs                  — 文件系统类型\n  defaults             — 默认挂载选项\n  _netdev              — 标记为网络设备，系统等网络就绪后再挂载\n  0 0                  — 不备份、不做 fsck 检查\n\n使用前需要安装 NFS 客户端：\n  sudo apt install nfs-common\n\n常用 NFS 挂载选项：\n  rsize=8192,wsize=8192 — 设置读写缓冲区大小\n  timeo=14              — 超时时间\n  soft                  — 超时后返回错误（hard 则一直重试）"
practice_command = "sudo apt install nfs-common && sudo mkdir -p /mnt/nfs && sudo mount -a"

[[sections]]
id = "crontab"
title = "定时任务配置"
description = "crontab（cron table）是 Linux 定时任务调度系统。\n\n时间格式（5 个字段）：\n  ┌───────────── 分钟 (0-59)\n  │ ┌───────────── 小时 (0-23)\n  │ │ ┌───────────── 日 (1-31)\n  │ │ │ ┌───────────── 月 (1-12)\n  │ │ │ │ ┌───────────── 星期 (0-7，0和7都是周日)\n  │ │ │ │ │\n  * * * * * 要执行的命令\n\n特殊符号：\n  *     — 每个时间单位\n  */N   — 每隔 N 个单位\n  N-M   — 从 N 到 M 的范围\n  N,M   — 第 N 和第 M\n\n每个用户有自己的 crontab，root 的 crontab 有系统级权限。\n系统级定时任务放在 /etc/crontab 和 /etc/cron.d/ 目录。"

