
[meta]
id = "config_files"
topic = "常见配置文件"
description = "了解 Linux 系统中最常见的配置文件：bashrc、sshd_config、nginx.conf、fstab、crontab"
difficulty = "advanced"
icon = "📝"
overview = "┌─────────────────────────────────────────────────────────┐\n│            Linux 常见配置文件总览                          │\n│                                                         │\n│  配置文件是 Linux 系统的灵魂 —— 几乎所有行为都可以         │\n│  通过修改纯文本配置文件来定制。                             │\n│                                                         │\n│  ┌────────────────┬──────────────────────────────────┐  │\n│  │ 配置文件        │ 用途                             │  │\n│  ├────────────────┼──────────────────────────────────┤  │\n│  │ ~/.bashrc       │ Shell 环境：别名、提示符、PATH    │  │\n│  │ sshd_config     │ SSH 服务安全配置                 │  │\n│  │ nginx.conf      │ Web 服务器 / 反向代理             │  │\n│  │ /etc/fstab      │ 磁盘自动挂载表                   │  │\n│  │ crontab         │ 定时任务调度                     │  │\n│  └────────────────┴──────────────────────────────────┘  │\n│                                                         │\n│  黄金法则：                                               │\n│    1. 修改前先备份  cp file file.bak                      │\n│    2. 使用 diff 查看差异                                  │\n│    3. 修改后测试验证（如 nginx -t、source ~/.bashrc）      │\n│    4. 保持注释，方便回溯                                   │\n└─────────────────────────────────────────────────────────┘"

[[sections]]
id = "bashrc"
title = "Shell 配置文件"
description = "~/.bashrc 是 Bash Shell 最重要的个人配置文件，每次打开新的交互式终端时自动执行。\n\n常见用途：\n  - 定义命令别名（alias）简化日常操作\n  - 自定义命令提示符（PS1）\n  - 添加自定义目录到 PATH 搜索路径\n  - 设置环境变量（如 EDITOR、LANG）\n  - 加载其他配置脚本\n\n相关文件：\n  ~/.bash_profile — 登录 Shell 时执行（通常会 source ~/.bashrc）\n  ~/.bash_logout  — 退出登录 Shell 时执行\n  /etc/bash.bashrc — 全局 bashrc（所有用户生效）"

[[sections.commands]]
summary = "查看 ~/.bashrc 前 20 行内容"
simulated_output = "# ~/.bashrc: executed by bash(1) for non-login shells.\n# see /usr/share/doc/bash/examples/startup-files (in the package bash-doc)\n# for examples\n\n# If not running interactively, don't do anything\ncase $- in\n    *i*) ;;\n      *) return;;\nesac\n\n# don't put duplicate lines or lines starting with space in the history.\nHISTCONTROL=ignoreboth\n\n# append to the history file, don't overwrite it\nshopt -s histappend\n\n# for setting history length see HISTSIZE and HISTFILESIZE in bash(1)\nHISTSIZE=1000\nHISTFILESIZE=2000"
id = "command-001"
command_id = "v04-ref-47bb0ffc73"

[[sections.commands]]
summary = "重新加载 ~/.bashrc 使修改立即生效"
simulated_output = ""
id = "command-002"
command_id = "source-bashrc"

[[sections.commands]]
summary = "显示当前命令提示符格式字符串"
simulated_output = "\\\\u@\\\\h:\\\\w\\\\$"
id = "command-003"
command_id = "v04-ref-2fffdcd4d7"

[[sections.config_files]]
id = "bashrc-file"
path = "~/.bashrc"
name = "Bash Shell 配置文件"
description = "用户级 Shell 配置，每次打开新终端自动加载，定义别名、环境变量和提示符等"
sample_content = "# ~/.bashrc: executed by bash(1) for non-login shells.\n\n# 如果不是交互式 Shell，直接返回\ncase $- in\n    *i*) ;;\n      *) return;;\nesac\n\n# ─── 历史记录设置 ───\nHISTCONTROL=ignoreboth\nshopt -s histappend\nHISTSIZE=1000\nHISTFILESIZE=2000\n\n# ─── 窗口大小自动更新 ───\nshopt -s checkwinsize\n\n# ─── 命令提示符 ───\nPS1='\\u@\\h:\\w\\$ '\n\n# ─── 颜色支持 ───\nif [ -x /usr/bin/dircolors ]; then\n    eval \"$(dircolors -b)\"\n    alias ls='ls --color=auto'\n    alias grep='grep --color=auto'\nfi\n\n# ─── 常用别名 ───\nalias la='ls -A'\nalias l='ls -CF'\n\n# ─── PATH ───\nexport PATH=\"$HOME/.local/bin:$PATH\"\n\n# ─── 环境变量 ───\nexport EDITOR=vim\nexport LANG=zh_CN.UTF-8"

[[sections.config_files.lessons]]
title = "添加自定义别名"
before = "# ─── 常用别名 ───\nalias la='ls -A'\nalias l='ls -CF'"
after = "# ─── 常用别名 ───\nalias la='ls -A'\nalias l='ls -CF'\nalias ll='ls -alh'"
explanation = "alias 命令可以为常用操作创建快捷方式。\nll='ls -alh' 将 ll 映射为 ls -alh，即以长格式列出所有文件并以人类可读单位显示大小。\n添加后执行 source ~/.bashrc 即可生效。\n也可以在当前终端直接输入 alias ll='ls -alh' 临时生效（仅当前会话）。"
practice_command = "echo \"alias ll='ls -alh'\" >> ~/.bashrc && source ~/.bashrc"

[[sections.config_files.lessons]]
title = "自定义命令提示符 PS1"
before = "PS1='\\u@\\h:\\w\\$ '"
after = "PS1='\\[\\033[01;32m\\]\\u@\\h\\[\\033[00m\\]:\\[\\033[01;34m\\]\\w\\[\\033[00m\\]\\$ '"
explanation = "PS1 变量控制命令提示符的外观。\n  \\u — 当前用户名\n  \\h — 主机名\n  \\w — 当前工作目录\n  \\$ — 普通用户显示 $，root 显示 #\n  \\[\\033[01;32m\\] — 设置粗体绿色\n  \\[\\033[01;34m\\] — 设置粗体蓝色\n  \\[\\033[00m\\] — 重置颜色\n修改后用户名@主机名 显示为绿色，路径显示为蓝色，更加醒目。"
practice_command = "source ~/.bashrc"

[[sections.config_files.lessons]]
title = "添加自定义目录到 PATH"
before = "export PATH=\"$HOME/.local/bin:$PATH\" "
after = "export PATH=\"$HOME/.local/bin:$HOME/scripts:$PATH\" "
explanation = "PATH 环境变量决定 Shell 在哪些目录中搜索可执行程序。\n添加 $HOME/scripts 后，你可以将自己编写的脚本放在 ~/scripts/ 目录，\n无需输入完整路径即可直接运行。\n注意：新路径加在前面表示优先搜索，加在后面则后搜索。\n建议将个人脚本目录放在系统目录之前，方便覆盖同名命令。"
practice_command = "mkdir -p ~/scripts && source ~/.bashrc && echo $PATH"

[[sections]]
id = "sshd"
title = "SSH 服务配置"
description = "sshd_config 是 OpenSSH 服务端的配置文件，控制远程登录行为和安全策略。\n\nSSH 是服务器管理的生命线 —— 配置不当可能导致：\n  - 安全漏洞（如允许 root 密码登录被暴力破解）\n  - 自己被锁在外面（改错端口或认证方式）\n\n重要提醒：\n  修改 sshd_config 后必须重启 SSH 服务才能生效。\n  修改前务必保留一个已连接的 SSH 会话作为后路！"

[[sections.commands]]
summary = "查看 SSH 主配置中非空且不以 # 开头的行；此过滤不解析 Include、Match、缩进注释或默认值"
simulated_output = "Include /etc/ssh/sshd_config.d/*.conf\nPort 22\nAddressFamily any\nListenAddress 0.0.0.0\nPermitRootLogin yes\nMaxAuthTries 6\nPubkeyAuthentication yes\nPasswordAuthentication yes\nChallengeResponseAuthentication no\nUsePAM yes\nX11Forwarding yes\nPrintMotd no\nAcceptEnv LANG LC_*\nSubsystem sftp /usr/lib/openssh/sftp-server"
id = "command-001"
command_id = "v04-ref-6c864869bf"

[[sections.commands]]
summary = "查看 SSH 服务的运行状态"
simulated_output = "● ssh.service - OpenBSD Secure Shell server\n     Loaded: loaded (/usr/lib/systemd/system/ssh.service; enabled; preset: enabled)\n     Active: active (running) since Mon 2026-03-09 08:15:32 CST; 6h ago\n       Docs: man:sshd(8)\n             man:sshd_config(5)\n   Main PID: 924 (sshd)\n      Tasks: 1 (limit: 4614)\n     Memory: 3.2M (peak: 4.8M)\n        CPU: 125ms\n     CGroup: /system.slice/ssh.service\n             └─924 \"sshd: /usr/sbin/sshd -D [listener] 0 of 10-100 startups\" "
