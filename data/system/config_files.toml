[[sections.config_files]]
id = "sshd-config"
path = "/etc/ssh/sshd_config"
name = "SSH 服务配置文件"
description = "OpenSSH 服务端配置，控制远程登录端口、认证方式和安全策略"
sample_content = "# OpenSSH 服务配置文件\n# 详见 man sshd_config(5)\n\nInclude /etc/ssh/sshd_config.d/*.conf\n\n# ─── 网络设置 ───\nPort 22\nAddressFamily any\nListenAddress 0.0.0.0\n\n# ─── 认证设置 ───\nPermitRootLogin yes\nMaxAuthTries 6\nPubkeyAuthentication yes\nAuthorizedKeysFile .ssh/authorized_keys\n\nPasswordAuthentication yes\nPermitEmptyPasswords no\nChallengeResponseAuthentication no\n\n# ─── 安全设置 ───\nUsePAM yes\nX11Forwarding yes\nPrintMotd no\nAcceptEnv LANG LC_*\n\n# ─── SFTP ───\nSubsystem sftp /usr/lib/openssh/sftp-server"

[[sections.config_files.lessons]]
title = "禁用 root 远程登录"
before = "PermitRootLogin yes"
after = "PermitRootLogin no"
explanation = "root 是系统最高权限账户，允许 root 直接远程登录存在极大安全风险：\n  - 攻击者只需猜对密码即可获得完全控制权\n  - 无法追踪是哪个管理员执行了操作\n\n设为 no 后，管理员需要先用普通用户登录，再通过 sudo 提权。\n这样既增加了一层安全屏障，也便于审计操作日志。\n修改后执行 sudo systemctl restart sshd 生效。"
practice_command = "sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak && sudo sed -i 's/PermitRootLogin yes/PermitRootLogin no/' /etc/ssh/sshd_config && sudo sshd -t && sudo systemctl restart sshd"

[[sections.config_files.lessons]]
title = "修改 SSH 端口"
before = "Port 22"
after = "Port 2222"
explanation = "默认的 22 端口是自动化扫描工具的首要目标。\n修改为非标准端口（如 2222）可以大幅减少暴力破解尝试。\n\n注意事项：\n  1. 新端口必须在 1024-65535 范围内\n  2. 确保防火墙放行新端口：sudo ufw allow 2222/tcp\n  3. 修改后连接时需指定端口：ssh -p 2222 user@host\n  4. 建议先开放新端口、测试连通后再关闭旧端口\n\n这不是真正的安全措施，但能有效减少日志噪音。"
practice_command = "sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak && sudo sed -i 's/Port 22/Port 2222/' /etc/ssh/sshd_config && sudo sshd -t && sudo ufw allow 2222/tcp && sudo systemctl restart sshd"

[[sections.config_files.lessons]]
title = "禁用密码认证，仅允许密钥登录"
before = "PasswordAuthentication yes"
after = "PasswordAuthentication no"
explanation = "密码认证面临暴力破解风险，且密码可能泄露或被社工。\nSSH 密钥认证使用非对称加密，安全性远高于密码：\n  - 私钥保存在本地，不在网络上传输\n  - 即使服务器被攻破，攻击者也无法反向获取私钥\n\n操作步骤：\n  1. 先在本地生成密钥对：ssh-keygen -t ed25519\n  2. 将公钥复制到服务器：ssh-copy-id user@host\n  3. 测试密钥登录成功后再禁用密码认证\n  4. 重启服务：sudo systemctl restart sshd\n\n切记：禁用前必须确认密钥登录可用，否则会被锁在外面！"
practice_command = "sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak && sudo sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config && sudo sshd -t && sudo systemctl restart sshd"

[[sections]]
id = "nginx"
title = "Nginx Web 服务器配置"
description = "Nginx 是最流行的 Web 服务器和反向代理服务器之一。\n\n核心概念：\n  - server 块：定义一个虚拟主机\n  - location 块：定义 URL 路径的处理方式\n  - upstream 块：定义后端服务器组（负载均衡）\n\n配置文件结构：\n  /etc/nginx/nginx.conf          — 主配置文件\n  /etc/nginx/sites-available/    — 可用站点配置\n  /etc/nginx/sites-enabled/      — 已启用站点（软链接）\n  /etc/nginx/conf.d/             — 额外配置片段\n\n修改配置后务必先用 nginx -t 检测语法，再 reload 生效。"

[[sections.commands]]
summary = "检测 Nginx 配置文件语法是否正确"
simulated_output = "nginx: the configuration file /etc/nginx/nginx.conf syntax is ok\nnginx: configuration file /etc/nginx/nginx.conf test is successful"
id = "command-001"
command_id = "v04-ref-6b55fc52e0"

[[sections.commands]]
summary = "查看默认站点配置前 30 行"
simulated_output = "##\n# You should look at the following URL's in order to grasp a solid understanding\n# of Nginx configuration files in order to fully unleash the power of Nginx.\n# https://www.nginx.com/resources/wiki/start/\n##\n\nserver {\n    listen 80 default_server;\n    listen [::]:80 default_server;\n\n    root /var/www/html;\n\n    index index.html index.htm index.nginx-debian.html;\n\n    server_name _;\n\n    location / {\n        try_files $uri $uri/ =404;\n    }\n}"
id = "command-002"
command_id = "v04-ref-d526cdf4cc"

[[sections.config_files]]
id = "nginx-default"
path = "/etc/nginx/sites-available/default"
name = "Nginx 默认站点配置"
description = "Nginx 默认虚拟主机配置，定义监听端口、网站根目录和请求处理方式"
sample_content = "server {\n    listen 80 default_server;\n    listen [::]:80 default_server;\n\n    root /var/www/html;\n\n    index index.html index.htm;\n\n    server_name _;\n\n    location / {\n        try_files $uri $uri/ =404;\n    }\n\n    # 静态文件缓存\n    location ~* \\.(jpg|jpeg|png|gif|ico|css|js)$ {\n        expires 30d;\n        add_header Cache-Control \"public, no-transform\";\n    }\n\n    # 禁止访问隐藏文件\n    location ~ /\\. {\n        deny all;\n    }\n}"

[[sections.config_files.lessons]]
title = "修改监听端口"
before = "    listen 80 default_server;\n    listen [::]:80 default_server;"
after = "    listen 8080 default_server;\n    listen [::]:8080 default_server;"
explanation = "listen 指令设置 Nginx 监听的端口号。\n默认 80 端口是 HTTP 标准端口，浏览器访问时无需指定端口号。\n修改为 8080 后，访问时需要加端口：http://example.com:8080\n\n常见场景：\n  - 80 端口已被其他服务占用\n  - 非 root 用户运行（1024 以下端口需要 root）\n  - 开发测试环境使用非标准端口\n\n修改后执行 sudo nginx -t && sudo systemctl reload nginx 生效。"
practice_command = "sudo nginx -t && sudo systemctl reload nginx"

[[sections.config_files.lessons]]
title = "配置反向代理"
before = "    location / {\n        try_files $uri $uri/ =404;\n    }"
after = "    location / {\n        proxy_pass http://127.0.0.1:3000;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }"
explanation = "反向代理是 Nginx 最强大的功能之一。\nproxy_pass 将请求转发到后端应用服务器（如 Node.js、Python 等）。\n\n各 header 的作用：\n  Host            — 传递原始请求的域名\n  X-Real-IP       — 传递客户端真实 IP\n  X-Forwarded-For — 传递经过的代理链\n  X-Forwarded-Proto — 传递原始协议（http/https）\n\n这样后端应用可以获取到真实的客户端信息，而不是 Nginx 本机地址。\nNginx 作为前端代理还能提供缓存、限流、SSL 终止等附加功能。"
practice_command = "sudo nginx -t && sudo systemctl reload nginx"

[[sections.config_files.lessons]]
title = "设置 server_name 域名"
before = "    server_name _;"
after = "    server_name example.com www.example.com;"
explanation = "server_name 指定该 server 块响应哪些域名的请求。\n_ 是一个通配符，表示匹配所有未被其他 server 块匹配的请求。\n\n配置为具体域名后，Nginx 可以在同一 IP 上托管多个站点：\n  - server_name example.com    — 精确匹配\n  - server_name *.example.com  — 通配符匹配\n  - server_name ~^www\\.(.+)$  — 正则匹配\n\n多个域名用空格分隔，Nginx 会根据请求中的 Host 头选择对应的 server 块。\n这就是\"虚拟主机\"功能，一台服务器可服务多个网站。"
practice_command = "sudo nginx -t && sudo systemctl reload nginx"

[[sections]]
id = "fstab"
title = "文件系统挂载表"
description = "fstab（File System Table）定义了系统启动时自动挂载的文件系统。\n\n每行包含 6 个字段：\n  <设备>  <挂载点>  <文件系统类型>  <挂载选项>  <dump>  <fsck顺序>\n\n字段说明：\n  设备        — UUID=xxx 或 /dev/sdXN\n  挂载点      — 挂载到哪个目录\n  文件系统类型 — ext4、xfs、nfs、swap 等\n  挂载选项    — defaults、noatime、ro 等\n  dump        — 0=不备份，1=备份\n  fsck顺序    — 0=不检查，1=根分区优先，2=其他分区\n\n错误的 fstab 条目可能导致系统无法正常启动！\n修改前务必备份，测试时先用 mount -a 验证。"

[[sections.commands]]
