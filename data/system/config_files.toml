[[sections.config_files]]
id = "crontab-file"
path = "crontab"
name = "用户定时任务表"
description = "当前用户的 cron 定时任务配置，通过 crontab -e 编辑"
sample_content = "# 定时任务格式：\n# 分 时 日 月 周  命令\n#\n# 示例：\n# ┌───── 分钟 (0-59)\n# │ ┌───── 小时 (0-23)\n# │ │ ┌───── 日 (1-31)\n# │ │ │ ┌───── 月 (1-12)\n# │ │ │ │ ┌───── 星期 (0-7)\n# │ │ │ │ │\n# * * * * * command\n\n# 环境变量\nSHELL=/bin/bash\nPATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\nMAILTO=admin@example.com\n\n# 每天凌晨 2 点备份数据库\n0 2 * * * /usr/local/bin/backup-db.sh >> /var/log/backup.log 2>&1\n\n# 每小时清理 7 天前的临时文件\n0 * * * * find /tmp -type f -mtime +7 -delete\n\n# 每周一早上 6 点发送周报\n0 6 * * 1 /usr/local/bin/send-weekly-report.sh\n\n# 每 5 分钟检查服务状态\n*/5 * * * * /usr/local/bin/health-check.sh\n\n# 每月 1 号凌晨 3 点清理日志\n0 3 1 * * /usr/local/bin/rotate-logs.sh"

[[sections.config_files.lessons]]
title = "添加每日备份任务"
before = "# 每月 1 号凌晨 3 点清理日志\n0 3 1 * * /usr/local/bin/rotate-logs.sh"
after = "# 每月 1 号凌晨 3 点清理日志\n0 3 1 * * /usr/local/bin/rotate-logs.sh\n\n# 每天凌晨 3:30 增量备份 /home 目录\n30 3 * * * tar czf /backup/home-$(date +\\%Y\\%m\\%d).tar.gz /home 2>/dev/null"
explanation = "30 3 * * * 表示每天凌晨 3 点 30 分执行。\n\n命令解析：\n  tar czf — 创建 gzip 压缩归档\n  $(date +\\%Y\\%m\\%d) — 在文件名中插入日期（如 20260309）\n  注意：crontab 中 % 有特殊含义（换行），必须用 \\ 转义\n  2>/dev/null — 丢弃错误输出，避免产生大量邮件通知\n\n备份最佳实践：\n  1. 选择系统低负载时段\n  2. 将备份写入独立磁盘或远程存储\n  3. 添加日志记录（>> /var/log/backup.log 2>&1）\n  4. 定期检查备份是否成功、文件是否可恢复"
practice_command = "crontab -l"

[[sections.config_files.lessons]]
title = "添加每周日志轮转任务"
before = "# 每月 1 号凌晨 3 点清理日志\n0 3 1 * * /usr/local/bin/rotate-logs.sh"
after = "# 每月 1 号凌晨 3 点清理日志\n0 3 1 * * /usr/local/bin/rotate-logs.sh\n\n# 每周日凌晨 4 点压缩并轮转应用日志\n0 4 * * 0 cd /var/log/myapp && gzip -9 app.log && mv app.log.gz app-$(date +\\%Y\\%m\\%d).log.gz && touch app.log"
explanation = "0 4 * * 0 表示每周日凌晨 4 点执行。\n星期字段中 0 和 7 都代表周日。\n\n命令流程：\n  1. cd /var/log/myapp — 进入日志目录\n  2. gzip -9 app.log — 最高压缩率压缩当前日志\n  3. mv 重命名为带日期的归档文件\n  4. touch app.log — 创建新的空日志文件\n\n为什么需要日志轮转：\n  - 防止日志文件无限增长占满磁盘\n  - 便于按时间段查找历史日志\n  - 压缩后节省大量磁盘空间\n\n注意：生产环境推荐使用 logrotate 工具，它提供更完善的轮转策略。"
practice_command = "crontab -l"
