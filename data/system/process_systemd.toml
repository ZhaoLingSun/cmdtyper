[[sections]]
id = "systemd-units"
title = "Systemd 服务单元"
description = "systemd 是现代 Linux 发行版的初始化系统和服务管理器（PID 1）。\n它使用\"单元（Unit）\"来管理系统资源。\n\n常见单元类型：\n  .service — 系统服务（如 nginx、sshd、mysql）\n  .timer   — 定时任务（替代 cron）\n  .socket  — 套接字激活（按需启动服务）\n  .target  — 单元组（类似传统的运行级别）\n  .mount   — 文件系统挂载点\n  .path    — 文件路径监控\n\n服务管理常用操作：\n  start    — 立即启动服务\n  stop     — 立即停止服务\n  restart  — 重启服务（先停后启）\n  reload   — 重新加载配置（不中断服务）\n  enable   — 设为开机自启\n  disable  — 取消开机自启\n  status   — 查看服务当前状态"

