[[sections]]
id = "job-control"
title = "作业控制"
description = "作业控制（Job Control）允许你在同一终端中管理多个进程，\n在前台和后台之间切换任务。\n\n核心操作：\n  Ctrl+Z  — 暂停当前前台进程（发送 SIGTSTP）\n  jobs    — 查看当前终端的后台作业列表\n  bg %N   — 将作业 N 在后台继续运行\n  fg %N   — 将作业 N 调到前台运行\n  cmd &   — 直接在后台启动命令\n\nnohup 命令让进程忽略 SIGHUP 信号，即使终端关闭进程也不会退出。\n配合 & 使用，可以让程序在退出终端后继续运行。\n\n使用场景：在 SSH 远程连接中运行长时间任务时，\n用 nohup 或 screen/tmux 确保任务不会因断开连接而中止。\n\n本组模拟情境：一号日志跟踪作业已先按 Ctrl-Z 暂停；先用 jobs 核对 Stopped，再用 bg 在后台继续，随后可用 fg 带回前台。"

[[sections.commands]]
