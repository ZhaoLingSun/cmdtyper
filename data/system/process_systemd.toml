
[meta]
id = "process_systemd"
topic = "进程管理与 Systemd"
description = "理解 Linux 进程生命周期、进程状态、信号机制，以及 systemd 服务管理和日志查看"
difficulty = "advanced"
icon = "⚙️"
overview = "  创建 (fork/exec)\n       │\n       ▼\n  ┌─────────┐    CPU 调度     ┌──────────┐\n  │  就绪 R  │ ──────────────→│  运行 R   │\n  │ (Ready)  │←───────────────│(Running)  │\n  └─────────┘   时间片用完    └──────────┘\n       ▲                           │\n       │                     ┌─────┴─────┐\n   事件完成                  │            │\n       │                  等待 I/O     exit()\n  ┌─────────┐              │            │\n  │  睡眠 S  │←────────────┘    ┌──────────┐\n  │(Sleeping)│                  │  僵尸 Z   │\n  └─────────┘                  │ (Zombie)  │\n                               └──────────┘\n\n  进程状态说明:\n    R (Running/Runnable) — 正在运行或在运行队列中等待\n    S (Sleeping)         — 可中断睡眠，等待事件完成\n    D (Disk Sleep)       — 不可中断睡眠，通常等待 I/O\n    Z (Zombie)           — 已终止但父进程尚未回收\n    T (Stopped)          — 被信号停止（如 Ctrl+Z）"

[[sections]]
id = "process-basics"
title = "进程基础"
description = "每个运行中的程序都是一个进程（Process）。Linux 内核为每个进程分配唯一的进程 ID（PID）。\n\n关键概念：\n  PID  — 进程标识符，系统中唯一\n  PPID — 父进程 ID，表示由哪个进程创建\n  UID  — 运行该进程的用户 ID\n  进程树 — 所有进程以 init/systemd（PID=1）为根，形成树形结构\n\n进程创建方式：\n  fork()  — 创建当前进程的副本（子进程）\n  exec()  — 用新程序替换当前进程的内存映像\n  通常 fork + exec 配合使用来启动新程序\n\nps 命令用于查看当前系统中的进程快照，pstree 以树形展示进程间的父子关系。"

