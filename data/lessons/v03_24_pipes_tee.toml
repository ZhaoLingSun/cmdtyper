
[meta]
command = "v03-pipes-tee"
full_name = "管道与 tee 分流"
category = "pipeline"
difficulty = "basic"
importance = "core"

[overview]
summary = "让左侧标准输出成为右侧标准输入，并按需同时显示和保存"
explanation = "管道把左侧命令的标准输出连接到右侧命令的标准输入，适合把“产生数据、筛选、截断、统计”拆成可读阶段。默认管道不传递标准错误，所以左侧失败时，错误仍可能显示在终端，而右侧只收到空输入；若确实要把错误纳入后续处理，应在进入管道前显式合并。tee 是一种分流器：它读取标准输入，一份继续显示或传给下游，另一份写入文件。tee 默认覆盖目标文件，带追加选项才会保留旧内容。设计管道时要同时检查数据流、错误流和每个阶段的退出状态，不能只看最后一个数字。"

[syntax]
basic = "生产者 | 处理器 [| 后续处理器]；生产者 | tee [写入模式] 文件"

[[syntax.parts]]
name = "生产者"
desc = "把可处理文本写到标准输出；其标准错误默认不进入管道"

[[syntax.parts]]
name = "处理器"
desc = "从标准输入读取上游结果，并输出筛选、截断或统计后的新流"

[[syntax.parts]]
name = "分流文件"
desc = "tee 保存副本的位置；写入前要判断是覆盖还是追加"

[[options]]
flag = "|"
name = "连接标准输出到标准输入"
note = "默认只连接文件描述符 1；错误流需要单独决定去向"

[[options]]
flag = "tee"
name = "显示并写入"
note = "默认会覆盖目标文件，同时把收到的数据继续写到标准输出"

[[options]]
flag = "-a"
name = "tee 追加模式"
note = "保留文件旧内容并把新数据附加到末尾，适合连续记录"

[[options]]
flag = "2>&1"
name = "管道前合并错误流"
note = "只有明确希望下游处理诊断时才合并；合并后正常结果与错误更难区分"

[[examples]]
id = "v03-24-pipes-tee-01"
command_id = "pipe-process-list-head"
level = 1

[[examples]]
id = "v03-24-pipes-tee-02"
command_id = "pipe-count-error-lines"
level = 1

[[examples]]
id = "v03-24-pipes-tee-03"
command_id = "tee-display-and-save"
level = 2

[[examples]]
id = "v03-24-pipes-tee-04"
command_id = "tee-append-monitor-log"
level = 2

[[examples]]
id = "v03-24-pipes-tee-05"
command_id = "pipe-stdout-only-count"
level = 3

[[examples]]
id = "v03-24-pipes-tee-06"
command_id = "pipe-merge-stderr-count"
level = 3

[[gotchas]]
title = "右侧得到零行不代表左侧成功"
content = "左侧若只产生标准错误，管道中的计数器可能仍输出零。应同时观察错误信息和阶段状态，避免把“没有正常输出”误判为“没有问题”。"

[[gotchas]]
title = "tee 也有覆盖风险"
content = "tee 默认写入模式与覆盖重定向相似，会替换旧内容。保存已有日志或记录时必须明确使用追加模式，并检查目标文件。"

[[gotchas]]
title = "合并后会失去流的边界"
content = "把标准错误并入标准输出后，下游能处理两类文本，但也更难区分数据和诊断。若需要分别分析，优先单独保存错误流。"
