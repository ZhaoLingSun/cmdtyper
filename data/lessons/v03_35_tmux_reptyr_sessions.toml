
[meta]
command = "tmux-reptyr-sessions"
full_name = "Terminal sessions, tmux recovery, and cautious reptyr attachment"
category = "process"
difficulty = "practical"
importance = "common"

[overview]
summary = "优先用 tmux 保持任务；遗留进程接管必须按身份、会话与 ptrace 约束逐步核对"
explanation = "终端恢复分两类。预防性方案是 tmux：服务端保存会话（session），会话包含窗口（window），窗口再包含窗格（pane）；客户端断开通常不结束服务端中的任务。`tmux new -s dev` 会创建命名会话并让当前客户端立即进入，并非分离启动。恢复时先 `list-sessions` 核对当前用户可见的会话，再 `list-windows` 和 `list-panes` 定位窗口、窗格、启动 PID、TTY 与前台命令，必要时用 `capture-pane` 只读恢复最近输出。`detach-client` 只分离客户端视图，`kill-session` 则永久删除目标会话：仅由该会话独占的窗口和窗格会随之关闭，同时链接到其他会话的窗口仍保留在那些会话中；使用前必须核对链接关系、会话名、所有权、任务可终止性和输出保存状态。\n\n补救性方案是 reptyr：它尝试把已运行进程重新关联到当前终端，会改变目标的终端关系，不能当作普通查看命令。先用 `tty` 记录当前 TTY，再用 `ps ww` 同时检查 USER、PID、PPID、SID、TTY、STAT 和完整 ARGS。PID 可被复用，必须使用最新快照；目标必须属于当前同一用户，命令行、父进程、会话 ID 与原 TTY 都应符合预期。随后只读确认 reptyr 可用并查看 Yama `ptrace_scope`。内核、容器、能力、dumpable 状态和 Yama 都可能阻止附加；失败时应尊重策略，而不是关闭安全限制或随手 sudo。本课只展示普通 `reptyr PID` 尝试；配套静态场景不仅给出 `ptrace_scope=1`，还明确规定目标不是跟踪者的后代、没有通过 `PR_SET_PTRACER` 授权该跟踪者，且调用者在目标用户命名空间没有 `CAP_SYS_PTRACE`，因此预设结果才是 `Operation not permitted`，失败后立即停止。本课有意不练习 `reptyr -T`：它捕获的是整条 TTY，而不是单个 PID，可能影响该终端上的全部相关进程；绝不能用它绕过 Yama、权限或所有权策略。任何整条 TTY 操作前，都应先用 `ps -t TTY -o ...` 只读盘点所有者与进程范围。"

[syntax]
basic = "tmux 对象操作；tty；ps ww -o user,pid,ppid,sid,tty,stat,args -p PID；ps -t TTY -o user,pid,ppid,sid,tty,stat,cmd；reptyr PID"

[[syntax.parts]]
name = "会话 session"
desc = "tmux 服务端中的顶层工作区，可包含多个窗口；连接与分离客户端通常不终止会话任务"

[[syntax.parts]]
name = "窗口 window"
desc = "会话中的编号或命名工作区；目标常写成 session:window，例如 dev:0"

[[syntax.parts]]
name = "窗格 pane"
desc = "窗口中的独立伪终端区域；目标可写 session:window.pane，例如 dev:0.0"

[[syntax.parts]]
name = "进程关系"
desc = "PID 标识进程，PPID 指向父进程，SID 标识会话，TTY 表示控制终端；四者结合命令行判断归属"

[[syntax.parts]]
name = "所有权"
desc = "普通接管应限定当前同一用户拥有的目标；跨用户附加涉及权限和安全边界，不以 sudo 绕过"

[[syntax.parts]]
name = "ptrace 策略"
desc = "ptrace_scope=1 下不能只看直接父子关系：还要判断目标是否为跟踪者后代、是否有 PR_SET_PTRACER 授权，以及调用者是否具备 CAP_SYS_PTRACE"

[[syntax.parts]]
name = "整条 TTY 操作边界"
desc = "reptyr -T 会捕获整条 TTY 而非单个 PID，本课不练习；不得用它绕过 Yama、权限或所有权策略"

[[options]]
flag = "new -s 名称"
name = "创建命名会话"
example = "tmux new -s dev"
note = "命令会创建命名会话并立即进入；提前在 tmux 中启动长期任务，比事后接管裸终端进程更可预测"

[[options]]
flag = "attach -t 名称"
name = "连接已有会话"
example = "tmux attach -t dev"
note = "先用 list-sessions 确认名称、状态和当前用户所有权，避免连接错误目标"

[[options]]
flag = "list-sessions"
name = "会话清单"
example = "tmux list-sessions"
note = "只读查看当前用户 tmux 服务端中的名称、窗口数和 attached/detached 状态"

[[options]]
flag = "list-windows -t"
name = "窗口清单"
example = "tmux list-windows -t dev"
note = "在进入或清理前确认窗口编号、名称、窗格数与活动状态"

[[options]]
flag = "list-panes -F"
name = "窗格诊断字段"
example = "tmux list-panes -t dev:0 -F '#{pane_id} #{pane_pid} #{pane_tty} #{pane_current_command}'"
note = "窗格 PID 通常是窗格 shell/启动进程，不保证就是需要接管的最终子进程；继续用 ps 检查进程树"

[[options]]
flag = "capture-pane -p -S -50 | tail -n 50"
name = "打印最新 50 行"
example = "tmux capture-pane -p -t dev:0.0 -S -50 | tail -n 50"
note = "capture-pane 的候选范围包含历史和当前可见区域，tail 再从合并输出末端精确保留最新 50 行；仍受 tmux history-limit 和应用 alternate screen 行为影响"

[[options]]
flag = "detach-client -s"
name = "分离客户端"
example = "tmux detach-client -s dev"
note = "保留会话任务，但会中断其他连接者当前视图；仍需确认并沟通影响"

[[options]]
flag = "kill-session -t"
name = "永久结束会话"
example = "tmux kill-session -t dev"
note = "破坏性：删除目标会话；仅由它独占的窗口和窗格会随之关闭，同时链接到其他会话的窗口仍保留。执行前必须核对链接关系、多层清单、任务状态和输出保存"

[[options]]
flag = "ps ww -o user,pid,ppid,sid,tty,stat,args"
name = "接管前宽幅进程快照"
example = "ps ww -o user,pid,ppid,sid,tty,stat,args -p 4242"
note = "重复 w 避免长参数按终端宽度截断；必须重新获取最新结果，核对同一用户、PID 未复用、父子关系、SID、TTY、状态和完整命令"

[[options]]
flag = "reptyr PID"
name = "普通接管"
example = "reptyr 4242"
note = "本课预设 EPERM 的前提是：ptrace_scope=1、目标不是跟踪者后代、无 PR_SET_PTRACER 授权且调用者无目标用户命名空间中的 CAP_SYS_PTRACE。缺少任一事实时都不能仅凭“不是父进程”保证失败；失败后不 sudo、不降策略、不改用 -T"

[[options]]
flag = "ps -t TTY -o user,pid,ppid,sid,tty,stat,cmd"
name = "整条 TTY 的只读范围清单"
example = "ps -t pts/7 -o user,pid,ppid,sid,tty,stat,cmd"
note = "在考虑任何整条 TTY 操作前，先核对该终端上的全部进程、所有者和会话关系；清单本身不修改任务"

