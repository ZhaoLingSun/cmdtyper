[[gotchas]]
title = "session、window、pane 是三层不同对象"
content = "会话包含窗口，窗口包含窗格。`dev`、`dev:0`、`dev:0.0` 分别指向不同粒度；只看到窗口名相同不能证明窗格相同。恢复前按 session → window → pane 顺序列出，记录唯一目标和当前命令，再连接或操作。"

[[gotchas]]
title = "detach 与 kill 的后果完全不同"
content = "detach-client 只断开客户端视图，任务继续；kill-session 会删除目标会话，并关闭只由它独占的窗口、窗格及其前台任务。若某窗口同时链接到其他会话，它会在那些会话中继续存在，不能把“结束会话”笼统描述为销毁所有关联窗口。即使 kill 命令语法简单，也必须先核对当前用户所有权、精确会话名、窗口链接关系、窗口/窗格内容、其他连接者、未保存工作和输出备份。无法证明安全时只分离或保持现状。"

[[gotchas]]
title = "窗格 PID 不一定是目标业务进程"
content = "tmux 的 pane_pid 常是窗格启动的 shell，业务程序可能是其子进程。接管前通过最新 `ps` 检查 USER、PID、PPID、SID、TTY、STAT 和完整 ARGS，必要时沿父子关系继续观察。仅凭一个旧 PID 或进程名不能排除 PID 复用和同名进程。"

[[gotchas]]
title = "同用户所有权是普通接管的基本边界"
content = "reptyr 不应被用来接管其他用户的任务。先把目标 USER 与当前身份对照，并确认进程不是敏感服务、容器边界内任务或其他人的共享终端工作。权限不足不是自动使用 sudo 的理由；应停止并由任务所有者或系统策略负责人处理。"

[[gotchas]]
title = "SID 与 TTY 解释进程为何仍绑在旧终端"
content = "PID 是进程本身，PPID 表示直接父进程，SID 表示登录/作业控制会话，TTY 是控制终端。目标和当前 shell 的 TTY 不同本身很常见；关键是这些字段是否与预期来源一致。reptyr 会改变终端关联，前后台作业控制、信号和输入输出都可能受影响。"

[[gotchas]]
title = "Yama/ptrace 限制不应为方便而降低"
content = "`/proc/sys/kernel/yama/ptrace_scope` 是只读诊断入口。值 1 通常允许满足基础条件的后代跟踪，也可能允许目标通过 `PR_SET_PTRACER` 指定的跟踪者，或在目标用户命名空间具备 `CAP_SYS_PTRACE` 的调用者。只有在本课静态场景明确排除后代关系、显式授权和能力覆盖三条路径后，才把普通 reptyr 的结果预设为 `Operation not permitted`；“不是直接父进程”本身不够。容器、SELinux/AppArmor、dumpable 状态等还可能进一步限制操作。不要写 procfs、关闭 Yama 或扩大 capabilities。"

[[gotchas]]
title = "本课有意不练习 reptyr -T"
content = "`reptyr -T` 捕获的是整条控制 TTY，而不是只处理一个 PID，因此可能扰动该终端上的 shell、前台任务和其他相关进程。它不能作为普通模式失败后的练习升级路径，更不能用来绕过 Yama、权限、能力或所有权策略。遇到失败应保留错误并停止；若现实流程确需评估任何整条 TTY 操作，先用最新的 `ps -t TTY -o user,pid,ppid,sid,tty,stat,cmd` 只读盘点全部所有者与进程范围，再交由任务所有者和策略负责人决定。"

[[gotchas]]
title = "capture-pane 不是应用完整日志"
content = "tmux 历史可能被上限裁剪，程序使用 alternate screen 时可见内容也可能有限。捕获近期输出适合恢复上下文，但不能替代应用日志、事务状态或数据一致性检查。做破坏性会话清理前，应确认真正需要保存的输出已落在可靠位置。"
