[[gotchas]]
title = "完整环境可能直接暴露凭据"
content = "访问令牌、云密钥、代理口令和临时认证信息经常存放在环境变量中。分享前只读取必要变量并脱敏，不要上传完整环境快照。"

[[gotchas]]
title = "导出不是永久保存"
content = "export 改变的是当前 shell 的导出状态。关闭终端后通常消失；需要持久化时必须选择正确的启动文件，并先备份和审查。"

[[gotchas]]
title = "子进程继承是单向快照"
content = "子进程启动时取得环境副本。之后父 shell 的修改不会自动同步给已运行子进程，子进程也不能通过普通环境赋值改回父 shell。"
