[[gotchas]]
title = "变量值与有效分类值不是一回事"
content = "`printenv LC_TIME` 无输出仅说明变量未导出，日期分类仍可能从 LANG 继承中文值。相反，LANG 显示 zh_CN.utf8 也不保证日期为中文，因为 LC_ALL 或 LC_TIME 可能覆盖。诊断时同时保留 `locale` 汇总与关键变量查询。"

[[gotchas]]
title = "LC_ALL 是临时强制覆盖，不宜长期滥用"
content = "LC_ALL 会压过所有分类，方便让单条命令得到可复现行为，但长期写入 shell 配置会让分别设置消息、排序和日期变得困难。需要单命令固定排序时可写在该命令前，完成后自然失效；不要为排障永久覆盖整个会话而忘记恢复。"

[[gotchas]]
title = "查询命令与 export 的副作用不同"
content = "`locale`、`locale -a`、`locale charmap`、`printenv` 和 `echo \"$LANG\"` 都只读取并输出，不会改变 locale。`export LANG=...` 会修改当前 shell 的环境并被后续子进程继承，但不会追溯改变已启动进程，也不会生成缺失 locale 或修改系统全局配置。"

[[gotchas]]
title = "UTF-8、中文界面和中文排序不是同一设置"
content = "UTF-8 只描述字符编码；LC_MESSAGES 影响程序消息，LC_TIME 影响日期名称，LC_COLLATE 影响排序，LC_CTYPE 影响字符分类。终端字体缺字也可能显示方框，即使 charmap 已是 UTF-8。排查乱码要分别检查字节编码、locale 分类与显示字体。"
