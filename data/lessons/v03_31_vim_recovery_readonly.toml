[[gotchas]]
title = "只读模式不是权限边界"
content = "view/vim -R 主要防止无意写入。拥有文件写权限的用户仍可能通过强制命令或另一个程序改写文件；真正的保护来自操作系统权限、最小授权、备份和审计流程。"

[[gotchas]]
title = "交换文件提示先判断是否有人正在编辑"
content = "若另一个 Vim 会话仍活跃，直接恢复或删除交换文件可能制造两个竞争版本。先核对提示中的文件路径、用户、主机、进程号和时间；不能确认时只读查看并联系所有者。"

[[gotchas]]
title = "恢复不等于自动保存"
content = "恢复内容进入缓冲区后，应与磁盘文件比较，确认哪部分有效。可以另存到新路径保留证据，确认后再替换；若判断恢复内容不需要，用不写入的方式退出。最后只有在确认没有其他活跃会话时才处理旧交换文件。"

[[gotchas]]
title = "crontab 保存退出会产生系统行为变化"
content = "临时设置 VISUAL/EDITOR 只决定打开哪个编辑器，不会把编辑变成草稿。:wq 后 crontab 会安装保存内容；编辑前应先列出现状，编辑后再列出复核，并考虑任务运行环境与回滚。"

[[gotchas]]
title = "选项和 Ex 命令都区分大小写与标点"
content = "vim -R 的 R 是大写，vim -h 的 h 是小写，--version 和 --display 使用两个连字符。:q、:q!、:w 与 :wq 也有不同后果，感叹号不能省略或随意添加。"
