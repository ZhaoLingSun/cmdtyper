[[gotchas]]
title = "awk 中 $0 与 $1 的区别"
content = "awk 的字段引用：\n  $0  — 整行内容\n  $1  — 第 1 个字段\n  $2  — 第 2 个字段\n  $NF — 最后一个字段\n  $(NF-1) — 倒数第二个字段\n\n注意 $ 后面可以是表达式：\n  n=3; awk -v n=$n '{print $n}'  — 打印第 n 个字段\n\n另外，awk 的字段分隔默认是任意空白字符（空格和 Tab 的组合），\n多个连续空格算一个分隔符。要按单个字符分隔用 -F。"

[[gotchas]]
title = "awk 与 Shell 引号冲突"
content = "awk 程序通常用单引号包裹，避免 Shell 解析其中的 $ 符号：\n  awk '{print $1}'        ✓ 单引号，$1 是 awk 的字段引用\n  awk \"{print $1}\"        ✗ 双引号，$1 会被 Shell 替换为参数\n\n如果需要在 awk 中使用 Shell 变量，用 -v 传递：\n  awk -v name=\"$USER\" '{print name, $1}' file\n  而不是：awk '{print \"'$USER'\", $1}'（容易出错且不安全）"
