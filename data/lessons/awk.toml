
[meta]
command = "awk"
full_name = "Aho, Weinberger, Kernighan"
category = "text_process"
difficulty = "advanced"
importance = "core"

[overview]
summary = "强大的文本处理和数据提取工具"
explanation = "awk 是 Linux 中最强大的文本处理工具之一，以三位发明者的姓氏命名。它将每一行输入自动分割成字段（默认按空白分隔），通过 $1、$2 ... 引用各个字段（$0 代表整行），可以对数据进行提取、过滤、计算和格式化输出。awk 本质上是一个小型编程语言，支持变量、条件、循环、数组和函数。它的工作模式是\"模式 { 动作 }\"——对每一行，如果匹配模式就执行动作。特殊的 BEGIN 块在处理任何输入前执行，END 块在所有输入处理完后执行。在一行式命令中，awk 常用于提取特定列的数据。"

[syntax]
basic = "awk '模式 { 动作 }' [文件]"

[[syntax.parts]]
name = "模式"
desc = "匹配条件（正则表达式、比较表达式等），省略则匹配所有行"

[[syntax.parts]]
name = "动作"
desc = "对匹配行执行的操作，如 print、计算等"

[[options]]
flag = "-F"
name = "指定分隔符"
example = "awk -F: '{print $1}' /etc/passwd"
note = "设置输入字段分隔符（默认是空白字符）"

[[options]]
flag = "-v"
name = "定义变量"
example = "awk -v threshold=90 '$3 > threshold' scores.txt"
note = "在 awk 程序外部传入变量值"

[[options]]
flag = "-f"
name = "从文件读取脚本"
example = "awk -f script.awk data.txt"
note = "从文件中读取 awk 程序（适合复杂脚本）"

[[options]]
flag = "NR"
name = "行号变量"
example = "awk 'NR==5' file.txt"
note = "内置变量，表示当前处理的行号"

[[options]]
flag = "NF"
name = "字段数变量"
example = "awk '{print NF}' file.txt"
note = "内置变量，表示当前行的字段数"

[[options]]
flag = "BEGIN/END"
name = "特殊模式"
example = "awk 'BEGIN{sum=0} {sum+=$1} END{print sum}'"
note = "BEGIN 在处理前执行，END 在处理后执行"

