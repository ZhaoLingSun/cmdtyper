[[gotchas]]
title = "保存 crontab -e 就会安装变更"
content = "编辑器只是界面，真正对象是当前用户任务表。打开前先用 -l 记录现状，编辑时保留注释与环境设置，退出后再次只读核对。仅改变 VISUAL/EDITOR 不会让保存动作变成模拟。"

[[gotchas]]
title = "cron 使用自己的运行环境"
content = "交互 shell 中可用的 PATH、别名、当前目录、显示会话和环境变量在 cron 中可能不存在。计划命令应使用明确路径、受控工作目录、日志去向和错误处理；先单独验证脚本，再安排调度。"

[[gotchas]]
title = "星期与日期组合容易产生歧义"
content = "不同 cron 实现对“日”和“星期”同时受限时的匹配关系可能令人意外。简单计划也应根据目标系统手册验证语义，并把业务时区、节假日和夏令时影响写清楚。"

[[gotchas]]
title = "服务 active 不代表每个任务成功"
content = "cron.service 正在运行只说明调度器可工作，不证明任务语法、权限、路径或脚本执行成功。还要检查任务自己的输出、日志和预期产物，并限定明确时间窗口。"

[[gotchas]]
title = "-r 删除的是整张个人任务表"
content = "-i 只增加一次 y/Y 确认，不提供逐条选择、撤销或自动备份。若真正需要移除单条任务，应在备份现有表后进行有针对性的编辑；本课程不把整表删除当作清理捷径。"
