[[gotchas]]
title = "创建链接也要检查名称碰撞"
content = "链接路径若已存在，创建会失败或在某些强制选项下被替换。先检查链接名称及父目录，不要把“目标存在”与“链接名称可用”混为一谈。"

[[gotchas]]
title = "删除链接与删除目标不是一回事"
content = "应把操作对象明确到链接路径本身，并先用长格式确认它确实是链接。不要随意给指向目录的链接补尾随斜杠，也不要在未理解跟随规则时使用递归删除。"

[[gotchas]]
title = "大小、占用与类型是不同问题"
content = "长格式展示的通常是文件长度，磁盘占用还受块大小和稀疏文件影响；扩展名只是命名习惯，识别真实类型应结合 file 或更深入的格式检查。"
