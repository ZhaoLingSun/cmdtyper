
[meta]
command = "wc"
full_name = "word count"
category = "text_process"
difficulty = "beginner"
importance = "core"

[overview]
summary = "统计文件的行数、单词数和字节数"
explanation = "wc（word count）命令用于统计文件中的行数、单词数和字节数。它是最简单但最实用的文本处理工具之一。wc 经常通过管道与其他命令配合使用，例如统计搜索结果的数量、统计代码行数、检查文件记录数等。不带任何选项时，wc 会同时输出行数、单词数和字节数。"

[syntax]
basic = "wc [选项] [文件]..."

[[syntax.parts]]
name = "选项"
desc = "指定统计哪种计数"

[[syntax.parts]]
name = "文件"
desc = "要统计的文件，省略时从标准输入读取"

[[options]]
flag = "-l"
name = "统计行数"
example = "wc -l file.txt"
note = "只输出行数，这是最常用的选项"

[[options]]
flag = "-w"
name = "统计单词数"
example = "wc -w essay.txt"
note = "按空白字符分隔统计单词数量"

[[options]]
flag = "-c"
name = "统计字节数"
example = "wc -c file.bin"
note = "输出文件的字节大小"

[[options]]
flag = "-m"
name = "统计字符数"
example = "wc -m chinese.txt"
note = "统计字符数（中文等多字节字符算 1 个），与 -c 不同"

[[options]]
flag = "-L"
name = "最长行长度"
example = "wc -L code.py"
note = "输出文件中最长行的字符数"

[[examples]]
level = 1
summary = "统计 /etc/passwd 的行数、单词数和字节数"
simulated_output = "  42  68 2456 /etc/passwd"
output_explanation = "输出分别表示行数、单词数、字节数（或仅某一项），常用于快速统计文本规模或结果数量。"
