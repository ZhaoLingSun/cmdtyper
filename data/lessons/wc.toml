[[gotchas]]
title = "wc -l 统计的是换行符数量"
content = "wc -l 实际上是统计换行符（\\n）的数量，而不是\"行数\"。\n如果文件最后一行没有换行符，该行不会被计入：\n  echo -n \"hello\" | wc -l    → 0（没有换行符）\n  echo \"hello\" | wc -l       → 1（有一个换行符）\n\n大多数正常的文本文件最后都有换行符，所以通常不会出问题。\n但处理某些工具生成的文件时需要注意这一点。"
