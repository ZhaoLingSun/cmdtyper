[[gotchas]]
title = "同一个键在不同模式含义不同"
content = "插入模式的 x 会输入字符，普通模式的 x 会删除光标处字符。卡住时先按 Esc 回到普通模式，再决定移动、撤销还是进入 : 命令；模式不明时不要靠连续输入猜测。"

[[gotchas]]
title = "保存和退出不是同一动作"
content = ":w 写入但不退出，:q 退出但要求没有未保存修改，:wq 组合两者，:q! 明确丢弃修改。看到 E37 等警告应停下来判断内容是否需要保存，而不是条件反射加 !。"

[[gotchas]]
title = "只读查看优先于误入编辑"
content = "检查脚本、服务表或配置时，less 能分页搜索且不写回文件。真正编辑前先只读核对目标路径、行号和现状，并准备备份或版本控制；不要在不确定模式时打开关键配置练习。"

[[gotchas]]
title = "Vim 与 less 的内部按键不是 shell 命令"
content = "i、Esc、:wq、/TODO、n 和 q 都是在对应程序界面中按下。退出回到 shell 后再输入它们会有完全不同结果；学习时应明确提示符是否可见。"

[[gotchas]]
title = "大小写会改变选项或按键"
content = "less -N 的 N 是大写，Vim 普通模式中的命令也常区分大小写。教程中应按原样输入，不根据发音替换；如果效果不符，先检查模式和大小写。"
