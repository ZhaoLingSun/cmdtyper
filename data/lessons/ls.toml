
[meta]
command = "ls"
full_name = "list"
category = "file_ops"
difficulty = "beginner"
importance = "core"

[overview]
summary = "列出目录中的文件和子目录"
explanation = "ls 是 Linux 中最常用的命令之一，用于列出指定目录中的文件和子目录。默认情况下，ls 会列出当前工作目录下的内容，不包括以点（.）开头的隐藏文件。通过组合不同的选项，你可以查看文件的详细信息（权限、大小、修改时间等）、显示隐藏文件、按不同方式排序，以及递归列出子目录的内容。ls 是你在终端中导航和了解文件系统结构时最基础、最重要的工具。"

[syntax]
basic = "ls [选项]... [文件或目录]..."

[[syntax.parts]]
name = "选项"
desc = "控制输出格式和排序方式的标志，如 -l、-a、-h 等"

[[syntax.parts]]
name = "文件或目录"
desc = "要列出的目标路径，省略时默认为当前目录"

[[options]]
flag = "-l"
name = "长格式输出"
example = "ls -l"
note = "显示权限、所有者、大小、修改日期等详细信息"

[[options]]
flag = "-a"
name = "显示所有文件"
example = "ls -a"
note = "包括以点（.）开头的隐藏文件，例如 .bashrc、.gitignore"

[[options]]
flag = "-h"
name = "人类可读的大小"
example = "ls -lh"
note = "将文件大小以 K、M、G 等单位显示，必须与 -l 配合使用才有效果"

[[options]]
flag = "-R"
name = "递归列出"
example = "ls -R"
note = "递归列出所有子目录的内容"

[[options]]
flag = "-t"
name = "按修改时间排序"
example = "ls -lt"
note = "最近修改的文件排在前面"

[[options]]
flag = "-S"
name = "按文件大小排序"
example = "ls -lS"
note = "最大的文件排在前面"

