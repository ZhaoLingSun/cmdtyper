[[gotchas]]
title = "隐藏文件不会默认显示"
content = "Linux 中以点（.）开头的文件和目录是隐藏文件（称为 dotfiles）。使用普通的 ls 命令看不到它们。你必须加上 -a 选项才能显示这些文件。许多重要的配置文件都是隐藏的，例如 .bashrc、.ssh/、.gitconfig 等。如果你觉得目录里「什么都没有」，请先试试 ls -a。"

[[gotchas]]
title = "-h 选项需要配合 -l 使用"
content = "-h（human-readable）选项只会在长格式输出中生效。如果单独使用 ls -h，你不会看到任何变化，因为普通 ls 本来就不显示文件大小。正确的用法是 ls -lh，这样文件大小才会以 K、M、G 等单位显示，而不是默认的字节数。"
