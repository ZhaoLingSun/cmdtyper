[[gotchas]]
title = "uniq -c 统计连续段，不是全局集合"
content = "输入 `a, b, a` 会得到三个连续段，而不是把两个 a 合并。要做全局频次，通常先按与你的等价定义一致的键排序。若只关心某字段，应先使用正确 delimiter 提取或规范化该字段；直接排序整行会把其他字段差异也计入。"

[[gotchas]]
title = "wc -l 统计换行符"
content = "最后一段文本若没有换行结束，编辑器可能显示它是最后一行，但 `wc -l` 不会为它增加计数。计数前说明“物理换行符”“文本记录”还是“业务事件”，避免把工具结果贴上错误标签。"

[[gotchas]]
title = "首尾样本不能证明全局状态"
content = "head 适合确认文件头格式，tail 适合查看最近尾部，但中间记录仍可能包含不同 schema、错误或敏感信息。抽样结论应注明范围；需要完整验证时使用针对字段和格式的专门检查。"

[[gotchas]]
title = "locale 会影响第一次文本排序"
content = "频次管道的第一次 sort 受 locale 排序规则影响；相等行通常仍能相邻，但大小写、重音和字节序的业务含义需要明确。最后的 `sort -nr` 是数值降序，不能省略 -n 后仅靠字符顺序排列计数。"
