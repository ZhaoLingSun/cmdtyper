
[meta]
command = "counts-head-tail"
full_name = "Counting records and bounded file views"
category = "text_process"
difficulty = "basic"
importance = "core"

[overview]
summary = "用明确的记录边界做计数，并用有限输出安全查看文件首尾"
explanation = "`head` 与 `tail` 默认把换行分隔的文本行视为记录，`-n N` 限制最多显示多少行；不带参数的 `tail` 默认显示末尾 10 行。`wc -l` 统计的是换行符数量，因此一个没有结尾换行的最后一段文本可能不计为一“行”。频次管道 `sort | uniq -c | sort -nr` 先让完全相同的整行记录相邻，再由 uniq 统计连续段，最后按行首计数做数值降序；任何字段提取、分隔符或规范化都应在第一次排序前明确完成，否则它统计的是整行而不是你脑中设想的某一列。读取 `/etc/passwd` 时，冒号字段语义仍然存在，但 head 只截取记录，并不解析字段。有限输出适合快速建立样本，不代表完整文件；计数结果也只对应当时的输入快照。"

[syntax]
basic = "head|tail [-n 行数] 文件；wc -l 文件；sort 输入 | uniq -c | sort -nr"

[[syntax.parts]]
name = "行数"
desc = "正整数限制输出记录数；这里的记录由换行分隔，不是逻辑日志事件或 CSV 行的保证"

[[syntax.parts]]
name = "计数对象"
desc = "wc -l 统计换行符，uniq -c 统计相邻且完全相同的行；先明确是否需要提取字段"

[[syntax.parts]]
name = "排序语义"
desc = "第一次 sort 为相同记录聚类；最后 sort -nr 按数字降序排列计数，-r 反转数值顺序"

[[syntax.parts]]
name = "样本边界"
desc = "head/tail 只展示首尾样本，不应把没有看到的内容推断为不存在"

[[options]]
flag = "head -n N"
name = "读取开头 N 行"
example = "head -n 15 app.log"
note = "只读且有界；多行事件可能在边界处被截断"

[[options]]
flag = "tail -n N"
name = "读取末尾 N 行"
example = "tail -n 20 service.log"
note = "适合查看最近追加的行，但时间顺序仍取决于日志写入方式"

[[options]]
flag = "tail 文件"
name = "默认末尾十行"
example = "tail app.log"
note = "默认值是 10；团队脚本中显式写 -n 往往更易读"

[[options]]
flag = "wc -l"
name = "换行符计数"
example = "wc -l settings.ini"
note = "输出通常包含数字和文件名；无结尾换行时不要把它等同于编辑器显示的逻辑行数"

[[options]]
flag = "uniq -c"
name = "相邻重复段计数"
example = "uniq -c status_runs.txt"
note = "输入必须已保证相同值相邻；命令自身不会全局搜索重复项"

[[options]]
flag = "sort -nr"
name = "计数数值降序"
example = "sort endpoints.txt | uniq -c | sort -nr"
note = "最后一步按计数的数字值从高到低排列，而不是按字符字典序"

