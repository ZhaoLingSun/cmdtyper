[meta]
command = "kill"
full_name = "kill"
category = "process"
difficulty = "basic"
importance = "core"

[overview]
summary = "向进程发送信号（终止、停止等）"
explanation = """kill 命令用于向进程发送信号（signal）。虽然名字叫"kill"，但它不只是"杀死"进程，\
而是可以发送各种信号来控制进程的行为。最常用的信号是 SIGTERM（15，优雅终止）\
和 SIGKILL（9，强制终止）。当程序不响应时，kill -9 是最后手段。\
kill 需要指定进程的 PID（进程ID），可以通过 ps、top、pgrep 等命令查找。\
除了 kill 命令外，还有 killall（按进程名终止）和 pkill（按模式匹配终止）等便捷工具。"""

[syntax]
basic = "kill [选项] PID..."
[[syntax.parts]]
name = "PID"
desc = "要发送信号的进程 ID，可以指定多个"

[[options]]
flag = "-9"
name = "强制终止 (SIGKILL)"
example = "kill -9 12345"
note = "仅在已向同一目标发送 TERM、等待合理时间，并紧接着用新的 `ps ww -o user,pid,ppid,stat,args -p 12345` 快照或服务管理器状态重新核对 PID、所有者和完整命令行后，才能把 SIGKILL 作为最后手段；若目标已退出、PID 被复用或身份无法证明，必须停止，不能执行本例"

[[options]]
flag = "-15"
name = "优雅终止 (SIGTERM)"
example = "kill -15 12345"
note = "请求进程正常退出，这是默认信号，进程可以进行清理工作"

[[options]]
flag = "-STOP"
name = "暂停进程 (SIGSTOP)"
example = "kill -STOP 12345"
note = "暂停进程的运行（可用 kill -CONT 恢复）"

[[options]]
flag = "-CONT"
name = "恢复进程 (SIGCONT)"
example = "kill -CONT 12345"
note = "恢复被暂停的进程继续运行"

[[options]]
flag = "-HUP"
name = "挂起信号 (SIGHUP)"
example = "kill -HUP 1205"
note = "SIGHUP 的含义由应用决定，默认处置可能直接终止进程；只有目标文档明确支持 reload，并已核对服务角色、最新 PID、所有者和完整命令行时才考虑发送"

[[options]]
flag = "-l"
name = "列出所有信号"
example = "kill -l"
note = "显示系统支持的所有信号名称和编号"

[[examples]]
level = 1
command = "kill 12345"
summary = "向进程 12345 发送默认的 SIGTERM 信号"
simulated_output = ""

output_explanation = "kill 成功返回通常只说明内核接受了信号请求，不证明目标已经退出。随后应立即用新的 `ps ww -o user,pid,ppid,stat,args -p 12345` 快照或服务管理器状态核对同一进程的所有者、完整命令行和运行状态；不要用 pwd、ls 或 stat 等无关文件证据判断进程结果。"
[[examples.token_details]]
token = "12345"
explanation = "数字参数，表示数量、行数、PID 或其他数值设置。"

[[examples]]
level = 1
command = "kill -TERM 12345"
summary = "显式请求进程 12345 正常退出"
simulated_output = ""

output_explanation = "该命令成功时通常不会在终端产生可见输出；发送信号前应重新核对 PID、所有者和完整命令行，发送后再观察进程是否正常退出。"
[[examples.token_details]]
token = "-TERM"
explanation = "显式发送 SIGTERM，请求进程先清理资源再退出。"

[[examples.token_details]]
token = "12345"
explanation = "目标进程 PID；动作前必须重新核对，避免 PID 已被复用。"

[[examples]]
level = 2
command = "kill -l"
summary = "列出所有可用的信号"
simulated_output = """ 1) SIGHUP\t 2) SIGINT\t 3) SIGQUIT\t 4) SIGILL\t 5) SIGTRAP
 6) SIGABRT\t 7) SIGBUS\t 8) SIGFPE\t 9) SIGKILL\t10) SIGUSR1
11) SIGSEGV\t12) SIGUSR2\t13) SIGPIPE\t14) SIGALRM\t15) SIGTERM
16) SIGSTKFLT\t17) SIGCHLD\t18) SIGCONT\t19) SIGSTOP\t20) SIGTSTP
21) SIGTTIN\t22) SIGTTOU\t23) SIGURG\t24) SIGXCPU\t25) SIGXFSZ
26) SIGVTALRM\t27) SIGPROF\t28) SIGWINCH\t29) SIGIO\t30) SIGPWR
31) SIGSYS"""

output_explanation = "该命令用于向进程发送信号。成功时通常无输出，若使用 `-l` 会列出信号编号与名称；建议先确认 PID，避免误杀关键进程。"
[[examples.token_details]]
token = "-l"
explanation = "列表模式或逐行统计（取决于命令）。"

[[examples]]
level = 2
command = "systemctl show -p MainPID --value nginx"
summary = "只读取得 systemd 当前记录的 nginx 主进程 PID，作为任何信号操作前的核对线索"
simulated_output = "1205"

output_explanation = "MainPID 来自服务管理器当前状态，比读取可能陈旧的 PID 文件更可靠，但仍需用 ps 复核 PID、所有者和完整命令行。本例只查询，不发送 HUP；真实 reload 还应先做配置检查并优先使用服务管理器提供的 reload 动作。"
[[examples.token_details]]
token = "show"
explanation = "读取 systemd 单元属性，不改变服务状态。"

[[examples.token_details]]
token = "-p MainPID --value"
explanation = "只选择 MainPID 属性并仅输出它的值，供后续人工交叉核对。"

[[examples]]
level = 3
command = "killall -i -u \"$USER\" -s TERM python3"
summary = "把范围限制为当前用户，并在向每个 python3 进程发送 TERM 前逐项确认"
simulated_output = "Kill python3(12345) ? (y/N)"

output_explanation = "-u 把范围限制为当前用户，-i 在每个匹配项前询问，TERM 允许正常清理。执行前仍应先用 pgrep -a -x -u \"$USER\" python3 只读查看全部候选；看到不明确的命令行时回答 n。"
[[examples.token_details]]
token = "-i"
explanation = "对每个匹配进程交互确认，避免无提示地终止所有同名进程。"

[[examples.token_details]]
token = "-u \"$USER\""
explanation = "只考虑当前用户名下的匹配进程，缩小批量操作范围。"

[[examples.token_details]]
token = "-s TERM"
explanation = "显式发送 SIGTERM，请求进程正常退出。"

[[examples]]
level = 4
command = "pgrep -a -u \"$USER\" -f '^/usr/bin/gunicorn --config /etc/myapp/gunicorn\\.conf myapp:wsgi$'"
summary = "只读预览当前用户下完整命令行精确符合锚定正则的 gunicorn 进程"
simulated_output = "24810 /usr/bin/gunicorn --config /etc/myapp/gunicorn.conf myapp:wsgi"

output_explanation = "这是发送信号前的预览，不会终止进程。-u 限定用户，-a 显示完整命令行，^ 和 $ 把扩展正则锚定到整条命令行；只有清单逐项确认后，执行动作才能复用完全相同的匹配条件。"
[[examples.token_details]]
token = "-f"
explanation = "让 pgrep 用扩展正则表达式匹配完整命令行，而不是只匹配进程名；这不是 shell 文件通配符。"

[[examples.token_details]]
token = "^/usr/bin/gunicorn --config /etc/myapp/gunicorn\\.conf myapp:wsgi$"
explanation = "锚定的扩展正则：^ 和 $ 限定整条命令行，\\. 让配置文件名中的点号按字面匹配。"

[[gotchas]]
title = "SIGTERM 与 SIGKILL 的区别"
content = """kill 默认发送 SIGTERM（15），SIGTERM 是一个"请求"：
  - 进程可以捕获 SIGTERM，执行清理（关闭文件、断开连接等）后再退出
  - 进程也可以选择忽略 SIGTERM（这就是为什么有时 kill 不起作用）

SIGKILL（9）是一个"命令"：
  - 由内核直接处理，进程无法捕获或忽略
  - 进程被立即终止，没有机会做任何清理
  - 可能导致数据丢失（如未保存的文件、未完成的数据库事务）

正确顺序：发送 TERM 后等待合理时间，随后立即获取新的 `ps ww` 或服务状态证据，重新核对 PID、所有者和完整命令行。若进程已退出就停止；若 PID 已被复用、身份变化或无法证明仍是原目标，也必须停止。只有 TERM 明确无效且这次即时复核仍确认同一目标时，才把 KILL 作为最后手段。"""

[[gotchas]]
title = "kill 需要正确的 PID"
content = """PID 必须来自最新的只读证据，而不是旧 PID 文件或记忆。常用核对方法：
  ps ww -o user,pid,ppid,etime,args -p PID  — 检查所有者、运行时间和完整参数
  pgrep -a -x -u "$USER" nginx          — 按当前用户和精确进程名预览

需要匹配完整命令行时，先用 `pgrep -a -u "$USER" -f '锚定的扩展正则'` 预览。`-f` 使用的是正则表达式，不是 shell glob；未加 ^/$ 的宽模式可能命中包装器、参数或无关任务。
批量发送信号时必须复用预览中决定匹配集合的同一组 -x、-u、名称或 -f 正则，并优先 TERM。killall 至少使用用户范围和 -i 逐项确认。无法逐项证明目标正确时，不发送信号。"""
