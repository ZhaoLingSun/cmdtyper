
[meta]
command = "tail"
full_name = "tail"
category = "text_process"
difficulty = "beginner"
importance = "core"

[overview]
summary = "显示文件的末尾部分，支持实时跟踪"
explanation = "tail 命令用于显示文件的末尾部分内容，默认显示最后 10 行。tail 最强大的功能是 -f（follow）选项，它可以实时跟踪文件的新增内容，这在监控日志文件时极其常用。当应用程序持续写入日志时，tail -f 会自动显示新追加的内容，直到你按 Ctrl+C 中断。与 head 命令相对应，tail 查看文件末尾，head 查看文件开头。在日常运维和开发调试中，tail -f 几乎是使用频率最高的命令之一。"

[syntax]
basic = "tail [选项] [文件]..."

[[syntax.parts]]
name = "选项"
desc = "控制输出行数或启用实时跟踪"

[[syntax.parts]]
name = "文件"
desc = "要查看的文件，省略时从标准输入读取"

[[options]]
flag = "-n"
name = "指定行数"
example = "tail -n 20 app.log"
note = "显示文件最后 N 行，也可以写成 tail -20 app.log"

[[options]]
flag = "-f"
name = "实时跟踪"
example = "tail -f /var/log/syslog"
note = "持续输出文件新增的内容，Ctrl+C 停止"

[[options]]
flag = "-F"
name = "跟踪并重试"
example = "tail -F app.log"
note = "类似 -f，但文件被删除重建后会自动重新打开（日志轮转场景）"

[[options]]
flag = "-c"
name = "指定字节数"
example = "tail -c 1024 file.bin"
note = "显示文件最后 N 个字节"

[[options]]
flag = "--pid"
name = "跟踪进程"
example = "tail -f --pid=1234 app.log"
note = "当指定 PID 的进程终止后，自动停止 tail"

[[options]]
flag = "-q"
name = "静默模式"
example = "tail -q log1.txt log2.txt"
note = "读取多个文件时不显示文件名标题"

