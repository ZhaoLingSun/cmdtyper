[[gotchas]]
title = "tail -f 与日志轮转"
content = "当日志文件被 logrotate 轮转（重命名并创建新文件）时：\n  tail -f  — 会继续跟踪旧文件（已被重命名的那个），看不到新日志\n  tail -F  — 会检测到文件被替换，自动重新打开新文件\n\n在监控生产环境日志时，推荐使用 tail -F 而不是 tail -f。\ntail -F 等价于 tail --follow=name --retry。"

[[gotchas]]
title = "tail -n 的加号用法"
content = "tail -n 参数支持加号（+）前缀，表示从第 N 行开始显示到文件末尾：\n  tail -n 10 file.txt   — 显示最后 10 行\n  tail -n +10 file.txt  — 从第 10 行开始显示到末尾\n\n这在跳过文件头部（如 CSV 表头、配置文件注释）时很有用：\n  tail -n +2 data.csv   — 跳过第 1 行表头\n  tail -n +4 script.sh  — 跳过前 3 行注释"
