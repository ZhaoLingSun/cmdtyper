
[meta]
command = "apt-indexes-search"
full_name = "APT 索引刷新、搜索与版本核对"
category = "system"
difficulty = "basic"
importance = "core"

[overview]
summary = "先刷新索引，再从搜索、详情与版本来源逐层核对"
explanation = "APT 的查询结果来自本机保存的软件包索引，而不是每次搜索都实时浏览服务器。一次可靠的软件管理流程应先刷新索引，确认所有已配置软件源都成功响应，再进行搜索和版本判断。apt search 用名称与描述发现候选包，apt show 进一步查看依赖、下载大小和来源说明；apt list --upgradable 聚焦已安装软件的可升级版本，apt policy 则解释已安装版、候选版和仓库优先级之间的关系。dpkg -l 从更底层的本机数据库核对安装状态与架构，可用来区分“仓库里有这个包”和“机器上已经正确安装”。这些查询大多不需要管理员权限；把只读调查放在修改之前，既能减少包名选错，也能在升级或安装前留下清晰的版本依据。"

[syntax]
basic = "apt 或 dpkg 查询动作 [筛选条件或软件包名]"

[[syntax.parts]]
name = "查询工具"
desc = "apt 面向仓库索引和候选版本，dpkg 面向本机已登记的软件包状态"

[[syntax.parts]]
name = "查询动作"
desc = "update 刷新索引，search/show/list/policy 读取不同层次的信息，dpkg -l 查看本机状态"

[[syntax.parts]]
name = "筛选条件或软件包名"
desc = "使用准确包名可减少长列表；搜索阶段也可使用描述目标用途的关键词"

[[options]]
flag = "apt-get update"
name = "刷新全部软件源索引"
example = "sudo apt-get update"
note = "只有刷新动作需要写系统索引；任何一个来源失败都应先调查，不要假定结果完整"

[[options]]
flag = "apt search"
name = "按名称和描述搜索"
example = "apt search ripgrep"
note = "结果是候选列表，安装前还要确认准确包名和发行版来源"

[[options]]
flag = "apt show"
name = "查看软件包元数据"
example = "apt show ripgrep"
note = "重点核对版本、架构、依赖、下载大小、安装后体积与软件源"

[[options]]
flag = "apt list --upgradable"
name = "列出可升级软件包"
example = "apt list --upgradable"
note = "只表示索引中存在更高候选版本，不等于此刻适合升级生产服务"

[[options]]
flag = "apt policy"
name = "解释候选版本选择"
example = "apt policy curl"
note = "适合排查为什么某个仓库版本被选中，以及已安装版与候选版是否一致"

[[options]]
flag = "dpkg -l"
name = "核对本机包状态"
example = "dpkg -l curl"
note = "状态前缀需要结合表头理解；ii 通常表示期望安装且当前已安装"

[[examples]]
id = "v03-21-apt-indexes-search-01"
command_id = "apt-update-fail-any-source"
level = 1
output_explanation = "Hit、Get 与最终索引读取状态共同反映各软件源刷新过程；出现失败来源时，应先处理网络、签名或源配置问题。"

[[examples]]
id = "v03-21-apt-indexes-search-02"
command_id = "apt-search-ripgrep"
level = 1
output_explanation = "搜索结果给出包名、仓库套件和简介，用于发现候选项，不应仅凭名称相似就进入安装。"

[[examples]]
id = "v03-21-apt-indexes-search-03"
command_id = "apt-show-ripgrep"
level = 2
output_explanation = "详情中的 Depends、Download-Size、Installed-Size 与 APT-Sources 是安装前评估依赖、空间和来源的关键字段。"

[[examples]]
id = "v03-21-apt-indexes-search-04"
command_id = "apt-list-upgradable"
level = 2
output_explanation = "每行同时呈现候选版本和当前版本，可用于形成升级清单，但服务影响仍需单独评估。"

[[examples]]
id = "v03-21-apt-indexes-search-05"
command_id = "apt-policy-curl"
level = 3
output_explanation = "Installed、Candidate 与 Version table 解释版本选择来源；星号标记本机当前安装的版本记录。"

[[examples]]
id = "v03-21-apt-indexes-search-06"
command_id = "dpkg-list-curl"
level = 3
output_explanation = "底层状态表确认包名、版本和架构；读状态码时必须参考输出顶部图例，不能只看包是否出现在列表中。"

[[gotchas]]
title = "索引刷新不完整时不要继续假装信息是最新的"
content = "update 可能部分成功、部分失败。此时搜索与候选版本会混合新旧索引，容易造成“包不存在”或版本判断错误。应逐项查看失败的软件源、DNS、网络、签名和发行版代号，修复后重新刷新；不要通过删除错误行、关闭签名校验或盲目更换镜像来掩盖原因。"

[[gotchas]]
title = "搜索到名称不等于找对了包"
content = "相似名称、第三方仓库和虚拟包都可能让搜索结果产生歧义。安装前用 show 核对描述、主页、来源、架构、依赖和体积，再用 policy 确认候选版本来自预期仓库。查询阶段不需要 sudo 时就不要加 sudo，以减少误把只读调查变成修改操作的习惯。"

[[gotchas]]
title = "可升级清单不是自动变更窗口"
content = "apt list --upgradable 只回答“索引里有哪些候选更新”，不回答“业务现在能否承受升级”。涉及内核、数据库、Web 服务或远程连接组件时，还应评估重启需求、配置兼容、备份与回滚方案。先形成清单，再安排维护窗口，最后才进入升级确认。"
