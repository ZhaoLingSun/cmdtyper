[[examples]]
level = 4
summary = "分析日志中 POST 请求最多的 URL"
simulated_output = "    342 /api/login\n    218 /api/users\n    156 /api/orders\n     89 /api/upload\n     67 /api/comments\n     45 /api/search\n     34 /api/checkout\n     23 /api/register\n     12 /api/feedback\n      8 /api/logout"
output_explanation = "左侧数字表示每个 URL 的 POST 请求次数，结果已经按请求数量从高到低排序。"
deep_explanation = "### 真实场景：排查接口压力与热点路径\n你接到报警：API 网关 QPS 飙升，怀疑某些 `POST` 接口被频繁调用。最直接的方法就是从访问日志里统计“最热 POST URL Top10”。这条管道命令就是典型的一线排障写法：\n\n    cat access.log | grep \"POST\" | awk '{print $7}' | sort | uniq -c | sort -rn | head -10\n\n它把“原始日志 -> 过滤 -> 提取字段 -> 聚合计数 -> 排序截断”串成一条线。\n\n### 数据在管道中的流动（最关键）\n可以把每一段理解为一个加工站：\n- `cat access.log`：把整份日志逐行吐出。\n- `grep \"POST\"`：只保留包含 POST 的行。\n- `awk '{print $7}'`：取第 7 列（通常是 URL 路径）。\n- `sort`：先按字典序排序，把相同 URL 排到一起。\n- `uniq -c`：统计连续重复行，得到“次数 + URL”。\n- `sort -rn`：按数字逆序排序，最高频在最上面。\n- `head -10`：只看前 10 条。\n\n### 可视化理解：每一步输出长什么样\n假设原始日志其中几行是：\n\n    10.0.0.8 - - [14/Mar/2026:16:02:11 +0000] \"POST /api/login HTTP/1.1\" 200 531\n    10.0.0.9 - - [14/Mar/2026:16:02:13 +0000] \"GET /health HTTP/1.1\" 200 2\n    10.0.0.7 - - [14/Mar/2026:16:02:14 +0000] \"POST /api/orders HTTP/1.1\" 201 882\n\n经过 `grep \"POST\"` 后只剩 POST 行；\n经过 `awk '{print $7}'` 后变成：\n\n    /api/login\n    /api/orders\n    /api/login\n\n经过 `sort | uniq -c` 后会变成：\n\n      2 /api/login\n      1 /api/orders\n\n最后 `sort -rn | head -10` 给你最关心的热点排名。\n\n### 每段命令的角色定位\n- `grep`：业务筛选（方法、状态码、关键词都能筛）。\n- `awk`：结构化提取（按列拿你关心字段）。\n- `sort + uniq -c`：经典计数组合，几乎所有日志统计都会用到。\n- `head`：把结果压缩成可读摘要，适合值班快速决策。\n\n### 进阶建议\n- 若日志特别大，优先 `grep ... access.log`，避免无意义 `cat` 开销。\n- 如果日志格式不是“URL 在第 7 列”，要先用 `awk` 验证列号。\n- 可继续追加 `| cut -d'?' -f1` 去掉查询参数，避免同一路径被参数打散。\n\n> 提示：这个流水线背后是 Unix 哲学——每个工具只做一件事，但组合起来非常强。熟练后，你能在几十秒内从海量日志中提炼出可执行结论。"
id = "example-006"
command_id = "shared-2cb3d49b9b09141c"

[[examples.token_details]]
