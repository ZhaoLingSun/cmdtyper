explanation = "只显示前 10 个结果。"

[[gotchas]]
title = "大文件不要用 cat 查看"
content = "cat 会一次性把文件的全部内容输出到终端。如果文件有几千行甚至几百万行，终端会被大量文本刷屏，你几乎无法阅读。\n对于大文件，请使用：\n  less filename   - 可以前后翻页查看\n  head -20 filename - 只看前 20 行\n  tail -20 filename - 只看后 20 行\ncat 最适合用于查看短小的配置文件或者在管道中传递数据。"

[[gotchas]]
title = "二进制文件不要用 cat 查看"
content = "如果你不小心 cat 了一个二进制文件（如图片、可执行文件等），终端会显示大量乱码，甚至可能导致终端显示异常。如果遇到这种情况，可以输入 reset 命令来恢复终端。查看二进制文件应该使用 hexdump -C 或 xxd 等专用工具。使用 file 命令可以先判断文件类型：\n  file somefile\n  somefile: ELF 64-bit LSB executable, x86-64"
