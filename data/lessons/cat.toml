
[meta]
command = "cat"
full_name = "concatenate"
category = "file_ops"
difficulty = "beginner"
importance = "core"

[overview]
summary = "连接并显示文件内容"
explanation = "cat 是 Linux 中最常用的文件查看命令，名称来源于 concatenate（连接）。它的主要功能是将一个或多个文件的内容输出到标准输出（通常是终端屏幕）。除了查看文件内容，cat 还可以用来连接多个文件、创建新文件、追加内容到文件等。对于小文件，cat 非常方便；但对于大文件，建议使用 less 或 more 命令，因为 cat 会一次性输出所有内容，大量文本会瞬间刷过屏幕。cat 也是管道操作中常用的数据源命令。"

[syntax]
basic = "cat [选项]... [文件]..."

[[syntax.parts]]
name = "选项"
desc = "控制输出格式的标志，如 -n（显示行号）、-b（非空行编号）等"

[[syntax.parts]]
name = "文件"
desc = "要查看的一个或多个文件路径，省略时从标准输入读取"

[[options]]
flag = "-n"
name = "显示行号"
example = "cat -n script.sh"
note = "为所有输出行添加行号，包括空行"

[[options]]
flag = "-b"
name = "非空行编号"
example = "cat -b script.sh"
note = "只为非空行编号，空行不编号（会覆盖 -n 选项）"

[[options]]
flag = "-s"
name = "压缩空行"
example = "cat -s document.txt"
note = "将连续的多个空行压缩为一个空行"

[[options]]
flag = "-E"
name = "显示行尾标记"
example = "cat -E config.ini"
note = "在每行末尾显示 $ 符号，用于检查是否有行尾多余空格"

[[options]]
flag = "-A"
name = "显示所有不可见字符"
example = "cat -A config.ini"
note = "等价于 -vET，显示制表符（^I）、行尾（$）及其他不可见字符，调试文件格式问题时很有用"

[[examples]]
level = 1
summary = "查看主机名文件"
simulated_output = "ubuntu-server"
output_explanation = "输出展示了 cat 读取（或拼接）后的文件内容。cat 本身不做格式化，看到什么就原样输出什么，适合快速核对文件内容。"
