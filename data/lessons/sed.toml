[[examples]]
level = 3
summary = "替换数据库地址并自动备份原文件"
display = "sed -i.bak \\\n  's/localhost/db.production.internal/g' \\\n  config.yml"
simulated_output = ""
output_explanation = "该命令成功时通常不会在终端产生可见输出；没有报错并返回提示符一般就表示执行成功。建议随后用相关检查命令（如 `pwd`、`ls`、`stat`）确认结果。 另外，原地编辑配置文件存在风险，建议先 `cp file file.bak` 备份。"
deep_explanation = "### sed 是什么：流式编辑器，不是交互编辑器\n`sed` 的全名是 stream editor（流编辑器）。它会按“行”读取输入，应用编辑脚本，再输出结果。重点是：\n- 默认不会改原文件，只把处理后的文本打印到标准输出；\n- 只有加 `-i` 才会原地写回文件。\n\n所以最常见学习路径是：先不带 `-i` 预览，确认正确后再原地修改。\n\n### `s/pattern/replacement/g` 语法拆解\n最常用的 sed 命令就是替换：\n\n    s/old/new/g\n\n含义是：\n- `s`：substitute，执行替换。\n- `pattern`：要匹配的模式（可用正则）。\n- `replacement`：替换成什么文本。\n- `g`：global，每行内“全部匹配都替换”；不加 `g` 时只替换每行第一个匹配。\n\n举个直观例子：\n\n    echo \"old old old\" | sed 's/old/new/'\n\n输出是：`new old old`（只替了第一个）\n\n    echo \"old old old\" | sed 's/old/new/g'\n\n输出是：`new new new`（这一行全替换）\n\n### `-i` 原地编辑到底做了什么\n你在示例里用的是：\n\n    sed -i.bak 's/localhost/db.production.internal/g' config.yml\n\n它会：\n- 读取 `config.yml`；\n- 将每行中的 `localhost` 替换为 `db.production.internal`；\n- 把结果写回原文件；\n- 同时保留备份 `config.yml.bak`。\n\n这比裸 `-i` 更稳妥，因为你随时能回滚。\n\n### 为什么总强调“先备份再改”\n`sed -i` 是高效率工具，也是高风险工具。常见翻车场景：\n- 模式写太宽，误改大量无关内容；\n- 路径写错，改到了不该改的文件；\n- 正则转义错误，替换结果异常。\n\n推荐流程：\n- 第一步（预览）\n\n    sed 's/old/new/g' file\n\n- 第二步（带备份原地修改）\n\n    sed -i.bak 's/old/new/g' file\n\n- 第三步（校验）\n\n    grep -n 'new' file\n\n确认无误后再删除 `.bak`。\n\n### 实战细节\n- 分隔符不一定非要 `/`。如果字符串里本身有很多 `/`，可改成 `#`：\n\n    sed 's#/var/www#/srv/www#g' file\n\n这样可读性更高、转义更少。\n- 配置文件批量替换后，记得执行语法检查或服务 reload 前检查。\n\n> 提示：真正专业的 sed 使用习惯，不是“会写命令”，而是“先可视化预览，再可回滚地修改”。这能把文本批处理的效率和安全性同时拉起来。"
id = "example-005"
command_id = "shared-97c4fd08bb65cebc"

