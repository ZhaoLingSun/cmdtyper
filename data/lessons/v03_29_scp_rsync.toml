[[gotchas]]
title = "scp 不会安全地询问是否覆盖"
content = "上传时目标端同名文件可能被替换，下载到当前目录时本地同名文件也可能被替换。目录递归复制还可能把两棵树合并。应在目标端独立检查名称、路径和备份，而不是把没有提示误认为没有冲突。"

[[gotchas]]
title = "源与目标写反会改变数据流向"
content = "scp 两侧语法相似，远端标记只靠 用户@主机:。输入前明确说出“从哪里到哪里”，并核对远端路径是否为目录。主机指纹尚未独立核验时，不进行传输。"

[[gotchas]]
title = "rsync 的末尾斜杠有结构含义"
content = "photos/ 表示把 photos 的内容放入目标目录；photos 通常表示连同 photos 目录节点一起复制。错误的斜杠可能产生额外嵌套层级，后续再配合 --delete 会放大影响范围。"

[[gotchas]]
title = "--delete 永远停留在 dry-run"
content = "示例中的 n 必须保留。预演输出出现 deleting 只表示删除计划，没有实际删除；逐项确认源目录、目标主机、目标路径、斜杠和清单后，也仍需在真实环境走单独审批与备份流程。本课不教授去掉 n 的执行版本。"

[[gotchas]]
title = "压缩选项不等于总会更快"
content = "JPEG、PNG、压缩包等数据已经压缩，再启用传输压缩可能增加 CPU 而收益很小。先识别数据类型和链路瓶颈；-a 的归档语义、-v 的详细输出与压缩是不同维度。"
