
[meta]
command = "ping"
full_name = "Packet InterNet Groper"
category = "network"
difficulty = "beginner"
importance = "core"

[overview]
summary = "测试网络连通性和延迟"
explanation = "ping 是最基本的网络诊断工具，通过发送 ICMP Echo Request 包并等待回复来测试与目标主机之间的网络连通性。它可以帮助你判断：目标主机是否可达、网络延迟有多大、是否存在丢包等。ping 是网络故障排查的第一步——当你发现无法访问某个服务时，先 ping 一下看看网络层是否正常。注意：在 Linux 上 ping 默认会持续发送直到手动 Ctrl+C 中断，与 Windows 上默认发 4 个包不同。"

[syntax]
basic = "ping [选项] 目标主机"

[[syntax.parts]]
name = "目标主机"
desc = "IP 地址或域名"

[[options]]
flag = "-c"
name = "发送次数"
example = "ping -c 4 8.8.8.8"
note = "指定发送 ICMP 包的数量，发完即停"

[[options]]
flag = "-i"
name = "发送间隔"
example = "ping -i 0.5 192.168.1.1"
note = "设置每次发包的间隔秒数（默认 1 秒，root 可设小于 0.2）"

[[options]]
flag = "-s"
name = "包大小"
example = "ping -s 1400 192.168.1.1"
note = "设置 ICMP 数据部分的字节数（默认 56 字节）"

[[options]]
flag = "-W"
name = "超时时间"
example = "ping -W 2 10.0.0.1"
note = "设置等待响应的超时秒数"

[[options]]
flag = "-q"
name = "静默输出"
example = "ping -qc 10 google.com"
note = "只显示最终的统计摘要，不显示每个包的详情"

[[options]]
flag = "-4/-6"
name = "指定协议版本"
example = "ping -4 google.com"
note = "强制使用 IPv4 或 IPv6"

[[examples]]
level = 1
summary = "向 Google DNS 发送 4 个 ICMP 包测试外网连通性"
simulated_output = "PING 8.8.8.8 (8.8.8.8) 56(84) bytes of data.\n64 bytes from 8.8.8.8: icmp_seq=1 ttl=117 time=12.3 ms\n64 bytes from 8.8.8.8: icmp_seq=2 ttl=117 time=11.8 ms\n64 bytes from 8.8.8.8: icmp_seq=3 ttl=117 time=12.1 ms\n64 bytes from 8.8.8.8: icmp_seq=4 ttl=117 time=11.9 ms\n\n--- 8.8.8.8 ping statistics ---\n4 packets transmitted, 4 received, 0% packet loss, time 3005ms\nrtt min/avg/max/mdev = 11.802/12.025/12.301/0.185 ms"
output_explanation = "输出展示了 ICMP 连通性测试结果。重点关注丢包率和 RTT（min/avg/max）；丢包高或延迟抖动大通常说明链路不稳定。"
id = "example-001"
command_id = "ping-count-four"

