[[gotchas]]
title = "ping 不通不一定是网络有问题"
content = "ping 使用 ICMP 协议，有些情况下 ping 不通但网络实际是正常的：\n  1. 目标主机防火墙禁止了 ICMP（很多云服务器默认禁 ping）\n  2. 网络中的防火墙/路由器过滤了 ICMP 包\n  3. 某些 ISP 限制了 ICMP 流量\n\n排查方法：\n  ping 不通时，尝试用 curl 或 telnet 测试具体端口：\n  curl -v http://target:80     — 测试 HTTP 端口\n  curl -v telnet://target:22   — 测试 SSH 端口\n  如果端口可达说明网络没问题，只是 ICMP 被过滤了。"

[[gotchas]]
title = "Linux 与 Windows ping 的区别"
content = "Linux 和 Windows 的 ping 有几个重要区别：\n  Linux：默认持续发送直到 Ctrl+C，需要 -c 限制次数\n  Windows：默认发送 4 个包后停止，用 -t 持续发送\n\n  Linux：ping -c 4 google.com\n  Windows：ping google.com（自动发 4 个）\n  Windows：ping -t google.com（持续发送）\n\n另外 Linux 上限制 ping 间隔小于 0.2 秒需要 root 权限，\n而 Windows 没有这个限制。"
