[[gotchas]]
title = "locale 不等于时区"
content = """把 LC_TIME 改成中文会改变星期和月份文字，但不会把 UTC+8 变成其他偏移；`date -u` 选择 UTC 显示，也不会把消息语言切成英文。诊断应分别记录有效 LC_TIME、时区和格式字符串。"""

[[gotchas]]
title = "时区缩写可能歧义"
content = """CST、IST 等缩写在不同地区可代表不同含义，夏令时也会改变缩写。`date +%Z` 适合快速观察，不适合当作唯一机器标识；跨系统记录应同时保留数值偏移或完整时区名称。"""

[[gotchas]]
title = "一个 sources.list 不是全部 APT 来源"
content = """现代 Debian/Ubuntu 可能主要使用 `/etc/apt/sources.list.d/*.sources`。`cat /etc/apt/sources.list` 或 grep 传统 deb 行都只能说明该文件内容；分片扩展名、Deb822 段落、Enabled 字段、架构和签名配置仍需另外核对。"""

[[gotchas]]
title = "列出配置文件不证明来源有效"
content = """`ls /etc/apt/sources.list.d` 只给候选文件名。被忽略的扩展名、注释、禁用段、语法错误或不匹配架构都可能使文件不生效。`apt-cache policy` 展示当前缓存理解的来源，但也不证明远端此刻可达或元数据最新。"""

[[gotchas]]
title = "只读查询也要准确描述副作用边界"
content = """date、cal、cat、grep、ls 不修改目标配置；读取通常仍可能更新文件访问时间，取决于挂载策略。`apt-cache policy` 不改软件源和安装状态，但可能按实现与权限生成缓存。教学中应说“无配置/安装变更”，不要绝对化为“磁盘上任何字节都不会变化”。"""
