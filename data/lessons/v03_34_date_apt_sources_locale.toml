[meta]
command = "date-apt-sources-locale"
full_name = "Locale-aware dates and read-only APT source inspection"
category = "system"
difficulty = "beginner"
importance = "common"

[overview]
summary = "区分 locale 与时区，并分层只读核对 APT 实际识别的软件源"
explanation = """`date` 同时受时钟、时区和 locale 影响，但三者职责不同：LC_TIME 决定星期、月份等文字与默认格式，系统时区决定本地时间偏移，`-u` 仅把显示切换到 UTC，`%F` 输出稳定的 YYYY-MM-DD，`%Z` 只给可能不唯一的时区缩写。`cal` 的月份和星期名称同样受 LC_TIME 影响，且命令可能来自额外软件包。APT 软件源也需要分层理解：传统 `/etc/apt/sources.list` 只是一个文件；`sources.list.d` 还可能包含 `.list` 和 Deb822 `.sources` 分片；文件存在不等于条目启用、语法有效或被当前 APT 接受。`grep` 示例只筛传统主文件中的 deb 行，不能代表全部来源。`apt-cache policy` 汇总 APT 当前识别的来源和优先级，不修改软件源配置或已安装包，但查询可能读取并按权限重新生成本地缓存，因此“只读配置”不等于绝对没有任何本地缓存副作用。本课不写源文件、不运行 update、不安装包。"""

[syntax]
basic = "date [+格式|-u]；cal；cat|grep|ls APT配置；apt-cache policy"
[[syntax.parts]]
name = "时间基准"
desc = "默认显示本地时区，-u 以 UTC 显示；两者读取同一当前时刻，不修改系统时钟"
[[syntax.parts]]
name = "格式与语言"
desc = "%A 和 cal 的名称受有效 LC_TIME 影响，%F 是固定数字日期；LANG 仅在未被覆盖时提供默认"
[[syntax.parts]]
name = "APT 配置层"
desc = "传统主文件、.list 分片与 Deb822 .sources 都可能参与，需逐层核对"
[[syntax.parts]]
name = "启用与识别"
desc = "列出文件名不证明启用；apt-cache policy 更接近 APT 当前识别结果与优先级"
[[syntax.parts]]
name = "查询副作用"
desc = "cat/grep/ls/date/cal 只读展示；apt-cache 查询不改源或软件包，但可能维护本地缓存元数据"

[[options]]
flag = "+%A"
name = "本地化星期名称"
example = "date +%A"
note = "由 LC_TIME 的有效值决定，不由 LC_MESSAGES 单独决定"

[[options]]
flag = "+%F"
name = "ISO 风格公历日期"
example = "date +%F"
note = "输出 YYYY-MM-DD，便于脚本和跨 locale 阅读；仍以当前选择的时区决定日期边界"

[[options]]
flag = "+%Z"
name = "时区缩写"
example = "date +%Z"
note = "缩写可能跨地区重复，不能替代 IANA 时区名称或数值偏移"

[[options]]
flag = "-u"
name = "以 UTC 显示"
example = "date -u"
note = "只改变本次显示所用时区，不设置系统时钟；文本格式仍受 locale 影响"

[[options]]
flag = "grep -E"
name = "筛传统 deb 行"
example = "grep -E '^[[:space:]]*deb[[:space:]]' /etc/apt/sources.list"
note = "只覆盖该文件的一行式二进制源，不包含 deb-src、分片目录或 Deb822 Enabled 语义"

[[options]]
flag = "apt-cache policy"
name = "查看已识别来源和优先级"
example = "apt-cache policy"
note = "不更改配置和安装状态；可能读取或重建本地缓存，输出也可能落后于未执行 update 的远端状态"

[[examples]]
id = "v03-l34-date-current"
command_id = "date-current-local"
level = 1

[[examples]]
