
[meta]
command = "fields-sort-unique"
full_name = "Delimited fields, sort keys, and adjacent uniqueness"
category = "text_process"
difficulty = "basic"
importance = "core"

[overview]
summary = "先定义记录、字段和分隔符，再选择与数据类型一致的排序语义"
explanation = "文本工具把输入看成一行一条记录，但“字段”并不是天然存在：`cut -d: -f1` 明确把冒号定义为单字符分隔符，而 `cut -d' ' -f1` 只适用于字段之间恰好一个空格的受控输入，连续空格会产生空字段。`sort` 默认比较整行文本，且排序规则受 LC_COLLATE 影响；`-n` 才按数值，`-h` 才理解 K/M/G 等易读单位，`-r` 只是反转既定比较结果。`-k2` 表示从第二字段起直到行末作为键，不等于只比较第二列；若要限制到单列，应理解 `-k2,2` 等键范围写法。`uniq` 只合并相邻重复行，因此通常要求输入已经按与“相等”定义一致的规则排序。本课所有示例都必须先说明记录边界、字段分隔符、排序键、比较类型和 locale，避免得到格式正确但语义错误的结果。"

[syntax]
basic = "cut -d分隔符 -f字段 输入；sort [比较选项] [-k键] 输入；uniq [-c] 输入"

[[syntax.parts]]
name = "记录"
desc = "这些工具默认一行一条记录；换行符决定记录边界，嵌入换行的数据需要更合适的解析器"

[[syntax.parts]]
name = "分隔符"
desc = "cut 的 -d 接受一个字符；冒号和单空格含义不同，连续空白也不同于 shell 的一般分词"

[[syntax.parts]]
name = "字段"
desc = "-f 从 1 开始编号；必须知道输入格式，不能凭视觉对齐猜列"

[[syntax.parts]]
name = "排序键"
desc = "无 -k 时比较整行；-k2 从第二字段到行末，键结束位置应按需求明确"

[[syntax.parts]]
name = "比较语义"
desc = "文本、数值和带单位数值是三种不同比较；locale 还会影响字符排序及字符类"

[[options]]
flag = "-d: -f1"
name = "冒号字段第一列"
example = "cut -d: -f1 /etc/group"
note = "分隔符是字面冒号，字段从 1 编号；不会理解 CSV 引号或转义"

[[options]]
flag = "-d' ' -f1"
name = "单空格字段第一列"
example = "cut -d' ' -f1 processes.txt"
note = "只适合已保证字段间恰好一个空格的输入，多空格会形成空字段"

[[options]]
flag = "-n"
name = "数值比较"
example = "sort -n response_times.txt"
note = "避免文本排序把 120 放在 2 前面；非数值内容的处理需结合具体 sort 实现"

[[options]]
flag = "-r"
name = "反转结果"
example = "sort -r regions.txt"
note = "反转当前比较规则，不会自动把文本改成数值或固定 ASCII 顺序"

[[options]]
flag = "-h"
name = "易读大小比较"
example = "sort -h artifact_sizes.txt"
note = "GNU 扩展，识别 K/M/G 等后缀；单位格式和可移植性应事先确认"

[[options]]
flag = "-k2"
name = "从第二字段起的键"
example = "sort -k2 team.txt"
note = "默认字段按空白划分，键延续到行末；仅第二字段通常写成更明确的范围"

[[examples]]
id = "v03-l33-field-group-names"
command_id = "text-cut-group-names"
level = 1

[[examples]]
id = "v03-l33-sort-numeric"
command_id = "text-sort-response-times-numeric"
level = 1

[[examples]]
id = "v03-l33-sort-reverse"
command_id = "text-sort-regions-reverse"
level = 1

[[examples]]
id = "v03-l33-sort-human"
command_id = "text-sort-artifact-sizes-human"
level = 2

[[examples]]
id = "v03-l33-sort-second-key"
command_id = "text-sort-team-second-field"
level = 2

[[examples]]
id = "v03-l33-field-single-space"
command_id = "text-cut-process-first-field"
level = 2

[[gotchas]]
title = "视觉上的列不一定是字段"
content = "表格可能用一个空格、多个空格、制表符或固定宽度对齐。`cut -d' '` 把每一个空格都当分隔符，连续空格会产生空字段；它不会像 awk 默认规则那样折叠空白。先查看格式规范，再选择 delimiter，而不是根据终端里“看起来像列”推测。"

[[gotchas]]
title = "-k2 不是仅第二列"
content = "GNU sort 的 `-k2` 从第二字段起一直取到行末，后续字段也参与比较。若业务语义是只看第二字段，应明确键结束位置，并说明字段分隔规则。相同键时是否需要稳定保持原顺序，也应在结果要求中写清楚。"

[[gotchas]]
title = "排序语义必须匹配数据类型"
content = "默认文本比较、`-n` 数值比较、`-h` 带单位比较会产生不同结果；`-r` 只反转它们。字符排序还受 LC_COLLATE 影响，需要跨机器可复现时可临时为单条查询使用 `LC_ALL=C`，但要知道这也会覆盖其他 locale 分类。"

[[gotchas]]
title = "uniq 只认识相邻重复"
content = "虽然本课示例把 uniq 的计数放在后续课程，概念必须先掌握：未排序输入中的相同值若不相邻，就会被当成多段。排序键与 uniq 的相等标准必须一致，否则统计仍可能分裂。"
