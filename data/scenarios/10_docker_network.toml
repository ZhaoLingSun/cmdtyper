id = "docker_network"
title = "Docker 服务名解析失败：检查网络归属"
category = "容器网络"
difficulty = "basic"
background = "Compose API 访问数据库 db:5432 失败。人工操作把 db 容器从项目网络断开；数据库数据卷未受影响。"
objective = "分辨主机端口和容器内部网络，检查服务名、容器归属，恢复同一网络。"
environment = "Ubuntu 24.04 LTS 教学主机 web-01（192.0.2.10），客户端 ops-01（192.0.2.50），网关 192.0.2.1。文档保留地址与 example.test 域名只用于模拟；每例独立还原起始状态，全部输出预置。"
recap = "用发起请求的容器作为观察点；服务健康、网络归属、名称解析和应用认证是不同检查项。通过 Compose 恢复声明，保留数据卷。"
sources = ["https://docs.docker.com/compose/how-tos/startup-order/", "https://docs.docker.com/compose/how-tos/production/"]

[[steps]]
title = "查看 Compose 服务"
output = "NAME          SERVICE STATUS\nops-api-1     api     Up\nops-db-1      db      Up (healthy)"
explanation = "两个容器都运行不保证互相可达。"
instruction = "请跟打，查看 Compose 服务。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_01"
command_id = "v04-compose_ops-24d0b47849"

[[steps]]
title = "查看 API 连接错误"
output = "could not translate host name \"db\" to address: Name or service not known"
explanation = "错误处在主机名解析阶段，不是数据库密码错误。"
instruction = "请跟打，查看 API 连接错误。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_02"
command_id = "shared-e044b7b247822339"

[[steps]]
title = "从 API 内查询数据库名称"
output = "socket.gaierror: [Errno -2] Name or service not known"
explanation = "在发起请求的容器中复现，避免把宿主机 DNS 测试当作容器结果。"
instruction = "请跟打，从 API 内查询数据库名称。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_03"
command_id = "shared-a0ed1b56375f124d"

[steps.decision]
question = "先检查哪个因素？"

[[steps.decision.choices]]
text = "两个服务是否连接同一个 Compose 网络"
correct = true
feedback = "对，服务发现依赖网络范围与别名。"

[[steps.decision.choices]]
text = "把数据库密码写入 /etc/hosts"
correct = false
feedback = "hosts 不保存密码，也不能替代数据库认证。"

[[steps]]
title = "检查数据库网络"
output = "{}"
explanation = "数据库容器当前没有连接网络；数据持久卷与网络是独立资源。"
instruction = "请跟打，检查数据库网络。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_04"
command_id = "shared-b6417f222a3d478f"

[[steps]]
title = "检查 API 网络"
output = "{\"ops_default\":{\"IPAddress\":\"172.20.0.3\"}}"
explanation = "API 连接 ops_default，数据库需要同网且有 db 别名。"
instruction = "请跟打，检查 API 网络。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_05"
command_id = "shared-1a07b233e9967fc8"

[[steps]]
title = "检查声明的 Compose 网络"
output = "db\napi\nnginx"
explanation = "本例服务配置使用默认网络；运行态遭到手工变更，重新创建 db 可以恢复声明。"
instruction = "请跟打，检查声明的 Compose 网络。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_06"
command_id = "v04-docker_net-b1196ab547"

[[steps]]
title = "核对数据库挂载"
output = "[{\"Type\":\"volume\",\"Name\":\"ops_pgdata\",\"Destination\":\"/var/lib/postgresql/data\"}]"
explanation = "PostgreSQL 17 数据位于命名卷，重新创建容器会继续挂载该卷。"
instruction = "请跟打，核对数据库挂载。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_07"
command_id = "shared-535edd5dd60a28d1"

[steps.decision]
question = "应如何恢复声明状态？"

[[steps.decision.choices]]
text = "仅重新创建 db 容器，保留命名数据卷"
correct = true
feedback = "对，网络修复不需要销毁数据库数据。"

[[steps.decision.choices]]
text = "执行 down -v 清空项目"
correct = false
feedback = "-v 会删除命名卷，超出网络修复需要并丢失数据。"

[[steps]]
title = "重新创建数据库容器"
output = "Container ops-db-1 Recreated\nContainer ops-db-1 Started"
explanation = "Compose 重新附加默认网络和 db 服务名；等待健康检查通过。"
instruction = "请跟打，重新创建数据库容器。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_08"
command_id = "shared-bb1f84786cca9ff7"

[[steps]]
title = "从 API 验证 TCP 连接"
output = "connected"
explanation = "容器内名称解析和 TCP 都成功；最终还要检查应用自己的数据库查询。"
instruction = "请跟打，从 API 验证 TCP 连接。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_09"
command_id = "shared-836d8fbe02ca912b"

[[steps]]
title = "验证应用健康"
output = "{\"status\":\"ok\",\"database\":\"ok\"}"
explanation = "本案例将 API 的 8000 绑定到宿主机回环以便诊断，数据库没有发布主机端口。"
instruction = "请跟打，验证应用健康。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_10"
command_id = "shared-e2281a98a4b26251"
