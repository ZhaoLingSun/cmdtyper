id = "website_bootstrap"
title = "Docker 网站从零搭建：数据库、API、HTTPS"
category = "网站完整流程"
difficulty = "basic"
background = "在一台干净的 Ubuntu 24.04 LTS amd64 主机部署小型订单网站，采用 Git、Docker Compose、FastAPI、PostgreSQL 17 和 Nginx。此教学站点只演示健康检查与只读订单查询。"
objective = "完成运行环境、代码、配置、持久数据、健康依赖、版本提交、HTTP 和 HTTPS 验证；建立可续期可回滚的部署基础。"
environment = "全新 Ubuntu 24.04 LTS amd64 主机，账户 ace 可 sudo，Git 作者信息已设定；无旧 Docker 冲突包。项目 /srv/ops-site；example.test、模拟 CA 与镜像输出均为课程预置。nano 步骤模拟保存展示的完整文件，不启动真实编辑器。"
recap = "每条 shell 命令独立回车；编辑器步骤展示完整文件与保存结果。代码和声明入 Git，口令证书不入库；先 HTTP 验证再启用 TLS，持久卷仍需备份。后续案例继续演练版本发布、数据库事务和恢复。"
sources = ["https://docs.docker.com/compose/how-tos/startup-order/", "https://docs.docker.com/compose/how-tos/production/", "https://docs.docker.com/engine/install/ubuntu/", "https://fastapi.tiangolo.com/deployment/docker/", "https://eff-certbot.readthedocs.io/en/stable/using.html", "https://github.com/systemd/systemd/blob/v255/man/systemd.timer.xml"]

