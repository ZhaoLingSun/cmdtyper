[[steps]]
title = "写入 Compose 服务声明"
output = "name: ops\nservices:\n  db:\n    image: postgres:17\n    environment:\n      POSTGRES_USER: app\n      POSTGRES_DB: app\n      POSTGRES_PASSWORD_FILE: /run/secrets/db_password\n    secrets: [db_password]\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro\n    healthcheck:\n      test: [CMD-SHELL, \"pg_isready -U app -d app\"]\n      interval: 5s\n      timeout: 3s\n      retries: 10\n    restart: unless-stopped\n  api:\n    build: .\n    image: ops-api:${APP_VERSION:-v1.0.0}\n    secrets: [db_password]\n    depends_on:\n      db:\n        condition: service_healthy\n    ports: [\"127.0.0.1:8000:8000\"]\n    healthcheck:\n      test: [CMD, python, -c, \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\"]\n      interval: 10s\n      timeout: 3s\n      retries: 5\n    restart: unless-stopped\n  nginx:\n    image: nginx:stable\n    ports: [\"80:80\", \"443:443\"]\n    volumes:\n      - ./nginx:/etc/nginx/conf.d:ro\n      - ./certbot/www:/var/www/certbot:ro\n      - ./certbot/conf:/etc/letsencrypt:ro\n    depends_on:\n      api:\n        condition: service_healthy\n    restart: unless-stopped\nsecrets:\n  db_password:\n    file: ./.db_password\nvolumes:\n  pgdata: {}\n"
explanation = "数据库不发布宿主机端口；API 诊断端口仅绑定回环；Nginx 提供外部入口。pgdata 持久化数据，healthcheck 与 service_healthy 控制初次就绪依赖。"
