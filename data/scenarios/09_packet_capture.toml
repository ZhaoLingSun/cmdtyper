id = "packet_capture"
title = "抓包还原 TCP 连接故障"
category = "网络"
difficulty = "basic"
background = "客户端请求 web-01:443 超时。预置客户端与服务器两份抓包显示 SYN 到达服务端、SYN-ACK 未返回客户端，待修正客户端回程路由。"
objective = "学习限制范围抓包、读 TCP 标志、比较两端观测点，定位非对称回程。"
environment = "Ubuntu 24.04 LTS 教学主机 web-01（192.0.2.10），客户端 ops-01（192.0.2.50），网关 192.0.2.1。文档保留地址与 example.test 域名只用于模拟；每例独立还原起始状态，全部输出预置。"
recap = "S 表示 SYN，S. 表示 SYN-ACK；两端同时间窗口的抓包加 route get 才能定位回程问题。抓包本身不会自动说明根因。"
sources = ["https://man7.org/linux/man-pages/man8/ss.8.html", "https://man7.org/linux/man-pages/man8/tcpdump.8.html"]

[[steps]]
title = "确认目标路由"
output = "192.0.2.10 dev ens3 src 192.0.2.50"
explanation = "先确定客户端抓包接口和来源地址。"
instruction = "请跟打，确认目标路由。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_01"
command_id = "shared-cb501023ee08b8b6"

[[steps]]
title = "从客户端保存有限包数"
output = "6 packets captured"
explanation = "只抓目标主机与端口并限制包数；另一个模拟终端同时发起连接。"
instruction = "请跟打，从客户端保存有限包数。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_02"
command_id = "shared-395a6acc80942e8e"

[[steps]]
title = "读取客户端抓包"
output = "192.0.2.50.51000 > 192.0.2.10.443: Flags [S]\n192.0.2.50.51000 > 192.0.2.10.443: Flags [S]"
explanation = "只看到重传 SYN，没有 SYN-ACK，客户端尚未建立 TCP 连接。"
instruction = "请跟打，读取客户端抓包。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_03"
command_id = "shared-4335d332af202d34"

[steps.decision]
question = "单凭这份抓包能确认服务进程停止吗？"

[[steps.decision.choices]]
text = "不能，还需服务端监听和抓包证据"
correct = true
feedback = "对，路径丢包与无监听都还需要区别。"

[[steps.decision.choices]]
text = "能，立刻重启 Web 进程"
correct = false
feedback = "只有客户端观察点无法确定丢包发生在哪里。"

[[steps]]
title = "服务端确认 443 监听"
output = "LISTEN 0 511 0.0.0.0:443 0.0.0.0:* users:((\"nginx\",pid=820,fd=5))"
explanation = "目标进程确实监听；接下来观察服务端是否收到 SYN。"
instruction = "请跟打，服务端确认 443 监听。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_04"
command_id = "v04-port_process-f04d731e74"

[[steps]]
title = "读取服务端同期抓包"
output = "192.0.2.50.51000 > 192.0.2.10.443: Flags [S]\n192.0.2.10.443 > 192.0.2.50.51000: Flags [S.]"
explanation = "服务端收到 SYN 并发出 SYN-ACK，客户端却没有看到对应返回包。"
instruction = "请跟打，读取服务端同期抓包。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_05"
command_id = "shared-5b839870df495e1e"

[[steps]]
title = "服务端检查返回路径"
output = "192.0.2.50 via 198.51.100.1 dev ens4 src 198.51.100.10"
explanation = "精确主机路由错误地覆盖了 ens3 上的直接连接网络。"
instruction = "请跟打，服务端检查返回路径。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_06"
command_id = "shared-bb355f33dd65afb3"

[steps.decision]
question = "故障点更接近哪里？"

[[steps.decision.choices]]
text = "客户端 HTTP 请求头"
correct = false
feedback = "HTTP 在 TCP 建连之后；现在还没有到请求头阶段。"

[[steps.decision.choices]]
text = "服务端回程选路，需核对覆盖路由"
correct = true
feedback = "对，TCP 握手还没完成，回程路由与观测结果吻合。"

[[steps]]
title = "查找覆盖路由"
output = "192.0.2.50 via 198.51.100.1 dev ens4"
explanation = "找到错误的 /32 主机路由；直接连接的 /24 路由仍在。"
instruction = "请跟打，查找覆盖路由。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_07"
command_id = "shared-0ebf849f0ea337b0"

[[steps]]
title = "删除已确认错误的精确路由"
output = "[模拟：错误路由已删除]"
explanation = "删除这条错误覆盖，让正常直连路由生效；同步更正生成路由的网络配置。"
instruction = "请跟打，删除已确认错误的精确路由。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_08"
command_id = "shared-7ece8a800cf44a58"

[[steps]]
title = "从客户端验证握手与应用"
output = "{\"status\":\"ok\"}"
explanation = "正常 TLS 和 HTTP 返回说明双向路径恢复。pcap 属于敏感运维资料，应按团队策略保管。"
instruction = "请跟打，从客户端验证握手与应用。先观察输出，再决定下一步。"
prompt = "$ "
id = "step_09"
command_id = "shared-6b655cac123a618d"
