[meta]
category = "text_process"
difficulty = "basic"
description = "文本处理工具箱"

[meta.topic]
id = "text_toolkit"
title = "文本处理工具箱"
icon = "🧰"
order = 14

[[commands]]
id = "text-cut-group-names"
command = "cut -d: -f1 /etc/group"
summary = "读取组数据库中冒号分隔的组名列"
simulated_output = """root
daemon
sudo
users
docker"""

[[commands.tokens]]
text = "cut"
desc = "按字节、字符或字段截取每一行"

[[commands.tokens]]
text = " -d:"
desc = "把冒号设为字段分隔符"

[[commands.tokens]]
text = " -f1"
desc = "只输出第 1 个字段"

[[commands.tokens]]
text = " /etc/group"
desc = "以系统组数据库作为输入文件"

[commands.dictation]
prompt = "从 /etc/group 中提取以冒号分隔的第一列组名"
answers = ["cut -d: -f1 /etc/group"]

[[commands]]
id = "text-sort-response-times-numeric"
command = "sort -n response_times.txt"
summary = "按数值而非字符顺序排列响应时间"
simulated_output = """2
9
15.5
120"""

[[commands.tokens]]
text = "sort"
desc = "逐行读取并排列文本"

[[commands.tokens]]
text = " -n"
desc = "按数值而不是按字符顺序比较"

[[commands.tokens]]
text = " response_times.txt"
desc = "每行保存一个响应时间的输入文件"

[commands.dictation]
prompt = "把 response_times.txt 中的响应时间按数值从小到大排列"
answers = ["sort -n response_times.txt"]

[[commands]]
id = "text-sort-regions-reverse"
command = "sort -r regions.txt"
summary = "按当前语言环境的规则降序排列文本"
simulated_output = """west
south
north
east"""

[[commands.tokens]]
text = "sort"
desc = "逐行读取并排列文本"

[[commands.tokens]]
text = " -r"
desc = "反转比较结果，改为降序输出"

[[commands.tokens]]
text = " regions.txt"
desc = "保存区域名称的输入文件"

[commands.dictation]
prompt = "将 regions.txt 的每行文本按当前语言环境的规则降序排列"
answers = ["sort -r regions.txt"]

[[commands]]
id = "text-sort-artifact-sizes-human"
command = "sort -h artifact_sizes.txt"
summary = "按 K、M、G 等易读大小值升序排列"
simulated_output = """900K
2M
12M
1G"""

[[commands.tokens]]
text = "sort"
desc = "逐行读取并排列文本"

[[commands.tokens]]
text = " -h"
desc = "GNU 扩展：识别 K、M、G 等易读大小后按数值比较"

[[commands.tokens]]
text = " artifact_sizes.txt"
desc = "每行保存一个带单位大小值的输入文件"

[commands.dictation]
prompt = "把 artifact_sizes.txt 中带 K、M、G 单位的大小值从小到大排列"
answers = ["sort -h artifact_sizes.txt"]

[[commands]]
id = "text-sort-team-second-field"
command = "sort -k2 team.txt"
summary = "从第二字段起选取排序键排列人员"
simulated_output = """li Backend
wang Frontend
chen Operations"""

[[commands.tokens]]
text = "sort"
desc = "逐行读取并排列文本"

[[commands.tokens]]
text = " -k2"
desc = "把第 2 个字段起直到行末作为排序键"

[[commands.tokens]]
text = " team.txt"
desc = "包含姓名和团队字段的输入文件"

[commands.dictation]
prompt = "以 team.txt 每行第二个字段起的内容作为键升序排列"
answers = ["sort -k2 team.txt"]

[[commands]]
id = "text-uniq-count-status-runs"
command = "uniq -c status_runs.txt"
summary = "统计每一段连续重复状态出现了几次"
simulated_output = """      3 failed
      2 pending
      5 running"""

[[commands.tokens]]
text = "uniq"
desc = "合并相邻的重复行"

[[commands.tokens]]
text = " -c"
desc = "在每组输出前显示该相邻重复行的次数"

[[commands.tokens]]
text = " status_runs.txt"
desc = "相同状态已经相邻排列的输入文件"

[commands.dictation]
prompt = "status_runs.txt 中相同状态已经排在一起；合并相邻重复行并显示每段次数"
answers = ["uniq -c status_runs.txt"]

[[commands]]
id = "text-pipeline-endpoint-frequency"
command = "sort endpoints.txt | uniq -c | sort -nr"
summary = "统计各接口出现次数并按频次降序"
simulated_output = """     18 /health
      9 /api/orders
      4 /api/users"""

[[commands.tokens]]
text = "sort"
desc = "先让相同接口路径相邻"

[[commands.tokens]]
text = " endpoints.txt"
desc = "每行保存一个接口路径的输入文件"

[[commands.tokens]]
text = " |"
desc = "把排列后的文本交给下一步"

[[commands.tokens]]
text = " uniq"
desc = "合并相邻的重复接口路径"

[[commands.tokens]]
text = " -c"
desc = "给每个接口路径加上出现次数"

[[commands.tokens]]
text = " |"
desc = "把带计数的结果交给最后一步"

[[commands.tokens]]
text = " sort"
desc = "排列统计结果"

[[commands.tokens]]
text = " -nr"
desc = "按开头计数进行数值降序排列"

[commands.dictation]
prompt = "统计 endpoints.txt 中每种接口路径的次数，并按次数从高到低显示"
answers = ["sort endpoints.txt | uniq -c | sort -nr"]

[[commands]]
id = "text-tr-greeting-uppercase"
command = "tr '[:lower:]' '[:upper:]' < greeting.txt"
summary = "把输入中的小写字母转换为大写"
simulated_output = "HELLO, LINUX!"

[[commands.tokens]]
text = "tr"
desc = "转换或删除输入中的字符"

[[commands.tokens]]
text = " '[:lower:]'"
desc = "选择当前语言环境中的小写字符类"

[[commands.tokens]]
text = " '[:upper:]'"
desc = "把选中的字符映射为对应的大写字符"

[[commands.tokens]]
text = " < greeting.txt"
desc = "从 greeting.txt 重定向读取输入"

[commands.dictation]
prompt = "把 greeting.txt 中的小写英文字母转换为大写并输出"
answers = ["tr '[:lower:]' '[:upper:]' < greeting.txt"]

[[commands]]
id = "text-tr-delete-ticket-digits"
command = "tr -d '[:digit:]' < ticket.txt"
summary = "从文本中删除所有数字字符"
simulated_output = "INC: database unavailable"

[[commands.tokens]]
text = "tr"
desc = "转换或删除输入中的字符"

[[commands.tokens]]
text = " -d"
desc = "删除指定集合中的字符，不进行替换"

[[commands.tokens]]
text = " '[:digit:]'"
desc = "选择当前语言环境中的数字字符类"

[[commands.tokens]]
text = " < ticket.txt"
desc = "从 ticket.txt 重定向读取输入"

[commands.dictation]
prompt = "删除 ticket.txt 内容中的所有数字字符并输出结果"
answers = ["tr -d '[:digit:]' < ticket.txt"]

[[commands]]
id = "text-head-app-fifteen"
command = "head -n 15 app.log"
summary = "只读查看应用日志开头 15 行"
