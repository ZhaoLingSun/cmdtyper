[[commands]]
id = "text-diff-unified-settings"
command = "diff -u settings.old settings.new"
summary = "以统一补丁格式比较两版配置"
simulated_output = """--- settings.old	2026-07-26 09:10:00.000000000 -0700
+++ settings.new	2026-07-26 09:12:00.000000000 -0700
@@ -1,3 +1,3 @@
 port=8080
-debug=true
+debug=false
 workers=4"""

[[commands.tokens]]
text = "diff"
desc = "逐行比较两个文件的内容"

[[commands.tokens]]
text = " -u"
desc = "使用带上下文的统一差异格式，便于阅读或生成补丁"

[[commands.tokens]]
text = " settings.old"
desc = "比较前的旧版配置"

[[commands.tokens]]
text = " settings.new"
desc = "比较后的新版配置"

[commands.dictation]
prompt = "以统一补丁格式比较 settings.old 与 settings.new 的差异"
answers = ["diff -u settings.old settings.new"]

[[commands]]
