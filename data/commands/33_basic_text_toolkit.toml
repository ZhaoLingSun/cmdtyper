[[commands.tokens]]
text = " -t"
desc = "识别输入字段数量并按表格模式对齐各列"

[[commands.tokens]]
text = " inventory.txt"
desc = "包含空白分隔库存字段的输入文件"

[commands.dictation]
prompt = "把 inventory.txt 中以空白分隔的字段对齐成表格"
