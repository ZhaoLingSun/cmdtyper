[[commands]]
id = "text-tail-follow-app-twenty"
command = "tail -n 20 -f app.log"
summary = "先显示应用日志末尾 20 行，再持续观察新增内容"
simulated_output = """2026-07-25 18:53:02 INFO request id=a17 status=200
2026-07-25 18:53:07 WARN retry id=a18 attempt=1
2026-07-25 18:53:13 INFO request id=a18 status=200"""

[[commands.tokens]]
text = "tail"
desc = "显示文件末尾部分"

[[commands.tokens]]
text = " -n 20"
desc = "开始跟踪前先显示末尾 20 行"

[[commands.tokens]]
text = " -f"
desc = "到达文件末尾后继续等待并输出新追加的内容"

[[commands.tokens]]
text = " app.log"
