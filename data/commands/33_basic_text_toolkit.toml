[[commands.tokens]]
text = " -n"
desc = "按指定行数限制输出"

[[commands.tokens]]
text = " 15"
desc = "最多显示开头 15 行"

[[commands.tokens]]
text = " app.log"
desc = "要快速检查开头内容的应用日志"

[commands.dictation]
prompt = "不修改文件，只读显示 app.log 开头最多 15 行"
answers = ["head -n 15 app.log"]

[[commands]]
