[[commands]]
id = "text-wc-settings-lines"
command = "wc -l settings.ini"
summary = "只读统计配置文件的行数"
simulated_output = "12 settings.ini"

[[commands.tokens]]
text = "wc"
desc = "统计输入的行、单词或字节数量，本题只读取文件"

[[commands.tokens]]
text = " -l"
desc = "只统计换行符数量，并与文件名一起输出"

[[commands.tokens]]
text = " settings.ini"
desc = "要只读统计的练习配置文件"

[commands.dictation]
prompt = "不修改 settings.ini，只显示它的行数和文件名"
answers = ["wc -l settings.ini"]

[[commands]]
id = "text-cut-process-first-field"
command = "cut -d' ' -f1 processes.txt"
summary = "提取单个空格分隔的进程表第一列"
simulated_output = """PID
1024
1187
2046"""

[[commands.tokens]]
text = "cut"
desc = "按分隔符提取文本字段"

[[commands.tokens]]
text = " -d' '"
desc = "明确使用一个空格作为字段分隔符；本题输入已保证字段间只有一个空格"

[[commands.tokens]]
text = " -f1"
desc = "只输出第 1 个字段"

[[commands.tokens]]
text = " processes.txt"
desc = "字段间使用单个空格的练习进程表"

[commands.dictation]
prompt = "processes.txt 的字段间恰好是一个空格；提取并输出第一列"
answers = ["cut -d' ' -f1 processes.txt"]

[[commands]]
