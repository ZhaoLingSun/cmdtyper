[meta]
category = "scripting"
difficulty = "advanced"
description = "进阶补充：shell 语法、重定向、替换、条件执行与脚本片段"

[[commands]]
id = "redirect-stdout"
command = "echo hello > hello.txt"
summary = "把 hello 输出写入 hello.txt，覆盖原有内容"
simulated_output = ""

[[commands.tokens]]
text = "echo"
desc = "将文本输出到标准输出"

[[commands.tokens]]
text = " hello"
desc = "要输出的文本"

[[commands.tokens]]
text = " >"
desc = "把标准输出重定向到文件，并覆盖原内容"

[[commands.tokens]]
text = " hello.txt"
desc = "接收输出内容的文件"

[commands.dictation]
prompt = "把 hello 这段文本写入 hello.txt，并覆盖原内容"
answers = [
    "echo hello > hello.txt",
    "echo \"hello\" > hello.txt",
]

[[commands]]
id = "redirect-append"
command = "echo done >> build.log"
summary = "把 done 追加到 build.log 末尾"
simulated_output = ""

[[commands.tokens]]
text = "echo"
desc = "将文本输出到标准输出"

[[commands.tokens]]
text = " done"
desc = "要追加的文本"

[[commands.tokens]]
text = " >>"
desc = "把标准输出追加到文件末尾"

[[commands.tokens]]
text = " build.log"
desc = "接收追加内容的日志文件"

[commands.dictation]
prompt = "把 done 追加到 build.log 文件末尾"
answers = [
    "echo done >> build.log",
    "echo \"done\" >> build.log",
]

[[commands]]
id = "redirect-stderr"
command = "grep ERROR app.log 2> errors.log"
summary = "把 grep 的错误输出重定向到 errors.log"
simulated_output = ""

[[commands.tokens]]
text = "grep"
desc = "在文件或输入中搜索匹配指定模式的行"

[[commands.tokens]]
text = " ERROR"
desc = "要匹配的关键字"

[[commands.tokens]]
text = " app.log"
desc = "目标文件： app.log"

[[commands.tokens]]
text = " 2>"
desc = "把标准错误重定向到文件"

[[commands.tokens]]
text = " errors.log"
desc = "接收错误输出的文件"

[commands.dictation]
prompt = "把 grep 搜索 app.log 时产生的错误输出写到 errors.log"
answers = [
    "grep ERROR app.log 2> errors.log",
    "grep \"ERROR\" app.log 2> errors.log",
]

[[commands]]
id = "redirect-both"
command = "python3 app.py > app.log 2>&1"
summary = "把标准输出和标准错误都写入 app.log"
simulated_output = ""

[[commands.tokens]]
text = "python3"
desc = "Python 3 解释器"

[[commands.tokens]]
text = " app.py"
desc = "要运行的 Python 程序"

[[commands.tokens]]
text = " >"
desc = "先把标准输出重定向到文件"

[[commands.tokens]]
text = " app.log"
desc = "目标文件： app.log"

[[commands.tokens]]
text = " 2>&1"
desc = "再把标准错误重定向到标准输出的同一位置"

[commands.dictation]
prompt = "运行 python3 app.py，并把标准输出和标准错误都写入 app.log"
answers = [
    "python3 app.py > app.log 2>&1",
]

[[commands]]
id = "tee-build-log"
command = "make 2>&1 | tee build.log"
summary = "把构建输出同时显示在终端并写入 build.log"
simulated_output = """
cc -O2 -c main.c
cc -O2 -c util.c
cc -O2 -o app main.o util.o
Build complete
"""

[[commands.tokens]]
text = "make"
desc = "执行构建任务的命令"

[[commands.tokens]]
text = " 2>&1"
desc = "把标准错误并入标准输出"

[[commands.tokens]]
text = " |"
desc = "把输出传给 tee"

[[commands.tokens]]
text = " tee"
desc = "把输入同时输出到终端和文件"

[[commands.tokens]]
text = " build.log"
desc = "保存构建日志的文件"

[commands.dictation]
prompt = "运行 make，并把输出一边显示在终端一边写入 build.log"
answers = [
    "make 2>&1 | tee build.log",
]

[[commands]]
id = "command-substitution-date"
command = "echo \"$(date +%F)\""
summary = "使用命令替换输出当前日期，格式为年-月-日"
simulated_output = "2026-03-08"

[[commands.tokens]]
text = "echo"
desc = "将文本输出到标准输出"

[[commands.tokens]]
text = " \"$(date +%F)\""
desc = "先执行 date +%F，再把结果作为一个带引号的参数传给 echo"

[commands.dictation]
prompt = "使用带双引号的命令替换输出当前日期，格式为年-月-日"
answers = [
    "echo \"$(date +%F)\"",
    "printf '%s\\n' \"$(date +%F)\"",
]

[[commands]]
id = "if-file-exists"
command = "test -f .env && echo exists"
summary = "如果 .env 文件存在，就输出 exists"
simulated_output = "exists"

[[commands.tokens]]
text = "test"
desc = "测试条件是否成立的命令"

[[commands.tokens]]
text = " -f"
desc = "判断路径是否为普通文件"

[[commands.tokens]]
text = " .env"
desc = "要检查是否存在的文件"

[[commands.tokens]]
text = " &&"
desc = "前一个命令成功时才执行后一个命令"

[[commands.tokens]]
text = " echo"
desc = "输出文本的命令"

[[commands.tokens]]
text = " exists"
desc = "条件成立时输出的文本"

[commands.dictation]
prompt = "如果 .env 是普通文件，就输出 exists"
answers = [
    "test -f .env && echo exists",
    "test -f .env && echo \"exists\"",
]

[[commands]]
id = "or-install-curl"
command = "command -v curl >/dev/null || sudo apt install curl"
summary = "如果系统里没有 curl，就让 apt 显示安装计划并等待人工确认"
simulated_output = ""

[[commands.tokens]]
text = "command"
desc = "shell 内建命令，可检查命令是否存在"

[[commands.tokens]]
text = " -v"
desc = "检查命令路径是否存在"

[[commands.tokens]]
text = " curl"
desc = "要检查的命令名"

[[commands.tokens]]
text = " >/dev/null"
desc = "丢弃找到命令时的路径输出，只使用退出状态判断是否存在"

[[commands.tokens]]
text = " ||"
desc = "前一个检查失败时才进入右侧安装流程"

[[commands.tokens]]
text = " sudo"
desc = "仅为经过审核的软件包安装请求管理员权限"

[[commands.tokens]]
text = " apt"
desc = "Debian/Ubuntu 包管理命令"

[[commands.tokens]]
text = " install"
desc = "计算安装计划并在变更前显示依赖、下载量和磁盘影响"

[[commands.tokens]]
text = " curl"
desc = "要安装的软件包名；未使用 -y，因此仍需人工审查并确认"

[commands.dictation]
prompt = "如果系统中没有 curl，就让 apt 显示 curl 的安装与依赖计划并等待人工确认；不要用 -y 跳过审查"
answers = [
    "command -v curl >/dev/null || sudo apt install curl",
]

[[commands]]
id = "for-loop-jpg"
command = "for f in *.jpg; do echo \"$f\"; done"
summary = "遍历当前目录下所有 jpg 文件并逐个输出文件名"
simulated_output = """
img001.jpg
img002.jpg
cover.jpg
"""

[[commands.tokens]]
text = "for"
desc = "shell 的循环关键字"

[[commands.tokens]]
text = " f"
desc = "循环变量名"

[[commands.tokens]]
text = " in"
desc = "指定循环遍历的数据集合"

[[commands.tokens]]
text = " *.jpg"
desc = "匹配当前目录下所有 jpg 文件"

[[commands.tokens]]
text = "; do"
desc = "循环体开始"

[[commands.tokens]]
text = " echo"
desc = "输出变量内容"

[[commands.tokens]]
text = " \"$f\""
desc = "展开并引用当前循环变量，保留文件名中的空格"

[[commands.tokens]]
text = ";"
desc = "命令分隔符"

[[commands.tokens]]
text = " done"
desc = "循环体结束"

[commands.dictation]
prompt = "遍历当前目录下所有 jpg 文件，并通过带双引号的 $f 逐个输出文件名"
answers = [
    "for f in *.jpg; do echo \"$f\"; done",
]

[[commands]]
id = "while-read-file"
command = "while IFS= read -r line || [ -n \"$line\" ]; do printf '%s\\n' \"$line\"; done < file.txt"
summary = "逐行读取 file.txt，保留空白、反斜杠以及没有结尾换行的最后一行"
simulated_output = """
  buy milk
path\\to\\file
final line
"""

[[commands.tokens]]
text = "while"
desc = "shell 的循环关键字"

[[commands.tokens]]
text = " IFS="
desc = "把本次 read 的字段分隔符设为空，保留行首和行尾空白"

[[commands.tokens]]
text = " read"
desc = "从标准输入读取一行文本"

[[commands.tokens]]
text = " -r"
desc = "不把反斜杠当作转义符，按原样读取"

[[commands.tokens]]
text = " line"
desc = "接收当前行内容的变量名"

[[commands.tokens]]
text = " ||"
desc = "read 因文件末尾无换行而返回失败时，继续检查是否仍读到了内容"

[[commands.tokens]]
text = " ["
desc = "开始最后一行内容检查"

[[commands.tokens]]
text = " -n"
desc = "判断字符串长度是否非零"

[[commands.tokens]]
text = " \"$line\""
desc = "引用当前行，保留空白并避免额外展开"

[[commands.tokens]]
text = " ]"
desc = "结束最后一行内容检查"

[[commands.tokens]]
text = ";"
desc = "结束 while 条件"

[[commands.tokens]]
text = " do"
desc = "循环体开始"

[[commands.tokens]]
text = " printf"
desc = "按明确格式输出文本，不依赖 echo 的实现差异"

[[commands.tokens]]
text = " '%s\\n'"
desc = "把每一行作为字符串输出并补一个换行"

[[commands.tokens]]
text = " \"$line\""
desc = "按原样传递当前行内容"

[[commands.tokens]]
text = ";"
desc = "结束本轮输出"

[[commands.tokens]]
text = " done"
desc = "循环体结束"

[[commands.tokens]]
text = " <"
desc = "把文件作为 while 循环的标准输入"

[[commands.tokens]]
text = " file.txt"
desc = "要逐行读取的输入文件"

[commands.dictation]
prompt = "逐行读取 file.txt：保留行首行尾空白和反斜杠，并且即使最后一行没有结尾换行也要输出"
answers = [
    "while IFS= read -r line || [ -n \"$line\" ]; do printf '%s\\n' \"$line\"; done < file.txt",
]

[[commands]]
id = "xargs-replace-hostname"
command = "cat hosts.txt | xargs -I{} ssh root@{} hostname"
summary = "读取 hosts.txt 中的主机列表，并逐台通过 SSH 执行 hostname"
simulated_output = """
web-01
db-01
cache-01
"""

[[commands.tokens]]
text = "cat"
desc = "连接并显示一个或多个文件的内容"

[[commands.tokens]]
text = " hosts.txt"
desc = "保存主机列表的文件"

[[commands.tokens]]
text = " |"
desc = "把文件内容传给 xargs"

[[commands.tokens]]
text = " xargs"
desc = "把标准输入转换成命令参数列表"

[[commands.tokens]]
text = " -I{}"
desc = "把每个输入项替换到 {} 占位符位置"

[[commands.tokens]]
text = " ssh"
desc = "远程登录命令"

[[commands.tokens]]
text = " root@{}"
desc = "把当前主机替换到 SSH 登录目标中"

[[commands.tokens]]
text = " hostname"
desc = "在远程主机上执行的命令"

[commands.dictation]
prompt = "读取 hosts.txt 中的主机列表，并逐台 SSH 执行 hostname"
answers = [
    "cat hosts.txt | xargs -I{} ssh root@{} hostname",
]

[[commands]]
id = "find-exec-rm"
command = "find . -type f -name '*.tmp' -ok rm -- {} \\;"
summary = "查找 .tmp 普通文件，并在逐个显示路径、获得确认后才删除"
simulated_output = "< rm ... ./cache/build.tmp > ? n"

[[commands.tokens]]
text = "find"
desc = "在目录树中递归查找文件和目录"

[[commands.tokens]]
text = " ."
desc = "从当前目录开始查找"

[[commands.tokens]]
text = " -type"
desc = "按文件类型筛选"

[[commands.tokens]]
text = " f"
desc = "只匹配普通文件，排除同名目录等其他对象"

[[commands.tokens]]
text = " -name"
desc = "按文件名模式匹配"

[[commands.tokens]]
text = " '*.tmp'"
desc = "用引号保护模式，避免 shell 在 find 运行前先展开"

[[commands.tokens]]
text = " -ok"
desc = "对每个候选显示将运行的命令并等待人工确认，不做无提示批量删除"

[[commands.tokens]]
text = " rm"
desc = "仅在当前候选获得确认后删除文件"

[[commands.tokens]]
text = " --"
desc = "结束 rm 的选项解析，保护以连字符开头的路径"

[[commands.tokens]]
text = " {}"
desc = "代表当前 find 匹配到的单个文件路径"

[[commands.tokens]]
text = " \\;"
desc = "结束 -ok 动作；每个候选单独询问，而不是批量自动执行"

[commands.dictation]
prompt = "查找当前目录下的 .tmp 普通文件，用引号保护模式，并让 find 在逐个显示路径、等待确认后才调用 rm"
answers = [
    "find . -type f -name '*.tmp' -ok rm -- {} \\;",
    "find . -type f -name \"*.tmp\" -ok rm -- {} \\;",
]

[[commands]]
id = "source-bashrc"
command = "source ~/.bashrc"
summary = "重新加载当前用户的 bash 配置文件"
simulated_output = ""

[[commands.tokens]]
text = "source"
desc = "在当前 shell 中执行脚本文件内容的命令"

[[commands.tokens]]
text = " ~/.bashrc"
desc = "当前用户的 Bash 配置文件"

[commands.dictation]
prompt = "重新加载当前用户的 ~/.bashrc 配置"
answers = [
    "source ~/.bashrc",
    ". ~/.bashrc",
]

[[commands]]
id = "here-doc-cat"
command = "printf 'first line\\nsecond line\\n' > note.txt"
summary = "用一条完整的非交互命令把两行文本写入 note.txt"
simulated_output = ""

[[commands.tokens]]
text = "printf"
desc = "按明确格式输出文本；整条命令语法完整，不依赖后续交互输入或未闭合的 here document"

[[commands.tokens]]
text = " 'first line\\nsecond line\\n'"
desc = "单引号中的格式字符串包含两行文本及各自的换行符"

[[commands.tokens]]
text = " >"
desc = "把标准输出重定向到文件，并覆盖原内容"

[[commands.tokens]]
text = " note.txt"
desc = "接收两行文本的目标文件"

[commands.dictation]
prompt = "使用完整的 printf 命令把 first line 和 second line 两行写入 note.txt，并覆盖原内容"
answers = [
    "printf 'first line\\nsecond line\\n' > note.txt",
]
