[[commands]]
id = "dpkg-list-curl"
command = "dpkg -l curl"
summary = "查看 curl 的底层安装状态与架构"
simulated_output = """Desired=Unknown/Install/Remove/Purge/Hold
| Status=Not/Inst/Conf-files/Unpacked/halF-conf/Half-inst/trig-aWait/Trig-pend
|/ Err?=(none)/Reinst-required (Status,Err: uppercase=bad)
