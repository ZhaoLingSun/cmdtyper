[[commands.tokens]]
text = "dpkg"
desc = "直接查询 Debian 底层软件包数据库"

[[commands.tokens]]
text = " -l"
desc = "按名称模式列出软件包及其状态、版本和架构"

[[commands.tokens]]
text = " curl"
desc = "只查看 curl，避免列出整个包数据库"

[commands.dictation]
prompt = "用底层软件包数据库确认 curl 的安装状态、版本和架构"
answers = ["dpkg -l curl"]

[[commands]]
id = "dpkg-listfiles-curl"
command = "dpkg -L curl"
summary = "列出 curl 软件包安装的所有文件"
simulated_output = """/.
/usr
/usr/bin
/usr/bin/curl
/usr/share
/usr/share/doc
/usr/share/doc/curl
/usr/share/doc/curl/changelog.Debian.gz
/usr/share/doc/curl/copyright
/usr/share/man/man1/curl.1.gz
"""

[[commands.tokens]]
text = "dpkg"
desc = "读取本机已安装软件包的文件清单"

[[commands.tokens]]
text = " -L"
desc = "列出指定已安装软件包登记的全部路径"

[[commands.tokens]]
text = " curl"
desc = "要查询文件清单的软件包名"

[commands.dictation]
prompt = "列出 curl 软件包安装到系统中的全部文件和目录路径"
answers = ["dpkg -L curl"]

[[commands]]
id = "dpkg-install-local-gdebi"
command = "sudo apt install ./downloads/tool.deb"
summary = "用 APT 安装可信本地 deb，并一并解析依赖"
simulated_output = """Reading package lists... Done
Building dependency tree... Done
Reading state information... Done
Note, selecting 'tool' instead of './downloads/tool.deb'
The following NEW packages will be installed:
  tool
0 upgraded, 1 newly installed, 0 to remove and 5 not upgraded.
Do you want to continue? [Y/n] y
Setting up tool (1.0-1) ...
"""

[[commands.tokens]]
text = "sudo"
desc = "以管理员权限安装软件；执行前核对来源与变更清单"

[[commands.tokens]]
text = " apt"
desc = "使用高层包管理器处理本地 deb 及其依赖关系"

[[commands.tokens]]
text = " install"
desc = "安装指定软件包，并从已配置的软件源解析所需依赖"

[[commands.tokens]]
text = " ./downloads/tool.deb"
desc = "./ 表明这是本地文件；只安装已核验来源和校验值的 deb"

[commands.dictation]
prompt = "确认来源可信后，用高层包管理器安装 downloads 中的 tool.deb，并让它同时处理依赖"
answers = ["sudo apt install ./downloads/tool.deb"]

[[commands]]
id = "dpkg-audit-packages"
command = "dpkg --audit"
summary = "只读检查是否有部分安装或状态异常的软件包"

[[commands.tokens]]
text = "dpkg"
desc = "检查 Debian 底层软件包数据库"

[[commands.tokens]]
text = " --audit"
desc = "查找部分安装、控制数据缺失或状态异常的软件包"

[commands.dictation]
prompt = "检查包数据库中是否存在仅部分安装、控制数据缺失或状态异常的软件包"
answers = ["dpkg --audit"]

[[commands]]
id = "apt-fix-broken-dependencies"
command = "sudo apt --fix-broken install"
summary = "仅在审计确认异常后，审查 APT 提出的依赖修复方案"
simulated_output = """Reading package lists... Done
Building dependency tree... Done
Reading state information... Done
Correcting dependencies... Done
The following additional packages will be installed:
  python3-chardet python3-debian zstd
0 upgraded, 3 newly installed, 0 to remove and 0 not upgraded.
1 not fully installed or removed.
Need to get 927 kB of archives.
Do you want to continue? [Y/n]
"""

[[commands.tokens]]
text = "sudo"
desc = "以管理员权限修复系统软件包状态"

[[commands.tokens]]
text = " apt"
desc = "利用软件源和依赖解析器寻找修复方案"

[[commands.tokens]]
text = " --fix-broken"
desc = "尝试修复未满足的依赖关系；它可能安装或移除包，不能盲目确认"

[[commands.tokens]]
text = " install"
desc = "不指定包名，让解析器补齐依赖并完成待配置软件包"

[commands.dictation]
prompt = "仅在 dpkg --audit 已确认包状态不完整时，让 APT 提出修复方案；执行确认前核对所有安装、移除与配置变化"
answers = ["sudo apt --fix-broken install"]

[[commands]]
id = "dpkg-lock-fuser-diagnose"
command = "sudo fuser -v /var/lib/dpkg/lock-frontend"
summary = "只诊断锁持有者；严禁删除软件包锁文件"
simulated_output = """                     USER        PID ACCESS COMMAND
/var/lib/dpkg/lock-frontend:
                     root       2468 F.... unattended-upgr
"""

[[commands.tokens]]
text = "sudo"
desc = "以管理员权限查看其他用户进程打开的文件"

[[commands.tokens]]
text = " fuser"
desc = "识别正在使用指定文件的进程，不会在此用法中结束进程"

[[commands.tokens]]
text = " -v"
desc = "详细显示用户、PID、访问方式和进程名"

[[commands.tokens]]
text = " /var/lib/dpkg/lock-frontend"
desc = "只检查前端锁；绝不要删除锁文件，应等待或正常结束持锁程序"

[commands.dictation]
prompt = "遇到无法获得软件包锁的报错时，只查看占用前端锁的进程，绝不删除锁文件"
answers = ["sudo fuser -v /var/lib/dpkg/lock-frontend"]
