[[commands]]
id = "redirect-overwrite-config"
command = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && echo 'mode=production' > \"$practice_dir/app.conf\")"
summary = "在唯一私有练习目录中演示覆盖重定向"
simulated_output = ""

[[commands.tokens]]
text = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\""
desc = "在子 shell 中收紧创建权限，用 mktemp -d 原子建立当前用户拥有的唯一 0700 练习目录，并再次明确权限"

[[commands.tokens]]
text = " && echo 'mode=production' > \"$practice_dir/app.conf\""
desc = "在刚创建且不与其他练习共享的目录中准备夹具并完成本题动作"

[[commands.tokens]]
text = ")"
desc = "结束子 shell，避免 umask 和变量影响后续命令"
[commands.dictation]
prompt = "新建唯一 0700 练习目录，把 mode=production 覆盖写入其中的 app.conf"
answers = ["(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && echo 'mode=production' > \"$practice_dir/app.conf\")"]

