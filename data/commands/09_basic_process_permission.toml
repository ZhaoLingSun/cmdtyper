
[meta]
category = "process"
difficulty = "basic"
description = "基础补充：用户、权限、进程、作业控制与环境变量命令"

[[commands]]
id = "whoami-basic"
command = "whoami"
summary = "显示当前登录用户名"
simulated_output = "ace"

[[commands.tokens]]
text = "whoami"
desc = "显示当前有效用户名的命令"

[commands.dictation]
prompt = "显示当前登录的用户名"
answers = ["whoami"]

[[commands]]
id = "id-basic"
command = "id"
summary = "显示当前用户的 UID、GID 和用户组信息"
simulated_output = "uid=1000(ace) gid=1000(ace) groups=1000(ace),27(sudo),998(docker)"

[[commands.tokens]]
text = "id"
desc = "查看用户身份和所属组信息的命令"

[commands.dictation]
prompt = "显示当前用户的 UID、GID 和所属组信息"
answers = ["id"]

[[commands]]
id = "groups-basic"
command = "groups"
summary = "显示当前用户所属的所有用户组"
simulated_output = "ace sudo docker"

[[commands.tokens]]
text = "groups"
desc = "显示当前用户所属用户组的命令"

[commands.dictation]
prompt = "显示当前用户所属的所有用户组"
answers = ["groups"]

[[commands]]
id = "chmod-symbolic-user"
command = "chmod u+x deploy.sh"
summary = "给 deploy.sh 的所有者增加执行权限"
simulated_output = ""

[[commands.tokens]]
text = "chmod"
desc = "修改文件或目录的访问权限"

[[commands.tokens]]
text = " u+x"
desc = "给文件所有者增加执行权限"

[[commands.tokens]]
text = " deploy.sh"
desc = "要修改权限的脚本文件"

[commands.dictation]
prompt = "给 deploy.sh 的所有者增加执行权限"
answers = ["chmod u+x deploy.sh"]

[[commands]]
id = "chgrp-www-data"
command = "chgrp www-data /srv/www/index.html"
summary = "把 index.html 的所属组改为 www-data"
simulated_output = ""

[[commands.tokens]]
text = "chgrp"
desc = "修改文件所属组的命令"

[[commands.tokens]]
text = " www-data"
desc = "新的所属组"

[[commands.tokens]]
text = " /srv/www/index.html"
desc = "要修改所属组的文件"

[commands.dictation]
prompt = "把 /srv/www/index.html 的所属组改为 www-data"
answers = ["chgrp www-data /srv/www/index.html"]

[[commands]]
id = "umask-show"
command = "umask"
summary = "查看当前 shell 的默认权限掩码"
simulated_output = "0022"

[[commands.tokens]]
text = "umask"
desc = "查看或设置默认权限掩码的 shell 命令"

[commands.dictation]
prompt = "查看当前 shell 的默认权限掩码"
answers = ["umask"]

[[commands]]
id = "export-editor-vim"
command = "export EDITOR=vim"
summary = "把环境变量 EDITOR 设置为 vim"
simulated_output = ""

[[commands.tokens]]
text = "export"
desc = "导出环境变量到当前 shell 及其子进程"

[[commands.tokens]]
text = " EDITOR=vim"
desc = "把 EDITOR 环境变量设置为 vim"

[commands.dictation]
prompt = "把环境变量 EDITOR 设置为 vim"
answers = ["export EDITOR=vim"]

[[commands]]
id = "env-grep-path"
command = "env | grep ^PATH="
summary = "查看当前环境变量中的 PATH"
simulated_output = "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[[commands.tokens]]
text = "env"
desc = "输出当前环境变量的命令"

[[commands.tokens]]
text = " |"
desc = "把环境变量输出传给 grep 过滤"

[[commands.tokens]]
text = " grep"
desc = "按模式过滤文本行的命令"

[[commands.tokens]]
text = " ^PATH="
desc = "只匹配以 PATH= 开头的那一行"

[commands.dictation]
prompt = "查看当前环境变量中的 PATH 这一项"
answers = ["env | grep ^PATH=", "env | grep \"^PATH=\""]

[[commands]]
id = "ps-ef-basic"
command = "ps -ef"
summary = "以完整格式查看系统中的所有进程"
simulated_output = "UID          PID    PPID  C STIME TTY          TIME CMD\nroot           1       0  0 Mar13 ?        00:00:03 /sbin/init\nace         1482    1450  0 08:30 ?        00:00:00 sshd: ace@pts/1\nace         2561    1482  0 08:44 pts/1    00:00:00 bash\n"

[[commands.tokens]]
text = "ps"
desc = "显示当前运行的进程信息"

[[commands.tokens]]
text = " -ef"
desc = "显示所有进程并使用完整格式输出"

[commands.dictation]
prompt = "以完整格式查看系统中的所有进程"
answers = ["ps -ef"]

[[commands]]
id = "pgrep-sshd"
command = "pgrep sshd"
summary = "查找名为 sshd 的进程 PID"
simulated_output = "842\n1482\n"

[[commands.tokens]]
text = "pgrep"
desc = "按进程名查找 PID 的命令"

[[commands.tokens]]
text = " sshd"
desc = "要查找的进程名"

[commands.dictation]
prompt = "查找 sshd 进程的 PID"
answers = ["pgrep sshd"]

[[commands]]
id = "pkill-nginx"
command = "pkill -TERM -x -u \"$USER\" nginx"
summary = "在先审查清单后，只向当前用户拥有且进程名精确为 nginx 的目标发送 SIGTERM"
simulated_output = ""

[[commands.tokens]]
text = "pkill"
desc = "按条件向进程发送信号；执行前应先用对应的 pgrep -a 条件只读预览"

[[commands.tokens]]
text = " -TERM"
desc = "请求匹配进程正常退出，而不是立即强制终止"

[[commands.tokens]]
text = " -x"
desc = "要求进程名完整匹配，避免命中仅包含 nginx 的其他名称"

[[commands.tokens]]
text = " -u"
desc = "按有效用户限制匹配范围"

[[commands.tokens]]
text = " \"$USER\""
desc = "把范围限制为当前登录用户名；双引号保护变量展开"

[[commands.tokens]]
text = " nginx"
desc = "已通过相同 -x 与 -u 条件逐项核对的进程名"

[commands.dictation]
prompt = "已先用 pgrep -a -x -u \"$USER\" nginx 逐项核对目标；使用完全相同的精确名称和当前用户范围，只发送 SIGTERM"
answers = ["pkill -TERM -x -u \"$USER\" nginx"]

[[commands]]
id = "kill-sigkill"
command = "kill -TERM 12345"
summary = "在即时核对 PID 身份后，先向 12345 发送 SIGTERM"
simulated_output = ""

[[commands.tokens]]
text = "kill"
desc = "向指定 PID 发送信号；目标必须来自最新的只读进程清单"

[[commands.tokens]]
text = " -TERM"
desc = "请求进程正常退出并清理资源；只有 TERM 无效且再次核对后才评估 SIGKILL"

[[commands.tokens]]
text = " 12345"
desc = "教学用虚构 PID；真实 PID 可能复用，不能依赖旧记录"

[commands.dictation]
prompt = "已用最新进程信息确认 PID 12345 的所有者和完整命令行；先发送 SIGTERM 请求正常退出"
answers = ["kill -TERM 12345", "kill 12345"]

[[commands]]
id = "killall-node"
command = "killall -i -u \"$USER\" -s TERM node"
summary = "把范围限制为当前用户，并在向每个 node 进程发送 SIGTERM 前逐项确认"
simulated_output = "Kill node(31452) ? (y/N)"

[[commands.tokens]]
text = "killall"
desc = "按进程名向所有匹配项发送信号；批量范围必须先预览并限制"

[[commands.tokens]]
text = " -i"
desc = "在向每个匹配进程发送信号前交互确认"

[[commands.tokens]]
text = " -u"
desc = "按用户限制匹配范围"

[[commands.tokens]]
text = " \"$USER\""
desc = "只考虑当前用户名下的匹配进程"

[[commands.tokens]]
text = " -s"
desc = "显式指定要发送的信号"

[[commands.tokens]]
text = " TERM"
desc = "请求正常退出，不把 SIGKILL 作为默认动作"

[[commands.tokens]]
text = " node"
desc = "已通过只读清单逐项核对的进程名；同名进程仍可能有多个"

[commands.dictation]
prompt = "已先只读列出当前用户名下所有名为 node 的进程；用 killall 保留当前用户范围，并在逐项发送 SIGTERM 前询问确认"
answers = ["killall -i -u \"$USER\" -s TERM node"]

[[commands]]
id = "jobs-basic"
command = "jobs"
summary = "查看当前 shell 的后台作业列表"
simulated_output = "[1]-  Stopped                 tail -f app.log &\n[2]+  Stopped                 vim notes.txt"

[[commands.tokens]]
text = "jobs"
desc = "查看当前 shell 作业列表的命令"

[commands.dictation]
prompt = "查看当前 shell 的后台作业列表"
answers = ["jobs"]

[[commands]]
id = "bg-job-one"
command = "bg %1"
summary = "让编号为 1 的挂起作业转到后台继续运行"
simulated_output = "[1]+ tail -f app.log &"

[[commands.tokens]]
text = "bg"
desc = "让挂起作业在后台继续运行的 shell 命令"

[[commands.tokens]]
text = " %1"
desc = "作业号 1"

[commands.dictation]
prompt = "让作业号 1 在后台继续运行"
answers = ["bg %1"]

[[commands]]
id = "fg-job-one"
command = "fg %1"
summary = "把编号为 1 的后台作业切回前台"
simulated_output = "tail -f app.log"

[[commands.tokens]]
text = "fg"
desc = "把后台作业切回前台的 shell 命令"

[[commands.tokens]]
text = " %1"
desc = "作业号 1"

[commands.dictation]
prompt = "把作业号 1 切回前台运行"
answers = ["fg %1"]

[[commands]]
id = "nohup-python-server"
command = "nohup timeout 300s python3 -m http.server 8000 --bind 127.0.0.1 --directory ./public >http-server.log 2>&1 &"
summary = "在回环地址上临时后台共享 ./public，并在 5 分钟后自动停止"
simulated_output = "[1] 31452"

[[commands.tokens]]
text = "nohup"
desc = "让命令忽略终端挂断；本例仍由 timeout 限制最长运行时间"

[[commands.tokens]]
text = " timeout"
desc = "限制后续命令的运行时长，建立明确的自动停止边界"

[[commands.tokens]]
text = " 300s"
desc = "最多运行 300 秒；需要提前停止时只针对 shell 返回的准确 PID 发送 TERM"

[[commands.tokens]]
text = " python3"
desc = "Python 3 解释器"

[[commands.tokens]]
text = " -m"
desc = "运行指定模块"

[[commands.tokens]]
text = " http.server"
desc = "Python 内置的简单静态文件 HTTP 服务，仅适合临时本地用途"

[[commands.tokens]]
text = " 8000"
desc = "监听端口号"

[[commands.tokens]]
text = " --bind"
desc = "指定监听地址"

[[commands.tokens]]
text = " 127.0.0.1"
desc = "只监听本机 IPv4 回环地址，不暴露到局域网或公网"

[[commands.tokens]]
text = " --directory"
desc = "明确指定允许提供的目录，避免意外共享当前工作目录其他内容"

[[commands.tokens]]
text = " ./public"
desc = "预先检查过的静态文件目录"

[[commands.tokens]]
text = " >http-server.log"
desc = "把标准输出写入专用日志文件"

[[commands.tokens]]
text = " 2>&1"
desc = "把标准错误写入同一个日志文件"

[[commands.tokens]]
text = " &"
desc = "放到后台运行；shell 返回的作业 PID 是提前停止时应复核的精确目标"

[commands.dictation]
prompt = "只在 127.0.0.1:8000 后台提供已审核的 ./public 目录，把日志写入 http-server.log，并在 300 秒后自动停止"
answers = ["nohup timeout 300s python3 -m http.server 8000 --bind 127.0.0.1 --directory ./public >http-server.log 2>&1 &"]
