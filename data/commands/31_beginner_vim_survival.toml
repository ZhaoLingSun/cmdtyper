[meta]
category = "system"
difficulty = "beginner"
description = "Vim 生存与编辑器"

[meta.topic]
id = "vim_survival"
title = "Vim 生存与编辑器"
icon = "✍️"
order = 12

[[commands]]
id = "vim-open-notes"
command = "vim notes.txt"
summary = "用 Vim 打开笔记；进入后按 i 编辑，Esc 后用 :wq 保存退出"
simulated_output = """
Project notes
~
~
"notes.txt" 1L, 14B
"""
[[commands.tokens]]
text = "vim"
desc = "启动模式编辑器；同一个键在不同模式作用不同，按 i 进入插入模式，按 Esc 回到普通模式"
[[commands.tokens]]
text = " notes.txt"
desc = "要打开的笔记文件；普通模式输入 :wq 保存退出，不想保存时输入 :q!"
[commands.dictation]
prompt = "用本章的 Vim 打开 notes.txt；进入后按 i 编辑，按 Esc 回普通模式，再用 :wq 保存退出"
answers = ["vim notes.txt", "vi notes.txt"]

[[commands]]
id = "less-numbered-deploy"
command = "less -N deploy.sh"
summary = "只读分页查看脚本并显示行号"
simulated_output = """
      1 #!/bin/sh
      2 set -eu
      3
      4 case "$1" in
      5     start) run_server ;;
deploy.sh
"""
[[commands.tokens]]
text = "less"
desc = "只读分页查看长文本；按 q 退出，不会把文件写回磁盘"
[[commands.tokens]]
text = " -N"
desc = "在左侧显示行号，便于定位和讨论"
[[commands.tokens]]
text = " deploy.sh"
desc = "要安全查看的部署脚本"
[commands.dictation]
prompt = "不进入编辑模式，只读分页查看 deploy.sh 并在左侧显示行号"
answers = ["less -N deploy.sh"]

[[commands]]
id = "less-search-source"
command = "less src/main.rs"
summary = "只读分页查看源码，进入后可用 /TODO 搜索"
