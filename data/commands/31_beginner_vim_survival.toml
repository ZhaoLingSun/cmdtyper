[[commands]]
id = "crontab-edit-with-vim"
command = "VISUAL=vim EDITOR=vim crontab -e"
summary = "仅为本次操作同时指定 Vim；保存后任务表会安装"
simulated_output = """
# Edit this file to introduce tasks to be run by cron.
SHELL=/bin/sh
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
0 2 * * * /home/chen/bin/backup.sh
~
"/tmp/crontab.4YpQ3h/crontab" 4L, 184B
"""
[[commands.tokens]]
text = "VISUAL=vim"
desc = "只为本次 crontab 及编辑器子进程设置首选可视编辑器为 Vim"
[[commands.tokens]]
text = " EDITOR=vim"
desc = "同时覆盖后备编辑器变量，确保已有环境设置不会改用其他编辑器"
[[commands.tokens]]
text = " crontab"
desc = "管理当前用户的 cron 定时任务表"
[[commands.tokens]]
text = " -e"
desc = "在编辑器中打开任务表；退出后，保存的修改会自动安装并生效"
[commands.dictation]
prompt = "已先用 crontab -l 核对当前任务；仅为本次操作同时覆盖 VISUAL 与 EDITOR，确保用 Vim 编辑，保存退出后修改会立即安装"
answers = ["VISUAL=vim EDITOR=vim crontab -e"]

