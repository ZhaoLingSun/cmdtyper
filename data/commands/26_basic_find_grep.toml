[[commands.tokens]]
text = " 'ERROR|WARN'"
desc = "用 | 匹配 ERROR 或 WARN"

[[commands.tokens]]
text = " app.log"
desc = "要搜索的日志文件"

[commands.dictation]
prompt = "从 app.log 中同时找出包含 ERROR 或 WARN 的行"
