[[commands]]
id = "grep-recursive-api-url"
command = "grep -r 'api_url' config"
summary = "递归查找配置目录中的 api_url 设置"
simulated_output = """
config/app.conf:api_url = https://api.internal.example
config/staging/app.conf:api_url = https://staging-api.internal.example
"""

[[commands.tokens]]
text = "grep"
desc = "按文本模式筛选匹配行"

[[commands.tokens]]
text = " -r"
desc = "递归读取目录下的文件，不跟随遍历中遇到的符号链接"

[[commands.tokens]]
text = " 'api_url'"
desc = "要搜索的文本模式"

[[commands.tokens]]
text = " config"
desc = "要递归搜索的目录"

[commands.dictation]
prompt = "递归搜索 config 目录中包含 api_url 的行"
answers = ["grep -r 'api_url' config"]

[[commands]]
id = "grep-error-line-numbers"
command = "grep -n 'ERROR' app.log"
summary = "显示错误日志及其行号"
simulated_output = """
48:2026-07-26T09:12:04Z ERROR database connection timed out
113:2026-07-26T09:18:37Z ERROR request failed with status 502
"""

[[commands.tokens]]
text = "grep"
desc = "按文本模式筛选匹配行"

[[commands.tokens]]
text = " -n"
desc = "在每条匹配结果前显示从 1 开始的行号"

[[commands.tokens]]
text = " 'ERROR'"
desc = "要搜索的错误级别文本"

[[commands.tokens]]
text = " app.log"
desc = "要搜索的日志文件"

[commands.dictation]
prompt = "从 app.log 中找出包含 ERROR 的行，并在结果前显示行号"
answers = ["grep -n 'ERROR' app.log"]

[[commands]]
