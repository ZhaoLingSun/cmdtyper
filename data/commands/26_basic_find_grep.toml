2026-07-26T09:12:04Z ERROR database connection timed out
2026-07-26T09:14:26Z WARN cache response was slow
"""

[[commands.tokens]]
text = "grep"
desc = "按文本模式筛选匹配行"

[[commands.tokens]]
text = " -E"
