[[commands]]
id = "locate-ssh-config"
command = "locate ssh_config"
summary = "已安装且索引可用时，按路径名快速定位 SSH 配置"
simulated_output = """
/etc/ssh/ssh_config
/etc/ssh/ssh_config.d
/usr/share/man/man5/ssh_config.5.gz
"""

[[commands.tokens]]
text = "locate"
desc = "查询预先建立的文件名索引；无结果也可能是索引过旧，不等于文件一定不存在"

[[commands.tokens]]
text = " ssh_config"
desc = "要在完整路径中查找的子串"

[commands.dictation]
prompt = "在已安装 locate 且索引可用的系统上，快速查找路径中含有 ssh_config 的条目"
answers = ["locate ssh_config"]

[[commands]]
id = "updatedb-refresh-locate-index"
command = "command -v updatedb"
summary = "只读检查系统是否提供 locate 索引更新程序"
simulated_output = "/usr/bin/updatedb"

[[commands.tokens]]
text = "command"
desc = "Bash 内建命令；这里仅查询名称怎样解析，不运行目标程序"

[[commands.tokens]]
text = " -v"
desc = "显示名称对应的命令或路径"

[[commands.tokens]]
text = " updatedb"
desc = "要检查是否可用的索引更新程序；本题不会刷新系统索引"

[commands.dictation]
prompt = "不更新系统索引，只读检查当前 shell 能否找到 updatedb 程序"
