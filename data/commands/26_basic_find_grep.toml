[[commands]]
id = "grep-config-without-comments"
command = "grep -v '^#' app.conf"
summary = "过滤掉配置文件中的井号注释行"
simulated_output = """
listen = 8080
workers = 4
log_level = info
"""

[[commands.tokens]]
text = "grep"
desc = "按文本模式筛选匹配行"

[[commands.tokens]]
text = " -v"
desc = "反向选择，只输出不匹配模式的行"

[[commands.tokens]]
text = " '^#'"
desc = "匹配以 # 开头的行，^ 表示行首"

[[commands.tokens]]
text = " app.conf"
desc = "要读取的配置文件"

[commands.dictation]
prompt = "查看 app.conf 时过滤掉所有以 # 开头的注释行"
