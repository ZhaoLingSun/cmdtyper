[meta]
category = "search"
difficulty = "basic"
description = "find 与 grep 高频姿势"

[meta.topic]
id = "find_grep"
title = "find 与 grep 搜索"
icon = "🔎"
order = 7

[[commands]]
id = "find-pdf-by-name"
command = "find ~/Documents -type f -name '*.pdf'"
summary = "按名称查找文档目录中的 PDF 文件"
simulated_output = """
/home/alice/Documents/manuals/linux-basics.pdf
/home/alice/Documents/reports/quarterly-report.pdf
"""

[[commands.tokens]]
text = "find"
desc = "递归查找目录树中的文件和目录"

[[commands.tokens]]
text = " ~/Documents"
desc = "从当前用户的 Documents 目录开始查找"

[[commands.tokens]]
text = " -type f"
desc = "只匹配普通文件，不把同名目录、链接或其他对象算作 PDF 文件"

[[commands.tokens]]
text = " -name"
desc = "按文件名区分大小写地匹配"

[[commands.tokens]]
text = " '*.pdf'"
desc = "匹配所有以 .pdf 结尾的名称，引号防止 shell 提前展开通配符"

[commands.dictation]
prompt = "在当前用户的 Documents 目录树中查找所有 PDF 文件"
answers = ["find ~/Documents -type f -name '*.pdf'"]

[[commands]]
id = "find-zip-ignore-case"
command = "find ~/Downloads -type f -iname '*.zip'"
summary = "忽略大小写查找下载目录中的 ZIP 包"
simulated_output = """
/home/alice/Downloads/photos.ZIP
/home/alice/Downloads/releases/toolkit.zip
"""

[[commands.tokens]]
text = "find"
desc = "递归查找目录树中的文件和目录"

[[commands.tokens]]
text = " ~/Downloads"
desc = "从当前用户的 Downloads 目录开始查找"

[[commands.tokens]]
text = " -type f"
desc = "只匹配普通文件，不把名称以 .zip 结尾的目录或链接算作 ZIP 文件"

[[commands.tokens]]
text = " -iname"
desc = "按文件名匹配并忽略大小写"

[[commands.tokens]]
text = " '*.zip'"
desc = "匹配 .zip、.ZIP 等名称，引号保护通配符"

[commands.dictation]
prompt = "忽略大小写查找当前用户 Downloads 目录树中的所有 ZIP 包"
answers = ["find ~/Downloads -type f -iname '*.zip'"]

[[commands]]
id = "find-source-regular-files"
command = "find src -type f"
summary = "递归列出 src 中的普通文件"
simulated_output = """
src/main.rs
src/app.rs
src/ui/mod.rs
src/ui/home.rs
"""

[[commands.tokens]]
text = "find"
desc = "递归查找目录树中的文件和目录"

[[commands.tokens]]
text = " src"
desc = "从 src 目录开始查找"

[[commands.tokens]]
text = " -type"
desc = "按文件类型筛选"

[[commands.tokens]]
text = " f"
desc = "只匹配普通文件，不包含目录"

[commands.dictation]
prompt = "递归列出 src 目录树中的所有普通文件"
answers = ["find src -type f"]

[[commands]]
id = "find-tests-directories"
command = "find . -type d -name 'tests'"
summary = "查找当前目录树中名为 tests 的目录"
simulated_output = """
./tests
./crates/parser/tests
./vendor/codec/tests
"""

[[commands.tokens]]
text = "find"
desc = "递归查找目录树中的文件和目录"

[[commands.tokens]]
text = " ."
desc = "从当前目录开始查找"

[[commands.tokens]]
text = " -type d"
desc = "只匹配目录"

[[commands.tokens]]
text = " -name 'tests'"
desc = "名称必须为 tests"

[commands.dictation]
prompt = "查找当前目录树中所有名为 tests 的目录"
