[[commands]]
id = "find-logs-modified-seven-days"
command = "find /var/log -type f -mtime -7"
summary = "查找最近七天修改过的日志文件"
simulated_output = """
/var/log/syslog
/var/log/auth.log
/var/log/nginx/access.log
/var/log/nginx/error.log
"""

[[commands.tokens]]
text = "find"
desc = "递归查找目录树中的文件和目录"

[[commands.tokens]]
text = " /var/log"
desc = "从系统日志目录开始查找"

[[commands.tokens]]
text = " -type f"
desc = "只匹配普通文件"

[[commands.tokens]]
text = " -mtime -7"
desc = "匹配数据修改时间距今不足 7 个 24 小时周期的文件"

[commands.dictation]
prompt = "在 /var/log 中查找最近七天修改过的普通文件"
answers = ["find /var/log -type f -mtime -7"]

[[commands]]
id = "find-large-backup-files"
command = "find /srv/backups -type f -size +100M"
summary = "定位表观大小超过 100 MiB 的备份文件"
simulated_output = """
/srv/backups/database-2026-07-25.sql.gz
/srv/backups/media-weekly.tar.zst
"""

[[commands.tokens]]
text = "find"
desc = "递归查找目录树中的文件和目录"

[[commands.tokens]]
text = " /srv/backups"
desc = "从备份目录开始查找"

[[commands.tokens]]
text = " -type f"
desc = "只匹配普通文件"

[[commands.tokens]]
text = " -size +100M"
desc = "按 st_size 文件长度匹配表观大小超过 100 MiB 的文件，不表示实际分配的磁盘块"

[commands.dictation]
prompt = "在 /srv/backups 中找出表观大小（文件长度）超过 100 MiB 的普通文件"
answers = ["find /srv/backups -type f -size +100M"]

