answers = ["(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && cd \"$practice_dir\" && mkdir ownership && printf 'notes\\n' > ownership/notes.txt && stat -c '%U:%G %n' ownership/notes.txt)"]

[[commands]]
id = "ownership-project-tree-audit"
command = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && cd \"$practice_dir\" && mkdir -p ownership/project/config && printf 'MODE=demo\\n' > ownership/project/.env && printf 'port=8080\\n' > ownership/project/config/app.conf && find ownership/project -maxdepth 2 -printf '%M %u:%g %p\\n' | sort)"
