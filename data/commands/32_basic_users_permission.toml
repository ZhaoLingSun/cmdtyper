[[commands]]
id = "chmod-777-risk-training"
command = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && mkdir \"$practice_dir/training-share\" && chmod 770 \"$practice_dir/training-share\")"
summary = "在唯一私有练习区演示受控组共享模式"
simulated_output = ""

[[commands.tokens]]
text = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\""
desc = "在子 shell 中收紧创建权限，用 mktemp -d 原子建立当前用户拥有的唯一 0700 练习目录，并再次明确权限"

[[commands.tokens]]
text = " && mkdir \"$practice_dir/training-share\" && chmod 770 \"$practice_dir/training-share\""
desc = "在刚创建且不与其他练习共享的目录中准备夹具并完成本题动作"

[[commands.tokens]]
text = ")"
desc = "结束子 shell，避免 umask 和变量影响后续命令"
[commands.dictation]
prompt = "新建当前用户拥有的唯一 0700 练习目录，在其中创建 training-share 并设为 770；父目录保持私有，避免固定 /tmp 名称碰撞"
answers = ["(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && mkdir \"$practice_dir/training-share\" && chmod 770 \"$practice_dir/training-share\")"]

[[commands]]
id = "ownership-notes-audit"
command = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && cd \"$practice_dir\" && mkdir ownership && printf 'notes\\n' > ownership/notes.txt && stat -c '%U:%G %n' ownership/notes.txt)"
summary = "在私有夹具中只读核对文件所有者和组"
simulated_output = "ace:ace ownership/notes.txt"

[[commands.tokens]]
text = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\""
desc = "在子 shell 中收紧创建权限，用 mktemp -d 原子建立当前用户拥有的唯一 0700 练习目录，并再次明确权限"

[[commands.tokens]]
text = " && cd \"$practice_dir\" && mkdir ownership && printf 'notes\\n' > ownership/notes.txt && stat -c '%U:%G %n' ownership/notes.txt"
desc = "在刚创建且不与其他练习共享的目录中准备夹具并完成本题动作"

[[commands.tokens]]
text = ")"
