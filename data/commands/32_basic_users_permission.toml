[[commands.tokens]]
text = "(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\""
desc = "在子 shell 中收紧创建权限，用 mktemp -d 原子建立当前用户拥有的唯一 0700 练习目录，并再次明确权限"

[[commands.tokens]]
text = " && cd \"$practice_dir\" && mkdir -p ownership/project/config && printf 'MODE=demo\\n' > ownership/project/.env && printf 'port=8080\\n' > ownership/project/config/app.conf && find ownership/project -maxdepth 2 -printf '%M %u:%g %p\\n' | sort"
desc = "在刚创建且不与其他练习共享的目录中准备夹具并完成本题动作"

[[commands.tokens]]
text = ")"
desc = "结束子 shell，避免 umask 和变量影响后续命令"
[commands.dictation]
prompt = "新建唯一 0700 练习目录和小型 project 树，再只读列出两层内的权限、所有者、组、隐藏项和路径"
answers = ["(umask 077; practice_dir=$(mktemp -d) && chmod 700 \"$practice_dir\" && cd \"$practice_dir\" && mkdir -p ownership/project/config && printf 'MODE=demo\\n' > ownership/project/.env && printf 'port=8080\\n' > ownership/project/config/app.conf && find ownership/project -maxdepth 2 -printf '%M %u:%g %p\\n' | sort)"]

