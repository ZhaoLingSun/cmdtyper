[meta]
category = "scripting"
difficulty = "practical"
description = "实战补充：真实运维一行式、批量操作、磁盘清理与日志切割命令"

[[commands]]
id = "rename-batch-jpg"
command = "for f in *.jpeg; do [ -e \"$f\" ] || continue; [ -e \"${f%.jpeg}.jpg\" ] && continue; mv -n -- \"$f\" \"${f%.jpeg}.jpg\"; done"
summary = "把实际存在的 .jpeg 文件重命名为 .jpg，并跳过已有目标文件"
simulated_output = ""
[[commands.tokens]]
text = "for"
desc = "shell 循环关键字"
[[commands.tokens]]
text = " f"
desc = "保存当前候选文件名的循环变量"
[[commands.tokens]]
text = " in"
desc = "指定循环候选项"
[[commands.tokens]]
text = " *.jpeg"
desc = "当前目录中的 .jpeg 名称模式；无匹配时可能保留为字面文本"
[[commands.tokens]]
text = ";"
desc = "结束循环候选列表"
[[commands.tokens]]
text = " do"
desc = "循环体开始"
[[commands.tokens]]
text = " ["
desc = "开始第一个 shell 条件测试"
[[commands.tokens]]
text = " -e"
desc = "检查当前候选路径是否实际存在"
[[commands.tokens]]
text = " \"$f\""
desc = "按原样引用当前候选文件名"
[[commands.tokens]]
text = " ]"
desc = "结束候选路径存在性测试"
[[commands.tokens]]
text = " ||"
desc = "前一测试失败时执行右侧命令"
[[commands.tokens]]
text = " continue"
desc = "无匹配产生字面模式或候选不存在时跳过本轮"
[[commands.tokens]]
text = ";"
desc = "分隔无匹配检查与目标冲突检查"
[[commands.tokens]]
text = " ["
desc = "开始目标路径存在性测试"
[[commands.tokens]]
text = " -e"
desc = "检查目标 .jpg 路径是否已经存在"
[[commands.tokens]]
text = " \"${f%.jpeg}.jpg\""
desc = "去掉 .jpeg 后缀后生成并引用目标 .jpg 路径"
[[commands.tokens]]
text = " ]"
desc = "结束目标路径存在性测试"
[[commands.tokens]]
text = " &&"
desc = "目标已存在时执行右侧命令"
[[commands.tokens]]
text = " continue"
desc = "拒绝覆盖已有目标，直接跳过当前文件"
[[commands.tokens]]
text = ";"
desc = "分隔冲突检查与重命名动作"
[[commands.tokens]]
text = " mv"
desc = "移动或重命名文件"
[[commands.tokens]]
text = " -n"
desc = "再次要求不覆盖任何已有目标"
[[commands.tokens]]
text = " --"
desc = "结束选项解析，防止文件名被当作选项"
[[commands.tokens]]
text = " \"$f\""
desc = "按原样引用源文件名"
[[commands.tokens]]
text = " \"${f%.jpeg}.jpg\""
desc = "按原样引用已检查过的目标 .jpg 路径"
[[commands.tokens]]
text = ";"
desc = "结束本轮重命名动作"
[[commands.tokens]]
text = " done"
desc = "循环体结束"
[commands.dictation]
prompt = "把当前目录中实际存在的 .jpeg 文件批量改名为 .jpg；无匹配时不操作，目标 .jpg 已存在时跳过且绝不覆盖"
answers = ["for f in *.jpeg; do [ -e \"$f\" ] || continue; [ -e \"${f%.jpeg}.jpg\" ] && continue; mv -n -- \"$f\" \"${f%.jpeg}.jpg\"; done"]

