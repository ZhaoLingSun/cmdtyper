[[commands]]
id = "ssh-keygen-ed25519"
command = "(umask 077; key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-deploy-key.XXXXXX\") && chmod 700 \"$key_dir\" && key=\"$key_dir/id_ed25519_deploy\" && ssh-keygen -t ed25519 -f \"$key\" -C 'deploy@server' && printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\")"
summary = "在新建的私有临时目录中交互生成专用部署密钥，并报告实际路径"
simulated_output = "Generating public/private ed25519 key pair.\nEnter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour identification has been saved in /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy\nYour public key has been saved in /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy.pub\nKey directory: /tmp/cmdtyper-deploy-key.A1b2C3\nPrivate key: /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy\nPublic key: /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy.pub"
[[commands.tokens]]
text = "(umask 077; key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-deploy-key.XXXXXX\") && chmod 700 \"$key_dir\""
desc = "原子创建当前用户拥有的唯一 0700 私有目录，悬空符号链接和旧固定文件都无法占用内部目标"

[[commands.tokens]]
text = " && key=\"$key_dir/id_ed25519_deploy\""
desc = "在新目录中使用清晰的部署密钥基名"

[[commands.tokens]]
text = " && ssh-keygen -t ed25519 -f \"$key\" -C 'deploy@server'"
desc = "交互生成 Ed25519 密钥并保留原生口令提示，不用 -N 静默创建无口令私钥"

[[commands.tokens]]
text = " && printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\")"
desc = "成功后输出私钥和配套 .pub 的真实随机路径，供下一题精确选择"
[commands.dictation]
prompt = "用 umask 077 和 mktemp -d 新建唯一 0700 私有目录，在其中交互生成 id_ed25519_deploy 专用 Ed25519 密钥并设置口令；成功后输出实际私钥及 .pub 路径，不使用 test ! -e 或固定覆盖目标"
answers = ["(umask 077; key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-deploy-key.XXXXXX\") && chmod 700 \"$key_dir\" && key=\"$key_dir/id_ed25519_deploy\" && ssh-keygen -t ed25519 -f \"$key\" -C 'deploy@server' && printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\")"]

[[commands]]
id = "ssh-copy-id"
command = "(umask 077; printf 'Private key path printed by ssh-keygen: ' && IFS= read -r key && [ -f \"$key.pub\" ] && [ ! -L \"$key.pub\" ] && printf 'Expected ED25519 SHA256 host fingerprint from an independent trusted source: ' && IFS= read -r expected && host=example.com && kh=$(mktemp) && trap 'rm -f -- \"$kh\"' EXIT HUP INT TERM && ssh-keyscan -t ed25519 \"$host\" >\"$kh\" 2>/dev/null && actual=$(ssh-keygen -lf \"$kh\" -E sha256 | awk '{print $2}' | sort -u) && [ \"$actual\" = \"$expected\" ] && ssh-copy-id -i \"$key.pub\" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=\"$kh\" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \"admin@$host\")"
summary = "独立核验主机指纹后，精确安装上一题生成的部署公钥"
simulated_output = "Private key path printed by ssh-keygen: /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy\nExpected ED25519 SHA256 host fingerprint from an independent trusted source: SHA256:V7pN2cR4mK8sT1xQ6zL9bH3dF5wJ0yE2uA4gC6iM8oP\n/usr/bin/ssh-copy-id: INFO: Source of key(s) to be installed: \"/tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy.pub\"\nadmin@example.com's password:\nNumber of key(s) added: 1\nNow try logging into the machine, with: \"ssh admin@example.com\""
[[commands.tokens]]
text = "(umask 077; printf 'Private key path printed by ssh-keygen: ' && IFS= read -r key && [ -f \"$key.pub\" ] && [ ! -L \"$key.pub\" ]"
desc = "在本命令中读取上一题报告的实际部署私钥路径，并验证对应 .pub 是普通文件"

[[commands.tokens]]
text = " && printf 'Expected ED25519 SHA256 host fingerprint from an independent trusted source: ' && IFS= read -r expected"
desc = "要求从连接之外的可信渠道取得预期 Ed25519 SHA256 主机指纹"

[[commands.tokens]]
text = " && host=example.com && kh=$(mktemp) && trap 'rm -f -- \"$kh\"' EXIT HUP INT TERM && ssh-keyscan -t ed25519 \"$host\" >\"$kh\" 2>/dev/null"
desc = "把当前呈现的主机密钥捕获到私有随机 known_hosts 文件，供比较和后续固定"

[[commands.tokens]]
text = " && actual=$(ssh-keygen -lf \"$kh\" -E sha256 | awk '{print $2}' | sort -u) && [ \"$actual\" = \"$expected\" ]"
desc = "只有所有扫描到的唯一指纹恰好等于独立可信值才继续"

[[commands.tokens]]
text = " && ssh-copy-id -i \"$key.pub\" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=\"$kh\" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \"admin@$host\")"
desc = "通过 -i 精确安装上一题同一路径的 .pub，并把 SSH 连接固定到已核验主机密钥"
[commands.dictation]
prompt = "输入上一题输出的实际部署私钥路径，再输入从独立可信渠道取得的 example.com Ed25519 SHA256 主机指纹；仅当对应 .pub 为普通文件且主机指纹完全匹配时，用 -i \"$key.pub\" 安装到 admin@example.com，并固定该已核验主机密钥"
answers = ["(umask 077; printf 'Private key path printed by ssh-keygen: ' && IFS= read -r key && [ -f \"$key.pub\" ] && [ ! -L \"$key.pub\" ] && printf 'Expected ED25519 SHA256 host fingerprint from an independent trusted source: ' && IFS= read -r expected && host=example.com && kh=$(mktemp) && trap 'rm -f -- \"$kh\"' EXIT HUP INT TERM && ssh-keyscan -t ed25519 \"$host\" >\"$kh\" 2>/dev/null && actual=$(ssh-keygen -lf \"$kh\" -E sha256 | awk '{print $2}' | sort -u) && [ \"$actual\" = \"$expected\" ] && ssh-copy-id -i \"$key.pub\" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=\"$kh\" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \"admin@$host\")"]

