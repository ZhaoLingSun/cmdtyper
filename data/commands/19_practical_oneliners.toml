[[commands]]
id = "parallel-ping"
command = "seq 1 10 | xargs -P 4 -I{} ping -c 1 -W 1 127.0.0.{}"
summary = "以最多 4 路并发探测 10 个本机回环地址，不向外部或未授权网络发送流量"
simulated_output = "PING 127.0.0.1 (127.0.0.1) 56(84) bytes of data.\nPING 127.0.0.2 (127.0.0.2) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.031 ms\n64 bytes from 127.0.0.2: icmp_seq=1 ttl=64 time=0.028 ms\n--- 127.0.0.1 ping statistics ---\n1 packets transmitted, 1 received, 0% packet loss, time 0ms\n"
[[commands.tokens]]
text = "seq"
desc = "生成受限的数字序列"
[[commands.tokens]]
text = " 1"
desc = "回环地址末段起始值"
[[commands.tokens]]
text = " 10"
desc = "只检查 10 个本机回环地址，限制请求总量"
[[commands.tokens]]
text = " |"
desc = "把数字序列传给 xargs"
[[commands.tokens]]
text = " xargs"
desc = "把输入转换成命令参数"
[[commands.tokens]]
text = " -P"
desc = "设置并行运行上限；并发输出可能交错"
[[commands.tokens]]
text = " 4"
desc = "最多同时运行 4 个 ping，避免原先 50 路并发负载"
[[commands.tokens]]
text = " -I{}"
desc = "把每个输入项替换到 {} 处"
[[commands.tokens]]
text = " ping"
desc = "发送 ICMP 探测；改成任何真实网络前必须获得明确授权"
[[commands.tokens]]
text = " -c"
desc = "指定每个地址的发送次数"
[[commands.tokens]]
text = " 1"
desc = "每个地址只发送 1 次"
[[commands.tokens]]
text = " -W"
desc = "设置等待响应的秒数"
[[commands.tokens]]
text = " 1"
desc = "每次最多等待 1 秒"
[[commands.tokens]]
text = " 127.0.0.{}"
desc = "IPv4 回环网段中的本机地址，不会扫描局域网或互联网主机"
[commands.dictation]
prompt = "仅在本机 IPv4 回环范围内，以最多 4 路并发向 127.0.0.1 到 127.0.0.10 各发送一次 ping；不要替换为未获授权的网络"
answers = ["seq 1 10 | xargs -P 4 -I{} ping -c 1 -W 1 127.0.0.{}"]

[[commands]]
id = "tar-incremental-backup"
command = "archive=$(mktemp \"./backup-$(date +%F)-XXXXXX.tar.gz\")\ntar czf \"$archive\" --newer-mtime='1 day ago' /srv/data\nprintf '%s\\n' \"$archive\""
summary = "用当天日期和唯一后缀创建过去一天文件的独立归档，不覆盖同日已有备份；逐条回车，确认成功再继续"
