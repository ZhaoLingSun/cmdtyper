[[commands]]
id = "ssh-keygen-ed25519"
command = "umask 077\nkey_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-deploy-key.XXXXXX\")\nchmod 700 \"$key_dir\"\nkey=\"$key_dir/id_ed25519_deploy\"\nssh-keygen -t ed25519 -f \"$key\" -C 'deploy@server'\nprintf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\""
summary = "在新建的私有临时目录中交互生成专用部署密钥，并报告实际路径；逐条回车，确认成功再继续"
simulated_output = "Generating public/private ed25519 key pair.\nEnter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour identification has been saved in /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy\nYour public key has been saved in /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy.pub\nKey directory: /tmp/cmdtyper-deploy-key.A1b2C3\nPrivate key: /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy\nPublic key: /tmp/cmdtyper-deploy-key.A1b2C3/id_ed25519_deploy.pub"
[[commands.tokens]]
text = "umask 077\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-deploy-key.XXXXXX\")\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "chmod 700 \"$key_dir\"\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "key=\"$key_dir/id_ed25519_deploy\"\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "ssh-keygen -t ed25519 -f \"$key\" -C 'deploy@server'\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\""
desc = "在新建的私有临时目录中交互生成专用部署密钥，并报告实际路径"
[commands.dictation]
prompt = "用 umask 077 和 mktemp -d 新建唯一 0700 私有目录，在其中交互生成 id_ed25519_deploy 专用 Ed25519 密钥并设置口令；成功后输出实际私钥及 .pub 路径，不使用 test ! -e 或固定覆盖目标"
answers = ["umask 077\nkey_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-deploy-key.XXXXXX\")\nchmod 700 \"$key_dir\"\nkey=\"$key_dir/id_ed25519_deploy\"\nssh-keygen -t ed25519 -f \"$key\" -C 'deploy@server'\nprintf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\""]

[[commands]]
id = "ssh-copy-id"
command = "ssh-keygen -lf ~/.ssh/id_ed25519_deploy.pub\nssh-keyscan -t ed25519 example.com\nssh-copy-id -i ~/.ssh/id_ed25519_deploy.pub admin@example.com"
summary = "查看公钥指纹、检查服务器主机密钥并安装公钥（分步模拟）；逐条回车，确认成功再继续"
simulated_output = "Number of key(s) added: 1"
[[commands.tokens]]
text = "ssh-keygen -lf ~/.ssh/id_ed25519_deploy.pub\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "ssh-keyscan -t ed25519 example.com\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
