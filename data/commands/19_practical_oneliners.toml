[meta]
category = "scripting"
difficulty = "practical"
description = "实战补充：真实运维一行式、批量操作、磁盘清理与日志切割命令"

[[commands]]
id = "rename-batch-jpg"
command = "for f in *.jpeg; do [ -e \"$f\" ] || continue; [ -e \"${f%.jpeg}.jpg\" ] && continue; mv -n -- \"$f\" \"${f%.jpeg}.jpg\"; done"
summary = "把实际存在的 .jpeg 文件重命名为 .jpg，并跳过已有目标文件"
simulated_output = ""
[[commands.tokens]]
text = "for"
desc = "shell 循环关键字"
[[commands.tokens]]
text = " f"
desc = "保存当前候选文件名的循环变量"
[[commands.tokens]]
text = " in"
desc = "指定循环候选项"
[[commands.tokens]]
text = " *.jpeg"
desc = "当前目录中的 .jpeg 名称模式；无匹配时可能保留为字面文本"
[[commands.tokens]]
text = ";"
desc = "结束循环候选列表"
[[commands.tokens]]
text = " do"
desc = "循环体开始"
[[commands.tokens]]
text = " ["
desc = "开始第一个 shell 条件测试"
[[commands.tokens]]
text = " -e"
desc = "检查当前候选路径是否实际存在"
[[commands.tokens]]
text = " \"$f\""
desc = "按原样引用当前候选文件名"
[[commands.tokens]]
text = " ]"
desc = "结束候选路径存在性测试"
[[commands.tokens]]
text = " ||"
desc = "前一测试失败时执行右侧命令"
[[commands.tokens]]
text = " continue"
desc = "无匹配产生字面模式或候选不存在时跳过本轮"
[[commands.tokens]]
text = ";"
desc = "分隔无匹配检查与目标冲突检查"
[[commands.tokens]]
text = " ["
desc = "开始目标路径存在性测试"
[[commands.tokens]]
text = " -e"
desc = "检查目标 .jpg 路径是否已经存在"
[[commands.tokens]]
text = " \"${f%.jpeg}.jpg\""
desc = "去掉 .jpeg 后缀后生成并引用目标 .jpg 路径"
[[commands.tokens]]
text = " ]"
desc = "结束目标路径存在性测试"
[[commands.tokens]]
text = " &&"
desc = "目标已存在时执行右侧命令"
[[commands.tokens]]
text = " continue"
desc = "拒绝覆盖已有目标，直接跳过当前文件"
[[commands.tokens]]
text = ";"
desc = "分隔冲突检查与重命名动作"
[[commands.tokens]]
text = " mv"
desc = "移动或重命名文件"
[[commands.tokens]]
text = " -n"
desc = "再次要求不覆盖任何已有目标"
[[commands.tokens]]
text = " --"
desc = "结束选项解析，防止文件名被当作选项"
[[commands.tokens]]
text = " \"$f\""
desc = "按原样引用源文件名"
[[commands.tokens]]
text = " \"${f%.jpeg}.jpg\""
desc = "按原样引用已检查过的目标 .jpg 路径"
[[commands.tokens]]
text = ";"
desc = "结束本轮重命名动作"
[[commands.tokens]]
text = " done"
desc = "循环体结束"
[commands.dictation]
prompt = "把当前目录中实际存在的 .jpeg 文件批量改名为 .jpg；无匹配时不操作，目标 .jpg 已存在时跳过且绝不覆盖"
answers = ["for f in *.jpeg; do [ -e \"$f\" ] || continue; [ -e \"${f%.jpeg}.jpg\" ] && continue; mv -n -- \"$f\" \"${f%.jpeg}.jpg\"; done"]

[[commands]]
id = "disk-top-dirs"
command = "du -h --max-depth=1 / 2>/dev/null | sort -rh | head -20"
summary = "查看根目录下各一级子目录的空间占用，按大小排列取前 20"
simulated_output = "45G\t/var\n18G\t/home\n9.7G\t/usr\n3.1G\t/opt\n1.2G\t/etc\n"
[[commands.tokens]]
text = "du"
desc = "统计文件或目录的磁盘占用空间"
[[commands.tokens]]
text = " -h"
desc = "以易读单位显示"
[[commands.tokens]]
text = " --max-depth=1"
desc = "只统计一级子目录"
[[commands.tokens]]
text = " /"
desc = "文件路径： /"
[[commands.tokens]]
text = " 2>/dev/null"
desc = "丢弃权限不足等错误输出"
[[commands.tokens]]
text = " |"
desc = "管道"
[[commands.tokens]]
text = " sort"
desc = "排序"
[[commands.tokens]]
text = " -rh"
desc = "按易读数值逆序"
[[commands.tokens]]
text = " |"
desc = "管道"
[[commands.tokens]]
text = " head"
desc = "取前几行"
[[commands.tokens]]
text = " -20"
desc = "取前 20 项"
[commands.dictation]
prompt = "查看根目录下各一级子目录的空间占用，按大小排列取前 20"
answers = ["du -h --max-depth=1 / 2>/dev/null | sort -rh | head -20"]

[[commands]]
id = "find-empty-dirs"
command = "find . -depth -mindepth 1 -type d -empty -print"
summary = "按深度优先顺序只读列出当前目录下的空子目录，供删除前审核"
simulated_output = "./build/cache\n./tmp/old\n"
[[commands.tokens]]
text = "find"
desc = "在目录树中递归查找文件和目录"
[[commands.tokens]]
text = " ."
desc = "从当前目录开始检查"
[[commands.tokens]]
text = " -depth"
desc = "先访问子项再访问父目录，使清单顺序与目录删除时的深度语义一致"
[[commands.tokens]]
text = " -mindepth"
desc = "设置最小搜索深度"
[[commands.tokens]]
text = " 1"
desc = "不把起点 . 本身列为候选"
[[commands.tokens]]
text = " -type"
desc = "按类型筛选"
[[commands.tokens]]
text = " d"
desc = "只匹配目录"
[[commands.tokens]]
text = " -empty"
desc = "只匹配当前观察时为空的目录；状态之后仍可能变化"
[[commands.tokens]]
text = " -print"
desc = "只打印候选路径，不删除目录"
[commands.dictation]
prompt = "按深度优先顺序只读列出当前目录下的空子目录，排除起点本身，供逐项审核；不要直接 -delete"
answers = ["find . -depth -mindepth 1 -type d -empty -print"]

[[commands]]
id = "grep-count-error-per-hour"
command = "grep 'ERROR' app.log | awk '{print substr($2,1,13)}' | sort | uniq -c"
summary = "按小时统计 app.log 中 ERROR 的出现次数"
simulated_output = " 12 2026-03-14T08\n  9 2026-03-14T09\n  4 2026-03-14T10\n"
