[[commands]]
id = "systemctl-enable-now-nginx-service"
command = "sudo systemctl enable --now nginx.service"
summary = "仅在自有练习机持久启用 nginx 并立即启动"
simulated_output = """
Created symlink /etc/systemd/system/multi-user.target.wants/nginx.service → /lib/systemd/system/nginx.service.
"""

[[commands.tokens]]
text = "sudo"
desc = "仅在已获授权的自有练习机上，以管理员权限执行服务操作"

[[commands.tokens]]
text = " systemctl"
desc = "控制 systemd 单元"

[[commands.tokens]]
text = " enable"
desc = "建立开机启动所需的单元链接，会持久改变以后开机时的行为"

[[commands.tokens]]
text = " --now"
desc = "除了启用开机启动，还立刻启动服务"

[[commands.tokens]]
text = " nginx.service"
desc = "要启用并启动的 nginx 服务单元"

[commands.dictation]
prompt = "仅在自有练习机上，让 nginx 以后开机自动启动并且现在立刻运行"
