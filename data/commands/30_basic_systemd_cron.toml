[[commands]]
id = "cron-field-minute-example"
command = "echo '15 * * * * /usr/local/bin/health-check'"
summary = "仅打印每小时第 15 分钟运行的示例"
simulated_output = "15 * * * * /usr/local/bin/health-check"

[[commands.tokens]]
text = "echo"
desc = "只打印示例文本，不安装或运行定时任务"

[[commands.tokens]]
text = " '15"
desc = "第 1 段是分钟；15 表示每小时的第 15 分钟"

[[commands.tokens]]
text = " *"
desc = "第 2 段是小时；星号表示每个小时"

[[commands.tokens]]
text = " *"
desc = "第 3 段是每月第几日；星号表示每天"

[[commands.tokens]]
text = " *"
desc = "第 4 段是月份；星号表示每月"

[[commands.tokens]]
text = " *"
desc = "第 5 段是星期几；星号表示不限制星期"

[[commands.tokens]]
text = " /usr/local/bin/health-check'"
desc = "五段时间字段之后才是计划运行的命令；这里只作为文字打印"

[commands.dictation]
prompt = "本题练习 cron 五段格式：请用 echo 原样打印每小时第 15 分钟运行健康检查的示例，不写入任务表"
answers = ["echo '15 * * * * /usr/local/bin/health-check'", "printf '%s\\n' '15 * * * * /usr/local/bin/health-check'"]

