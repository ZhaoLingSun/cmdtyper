[[commands]]
id = "find-mtime-delete"
command = "find /var/log -type f -name '*.log' -mtime +30 -print"
summary = "只读列出 /var/log 下超过 30 天的 .log 普通文件，交给日志保留策略审核"
simulated_output = "/var/log/app/archive-2026-05-14.log\n/var/log/nginx/access-2026-06-01.log\n"
[[commands.tokens]]
text = "find"
desc = "在目录树中递归查找文件和目录"
[[commands.tokens]]
text = " /var/log"
desc = "只读检查的日志目录起点"
[[commands.tokens]]
text = " -type"
desc = "按文件类型过滤"
[[commands.tokens]]
text = " f"
desc = "只匹配普通文件"
[[commands.tokens]]
text = " -name"
desc = "按文件名模式匹配"
[[commands.tokens]]
text = " '*.log'"
desc = "用引号保护模式，只匹配 .log 名称"
[[commands.tokens]]
text = " -mtime"
desc = "按修改时间过滤"
[[commands.tokens]]
text = " +30"
desc = "匹配修改时间超过 30 个整天的文件"
[[commands.tokens]]
text = " -print"
desc = "只打印候选路径，不删除文件；日志清理由轮转和保留策略另行决定"
[commands.dictation]
prompt = "只读列出 /var/log 下修改时间超过 30 天的 .log 普通文件，供核对日志轮转、合规保留和备份策略；不要直接删除"
answers = ["find /var/log -type f -name '*.log' -mtime +30 -print"]

