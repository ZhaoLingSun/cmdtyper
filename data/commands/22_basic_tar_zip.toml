[meta.topic]
id = "tar_zip"
title = "打包压缩与解压"
icon = "🗜️"
order = 3

[[commands]]
id = "tar-czf-public"
command = "tar -czf website.tar.gz public"
summary = "确认归档名不存在后，把 public 打包为 gzip 归档"
simulated_output = ""

[[commands.tokens]]
text = "tar"
desc = "创建、查看和提取归档的工具"

[[commands.tokens]]
text = " -czf"
desc = "c 新建、z 使用 gzip、f 指定下一参数为归档名；f 应放在组合末尾"

[[commands.tokens]]
text = " website.tar.gz"
desc = "已确认不存在的目标归档；tar 默认会覆盖同名普通文件"

[[commands.tokens]]
text = " public"
desc = "要打包的源目录"

[commands.dictation]
prompt = "已确认当前目录不存在 website.tar.gz；将 public 目录打包并用 gzip 压缩为该归档"
answers = ["tar -czf website.tar.gz public"]

[[commands]]
id = "tar-tzf-website"
command = "tar -tzf website.tar.gz"
summary = "不解压，先检查 gzip 归档内容"
simulated_output = "public/\npublic/index.html\npublic/assets/\npublic/assets/app.css"

[[commands.tokens]]
text = "tar"
desc = "创建、查看和提取归档的工具"

[[commands.tokens]]
text = " -tzf"
desc = "t 列出、z 读取 gzip 压缩、f 指定下一参数为归档名"

[[commands.tokens]]
text = " website.tar.gz"
desc = "只查看而不提取的归档"

[commands.dictation]
prompt = "不解压，列出 gzip 归档 website.tar.gz 的内容"
answers = ["tar -tzf website.tar.gz"]

[[commands]]
id = "tar-xzf-website"
command = "tar -tzf website.tar.gz\ndest=$(mktemp -d)\ntar --extract --gzip --no-same-owner --no-same-permissions --file website.tar.gz --directory \"$dest\"\nfind \"$dest\" -maxdepth 2 -type f"
summary = "先检查归档清单并确认，再以普通用户提取到新建的私有空目录；逐条回车，确认成功再继续"
simulated_output = "public/\npublic/index.html\npublic/assets/\npublic/assets/app.css\n清单确认安全后输入 yes: yes\n提取目录：/tmp/tmp.Q7m2Xa"

[[commands.tokens]]
text = "tar -tzf website.tar.gz\n"
desc = "先阅读压缩包清单，人工确认路径安全后再继续"

[[commands.tokens]]
text = "dest=$(mktemp -d)\n"
desc = "创建一个新的提取目录，命令替换保存目录路径"

[[commands.tokens]]
text = "tar --extract --gzip --no-same-owner --no-same-permissions --file website.tar.gz --directory \"$dest\"\n"
desc = "提取到指定目录，不恢复归档中保存的所有者或宽松权限"

[[commands.tokens]]
text = "find \"$dest\" -maxdepth 2 -type f"
desc = "检查解压后的文件层级和文件名"

[commands.dictation]
prompt = "先查看 website.tar.gz 清单，确认没有绝对路径和 .. 越界路径后，将其提取到新建目录并检查文件。逐条按 Enter 继续。"
answers = ["tar -tzf website.tar.gz\ndest=$(mktemp -d)\ntar --extract --gzip --no-same-owner --no-same-permissions --file website.tar.gz --directory \"$dest\"\nfind \"$dest\" -maxdepth 2 -type f"]

[[commands]]
id = "tar-xzf-to-restore"
command = "tar -xzf website.tar.gz -C restore"
summary = "把 gzip 归档提取到已存在的空目录"
simulated_output = ""

[[commands.tokens]]
text = "tar"
desc = "创建、查看和提取归档的工具"

[[commands.tokens]]
text = " -xzf"
desc = "x 提取、z 解 gzip、f 指定下一参数为归档名"

[[commands.tokens]]
text = " website.tar.gz"
desc = "已检查过内容清单的 gzip 压缩归档"

[[commands.tokens]]
text = " -C"
desc = "先切换目录，再执行提取；该选项对后续路径参数有位置影响"

[[commands.tokens]]
text = " restore"
desc = "已存在且为空的提取目标目录，避免与现有路径碰撞"

[commands.dictation]
prompt = "已检查归档清单，且 restore 目录存在并为空；将 website.tar.gz 还原到该目录"
answers = ["tar -xzf website.tar.gz -C restore"]

[[commands]]
