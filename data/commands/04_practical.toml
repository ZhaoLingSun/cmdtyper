[[commands]]
id = "curl-health-check"
command = "curl -fsSL https://example.com/"
summary = "请求 IANA 保留示例域名的稳定示例页面，并在 HTTP 错误时失败"
simulated_output = """<!doctype html>
<html>
<head>
    <title>Example Domain</title>
</head>"""

[[commands.tokens]]
text = "curl"
desc = "命令行 HTTP 客户端：发送请求并获取响应"

[[commands.tokens]]
text = " -fsSL"
desc = "-f HTTP 错误时失败 + -s 静默 + -S 显示错误 + -L 跟随重定向"

[[commands.tokens]]
text = " https://example.com/"
desc = "IANA 保留的文档示例域名根页面；不是虚构的健康检查 API"

[commands.dictation]
prompt = "静默请求 IANA 保留的 https://example.com/ 示例页面，HTTP 错误时失败、仍显示错误并跟随重定向"
answers = [
    "curl -fsSL https://example.com/",
    "curl --fail --silent --show-error --location https://example.com/",
]

