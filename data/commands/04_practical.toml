[[commands]]
id = "systemctl-restart-nginx"
command = "sudo nginx -t"
summary = "在任何 reload 或 restart 前，只验证 nginx 配置语法和引用文件"
simulated_output = """
nginx: the configuration file /etc/nginx/nginx.conf syntax is ok
nginx: configuration file /etc/nginx/nginx.conf test is successful"""

[[commands.tokens]]
text = "sudo"
desc = "仅为读取完整 nginx 配置和密钥引用请求管理员权限；本命令不重启服务"

[[commands.tokens]]
text = " nginx"
desc = "nginx 可执行程序，用于解析当前配置"

[[commands.tokens]]
text = " -t"
desc = "测试配置语法并尝试打开引用文件，不应用配置、不 reload、不 restart"

[commands.dictation]
prompt = "在考虑 reload 或 restart nginx 前，只验证当前配置语法和引用文件是否可读取，不改变服务运行状态"
