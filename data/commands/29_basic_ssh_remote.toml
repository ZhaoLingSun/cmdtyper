[[commands]]
id = "rsync-archive-compress"
command = "rsync -av photos/ alice@server.example.com:/home/alice/photos/"
summary = "以归档模式增量同步照片，并更新目标端同名文件"
simulated_output = "sending incremental file list\n./\nbeach.jpg\nteam.jpg\n\nsent 4,318,522 bytes  received 57 bytes  2,879,052.67 bytes/sec\ntotal size is 6,104,832  speedup is 1.41\n"
