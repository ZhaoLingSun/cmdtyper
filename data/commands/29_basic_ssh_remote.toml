[[commands]]
id = "ssh-login-basic"
command = "ssh alice@server.example.com"
summary = "首次登录先通过可信渠道核验主机指纹"
simulated_output = "The authenticity of host 'server.example.com (192.0.2.24)' can't be established.\nED25519 key fingerprint is SHA256:RrYw7q1QXJH1dH0s0M4jVj6ZK8Yq2cP9YxQe4uWn7nI.\nAre you sure you want to continue connecting (yes/no/[fingerprint])?"
[[commands.tokens]]
text = "ssh"
desc = "通过加密连接登录远程主机；首次连接时不要直接输入 yes，应先独立核验指纹"
[[commands.tokens]]
text = " alice@server.example.com"
desc = "远程用户名与主机名；显示的 SHA256 指纹必须与管理员或主机控制台提供的值一致"
[commands.dictation]
prompt = "以 alice 身份首次连接 server.example.com；停在主机密钥提示，通过管理员或主机控制台核对 SHA256 指纹，未核验前不要接受"
answers = ["ssh alice@server.example.com"]

[[commands]]
id = "ssh-login-custom-port"
command = "ssh -p 2222 alice@server.example.com"
summary = "通过 2222 端口登录远程主机"
simulated_output = "alice@server.example.com's password:\nLast login: Sun Jul 26 09:18:42 2026 from 198.51.100.17\n"
[[commands.tokens]]
text = "ssh"
desc = "通过加密连接登录远程主机"
[[commands.tokens]]
text = " -p"
desc = "指定服务端口；这里必须使用小写 p"
[[commands.tokens]]
text = " 2222"
desc = "远程服务监听的非默认端口"
[[commands.tokens]]
text = " alice@server.example.com"
desc = "远程用户名与主机名"
[commands.dictation]
prompt = "已通过可信渠道核验该主机指纹后，以 alice 身份通过 2222 端口登录 server.example.com"
answers = ["ssh -p 2222 alice@server.example.com"]

[[commands]]
id = "ssh-identity-file"
command = "ssh -i ~/.ssh/work_ed25519 alice@server.example.com"
summary = "使用指定私钥登录远程主机"
simulated_output = "Enter passphrase for key '/home/alice/.ssh/work_ed25519':\nLast login: Sun Jul 26 09:24:08 2026 from 198.51.100.17\n"
[[commands.tokens]]
text = "ssh"
desc = "通过加密连接登录远程主机"
[[commands.tokens]]
text = " -i"
desc = "指定用于公钥认证的身份文件"
[[commands.tokens]]
text = " ~/.ssh/work_ed25519"
desc = "本地私钥文件路径，不要泄露其内容"
[[commands.tokens]]
text = " alice@server.example.com"
desc = "远程用户名与主机名"
[commands.dictation]
prompt = "已通过可信渠道核验该主机指纹后，使用 ~/.ssh/work_ed25519 私钥以 alice 身份登录 server.example.com"
answers = ["ssh -i ~/.ssh/work_ed25519 alice@server.example.com"]

[[commands]]
id = "ssh-keygen-ed25519-basic"
command = "umask 077\nkey_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-work-key.XXXXXX\")\nchmod 700 \"$key_dir\"\nkey=\"$key_dir/work_ed25519\"\nssh-keygen -t ed25519 -f \"$key\" -C 'alice@laptop'\nprintf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\""
summary = "在新建的私有临时目录中交互生成 Ed25519 密钥，并报告实际路径；逐条回车，确认成功再继续"
simulated_output = "Generating public/private ed25519 key pair.\nEnter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour identification has been saved in /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519\nYour public key has been saved in /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519.pub\nThe key fingerprint is:\nSHA256:Q1sM9rX2kF6nV8cD4wJ7pL0zH3bY5tA6uE9iN2oG4xU alice@laptop\nKey directory: /tmp/cmdtyper-work-key.Q7m2Xa\nPrivate key: /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519\nPublic key: /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519.pub"
[[commands.tokens]]
text = "umask 077\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-work-key.XXXXXX\")\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "chmod 700 \"$key_dir\"\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "key=\"$key_dir/work_ed25519\"\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "ssh-keygen -t ed25519 -f \"$key\" -C 'alice@laptop'\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\""
desc = "在新建的私有临时目录中交互生成 Ed25519 密钥，并报告实际路径"
[commands.dictation]
prompt = "用 umask 077 和 mktemp -d 新建唯一 0700 私有目录，在其中交互生成 work_ed25519 Ed25519 密钥并设置口令；不得使用固定目标或覆盖提示，成功后输出目录、私钥和 .pub 公钥的实际路径"
answers = ["umask 077\nkey_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-work-key.XXXXXX\")\nchmod 700 \"$key_dir\"\nkey=\"$key_dir/work_ed25519\"\nssh-keygen -t ed25519 -f \"$key\" -C 'alice@laptop'\nprintf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\""]

[[commands]]
id = "ssh-copy-id-basic"
command = "ssh-keygen -lf ~/.ssh/work_ed25519.pub\nssh-keyscan -t ed25519 server.example.com\nssh-copy-id -i ~/.ssh/work_ed25519.pub alice@server.example.com"
summary = "查看公钥指纹、检查服务器主机密钥并安装公钥（分步模拟）；逐条回车，确认成功再继续"
simulated_output = "Number of key(s) added: 1"
[[commands.tokens]]
text = "ssh-keygen -lf ~/.ssh/work_ed25519.pub\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "ssh-keyscan -t ed25519 server.example.com\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "ssh-copy-id -i ~/.ssh/work_ed25519.pub alice@server.example.com"
desc = "查看公钥指纹、检查服务器主机密钥并安装公钥（分步模拟）"
[commands.dictation]
prompt = "已创建对应公钥。逐步查看公钥指纹与服务器主机密钥；通过独立可信渠道核对服务器指纹后，再安装公钥。ssh-keyscan 本身不证明服务器身份。"
answers = ["ssh-keygen -lf ~/.ssh/work_ed25519.pub\nssh-keyscan -t ed25519 server.example.com\nssh-copy-id -i ~/.ssh/work_ed25519.pub alice@server.example.com"]

[[commands]]
id = "scp-upload-file"
command = "scp report.pdf alice@server.example.com:/home/alice/"
summary = "确认远端无同名文件后上传本地报告"
simulated_output = "report.pdf                                    100%  842KB   4.1MB/s   00:00"
[[commands.tokens]]
text = "scp"
desc = "通过加密连接复制文件"
[[commands.tokens]]
text = " report.pdf"
desc = "要上传的本地文件"
[[commands.tokens]]
text = " alice@server.example.com:/home/alice/"
desc = "远程账户、主机和目标目录；scp 会替换目标端已有的同名文件"
[commands.dictation]
prompt = "已确认 alice@server.example.com 上的 /home/alice/report.pdf 不存在后，把本地 report.pdf 上传到 /home/alice/ 目录"
answers = ["scp report.pdf alice@server.example.com:/home/alice/"]

[[commands]]
