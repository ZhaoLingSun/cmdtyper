[[commands]]
id = "ssh-keygen-ed25519-basic"
command = "(umask 077; key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-work-key.XXXXXX\") && chmod 700 \"$key_dir\" && key=\"$key_dir/work_ed25519\" && ssh-keygen -t ed25519 -f \"$key\" -C 'alice@laptop' && printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\")"
summary = "在新建的私有临时目录中交互生成 Ed25519 密钥，并报告实际路径"
simulated_output = "Generating public/private ed25519 key pair.\nEnter passphrase (empty for no passphrase):\nEnter same passphrase again:\nYour identification has been saved in /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519\nYour public key has been saved in /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519.pub\nThe key fingerprint is:\nSHA256:Q1sM9rX2kF6nV8cD4wJ7pL0zH3bY5tA6uE9iN2oG4xU alice@laptop\nKey directory: /tmp/cmdtyper-work-key.Q7m2Xa\nPrivate key: /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519\nPublic key: /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519.pub"

[[commands.tokens]]
text = "(umask 077; key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-work-key.XXXXXX\") && chmod 700 \"$key_dir\""
desc = "在子 shell 中建立原子分配、当前用户拥有的唯一 0700 私有目录，不检查或复用固定路径"

[[commands.tokens]]
text = " && key=\"$key_dir/work_ed25519\""
desc = "把固定用途名放在刚创建的唯一目录内，因此不会遇到旧文件或悬空符号链接"

[[commands.tokens]]
text = " && ssh-keygen -t ed25519 -f \"$key\" -C 'alice@laptop'"
desc = "交互生成 Ed25519 密钥；未使用 -N，保留口令输入与确认提示"

[[commands.tokens]]
text = " && printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\")"
desc = "成功后报告目录、私钥和对应 .pub 公钥的实际随机路径"
[commands.dictation]
prompt = "用 umask 077 和 mktemp -d 新建唯一 0700 私有目录，在其中交互生成 work_ed25519 Ed25519 密钥并设置口令；不得使用固定目标或覆盖提示，成功后输出目录、私钥和 .pub 公钥的实际路径"
answers = ["(umask 077; key_dir=$(mktemp -d \"${TMPDIR:-/tmp}/cmdtyper-work-key.XXXXXX\") && chmod 700 \"$key_dir\" && key=\"$key_dir/work_ed25519\" && ssh-keygen -t ed25519 -f \"$key\" -C 'alice@laptop' && printf 'Key directory: %s\\nPrivate key: %s\\nPublic key: %s\\n' \"$key_dir\" \"$key\" \"$key.pub\")"]

[[commands]]
id = "ssh-copy-id-basic"
command = "(umask 077; printf 'Private key path printed by ssh-keygen: ' && IFS= read -r key && [ -f \"$key.pub\" ] && [ ! -L \"$key.pub\" ] && printf 'Expected ED25519 SHA256 host fingerprint from an independent trusted source: ' && IFS= read -r expected && host=server.example.com && kh=$(mktemp) && trap 'rm -f -- \"$kh\"' EXIT HUP INT TERM && ssh-keyscan -t ed25519 \"$host\" >\"$kh\" 2>/dev/null && actual=$(ssh-keygen -lf \"$kh\" -E sha256 | awk '{print $2}' | sort -u) && [ \"$actual\" = \"$expected\" ] && ssh-copy-id -i \"$key.pub\" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=\"$kh\" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \"alice@$host\")"
summary = "核对独立取得的主机指纹后，只安装上一题实际生成的专用公钥"
simulated_output = "Private key path printed by ssh-keygen: /tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519\nExpected ED25519 SHA256 host fingerprint from an independent trusted source: SHA256:RrYw7q1QXJH1dH0s0M4jVj6ZK8Yq2cP9YxQe4uWn7nI\n/usr/bin/ssh-copy-id: INFO: Source of key(s) to be installed: \"/tmp/cmdtyper-work-key.Q7m2Xa/work_ed25519.pub\"\nalice@server.example.com's password:\nNumber of key(s) added: 1"

[[commands.tokens]]
text = "(umask 077; printf 'Private key path printed by ssh-keygen: ' && IFS= read -r key && [ -f \"$key.pub\" ] && [ ! -L \"$key.pub\" ]"
desc = "在本命令内读取上一题报告的实际私钥路径，并确认对应 .pub 是普通文件而非符号链接"

[[commands.tokens]]
text = " && printf 'Expected ED25519 SHA256 host fingerprint from an independent trusted source: ' && IFS= read -r expected"
desc = "要求从管理员、主机控制台或受保护资产记录独立取得预期指纹"

[[commands.tokens]]
text = " && host=server.example.com && kh=$(mktemp) && trap 'rm -f -- \"$kh\"' EXIT HUP INT TERM && ssh-keyscan -t ed25519 \"$host\" >\"$kh\" 2>/dev/null"
desc = "把远端当前提供的 Ed25519 主机密钥写入私有随机 known_hosts 临时文件"

[[commands.tokens]]
text = " && actual=$(ssh-keygen -lf \"$kh\" -E sha256 | awk '{print $2}' | sort -u) && [ \"$actual\" = \"$expected\" ]"
desc = "计算实际指纹并与独立可信值完全比较，不信任 ssh-keyscan 自身"

[[commands.tokens]]
text = " && ssh-copy-id -i \"$key.pub\" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=\"$kh\" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \"alice@$host\")"
desc = "只用 -i 安装该随机目录中的专用 .pub，并把连接固定到刚核验的主机密钥"
[commands.dictation]
prompt = "输入上一题输出的实际私钥路径；再输入从独立可信渠道取得的 server.example.com Ed25519 SHA256 主机指纹。只有对应 .pub 为普通文件且扫描指纹完全匹配时，才用 -i \"$key.pub\" 安装到 alice，并用私有 known_hosts 固定已核验主机密钥"
answers = ["(umask 077; printf 'Private key path printed by ssh-keygen: ' && IFS= read -r key && [ -f \"$key.pub\" ] && [ ! -L \"$key.pub\" ] && printf 'Expected ED25519 SHA256 host fingerprint from an independent trusted source: ' && IFS= read -r expected && host=server.example.com && kh=$(mktemp) && trap 'rm -f -- \"$kh\"' EXIT HUP INT TERM && ssh-keyscan -t ed25519 \"$host\" >\"$kh\" 2>/dev/null && actual=$(ssh-keygen -lf \"$kh\" -E sha256 | awk '{print $2}' | sort -u) && [ \"$actual\" = \"$expected\" ] && ssh-copy-id -i \"$key.pub\" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile=\"$kh\" -o GlobalKnownHostsFile=/dev/null -o StrictHostKeyChecking=yes \"alice@$host\")"]

