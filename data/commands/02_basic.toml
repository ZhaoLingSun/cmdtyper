[meta]
category = "system"
difficulty = "basic"
description = "基础权限、查找与系统管理命令"

[[commands]]
id = "chmod-644"
command = "chmod 644 notes.txt"
summary = "把 notes.txt 设置为所有者可读写、其他用户只读"
simulated_output = ""
[[commands.tokens]]
text = "chmod"
desc = "修改文件或目录的访问权限"
[[commands.tokens]]
text = " 644"
desc = "权限模式：所有者读写，组和其他用户只读"
[[commands.tokens]]
text = " notes.txt"
desc = "要修改权限的文件"
[commands.dictation]
prompt = "把 notes.txt 的权限设置为 644"
answers = ["chmod 644 notes.txt", "chmod 0644 notes.txt"]

[[commands]]
id = "chmod-exec"
command = "chmod +x deploy.sh"
summary = "为 deploy.sh 增加可执行权限"
simulated_output = ""
[[commands.tokens]]
text = "chmod"
desc = "修改文件或目录的访问权限"
[[commands.tokens]]
text = " +x"
desc = "为匹配的用户增加执行权限"
[[commands.tokens]]
text = " deploy.sh"
desc = "要添加执行权限的脚本文件"
[commands.dictation]
prompt = "给 deploy.sh 增加可执行权限"
answers = ["chmod +x deploy.sh", "chmod a+x deploy.sh", "chmod ugo+x deploy.sh"]

[[commands]]
id = "chmod-recursive"
command = "chmod -R u=rwX,go=rX scripts"
summary = "递归设置 scripts：目录和原有可执行文件保留执行语义，普通文件不被统一加执行位"
simulated_output = ""
[[commands.tokens]]
text = "chmod"
desc = "修改文件或目录的访问权限"
[[commands.tokens]]
text = " -R"
desc = "递归处理目录中的所有文件和子目录；使用前必须确认树的边界"
[[commands.tokens]]
text = " u=rwX,go=rX"
desc = "所有者读写，组和其他用户只读；大写 X 仅为目录或原本可执行的文件设置执行位"
[[commands.tokens]]
text = " scripts"
desc = "已核对范围的脚本目录；递归操作前应先审查其中的隐藏项和对象类型"
[commands.dictation]
prompt = "递归设置 scripts 的权限：所有者可读写，其他人只读，并用大写 X 避免把所有普通文件都改成可执行"
answers = ["chmod -R u=rwX,go=rX scripts", "chmod --recursive u=rwX,go=rX scripts"]

[[commands]]
id = "chown-user-group"
command = "sudo chown -- alice:alice app.log"
summary = "在核对文件和目标账号后，以管理员权限把 app.log 的所有者和组改为 alice"
simulated_output = ""
[[commands.tokens]]
text = "sudo"
desc = "仅为这条已审查的归属变更请求管理员权限"
[[commands.tokens]]
text = " chown"
desc = "修改文件或目录的所有者和所属组；普通用户通常不能把文件所有权转给其他账号"
[[commands.tokens]]
text = " --"
desc = "结束选项解析，避免后续操作数被误当成命令选项"
[[commands.tokens]]
text = " alice:alice"
desc = "已确认存在的新所有者和所属组"
[[commands.tokens]]
text = " app.log"
desc = "已先用只读元数据检查确认的单个目标文件"
[commands.dictation]
prompt = "已确认 alice 用户和组存在，也已核对 app.log 的当前归属与用途；只为这一个文件使用管理员权限，把所有者和组改为 alice"
answers = ["sudo chown -- alice:alice app.log"]

[[commands]]
id = "grep-basic"
command = "grep 'ERROR' app.log"
summary = "在 app.log 中查找包含 ERROR 的行"
simulated_output = "2025-03-09 08:03:01 [ERROR] Connection timeout: upstream server\n2025-03-09 08:15:44 [ERROR] Failed to parse JSON: unexpected token\n2025-03-09 08:32:19 [ERROR] Out of memory: cannot allocate 512MB"
[[commands.tokens]]
text = "grep"
desc = "在文件或输入中搜索匹配指定模式的行"
[[commands.tokens]]
text = " 'ERROR'"
desc = "要匹配的关键字"
[[commands.tokens]]
text = " app.log"
desc = "要搜索的日志文件"
[commands.dictation]
prompt = "在 app.log 中查找包含 ERROR 的行"
answers = ["grep 'ERROR' app.log", "grep \"ERROR\" app.log", "grep ERROR app.log"]

[[commands]]
id = "grep-recursive"
command = "grep -R 'TODO' src"
summary = "递归查找 src 目录中包含 TODO 的文本"
simulated_output = "src/main.rs:// TODO: add error handling\nsrc/utils/config.rs:// TODO: support YAML format\nsrc/utils/helpers.rs:// TODO: refactor this function"
[[commands.tokens]]
text = "grep"
desc = "在文件或输入中搜索匹配指定模式的行"
[[commands.tokens]]
text = " -R"
desc = "递归搜索目录中的所有文件"
[[commands.tokens]]
text = " 'TODO'"
desc = "要匹配的关键字"
[[commands.tokens]]
text = " src"
desc = "要递归搜索的目录"
[commands.dictation]
prompt = "递归查找 src 目录中包含 TODO 的内容"
answers = ["grep -R 'TODO' src", "grep --recursive 'TODO' src", "grep -R \"TODO\" src"]

[[commands]]
id = "grep-line-number"
command = "grep -n 'main' src/main.rs"
summary = "查找 src/main.rs 中包含 main 的行并显示行号"
simulated_output = "1:fn main() {\n5:    let config = load_main_config();\n12:    // main loop\n13:    main_loop(&config);"
[[commands.tokens]]
text = "grep"
desc = "在文件或输入中搜索匹配指定模式的行"
[[commands.tokens]]
text = " -n"
desc = "在输出结果前显示匹配行的行号"
[[commands.tokens]]
text = " 'main'"
desc = "要匹配的关键字"
[[commands.tokens]]
text = " src/main.rs"
desc = "要搜索的源代码文件"
[commands.dictation]
prompt = "查找 src/main.rs 中包含 main 的行，并显示行号"
answers = ["grep -n 'main' src/main.rs", "grep --line-number 'main' src/main.rs", "grep -n \"main\" src/main.rs"]

[[commands]]
id = "find-name"
command = "find . -name '*.log'"
summary = "在当前目录及子目录中查找所有 .log 文件"
simulated_output = "./app.log\n./logs/access.log\n./logs/error.log\n./tmp/debug.log"
[[commands.tokens]]
text = "find"
desc = "在目录树中递归查找文件和目录"
[[commands.tokens]]
text = " ."
desc = "从当前目录开始查找"
[[commands.tokens]]
text = " -name"
desc = "按文件名模式匹配"
[[commands.tokens]]
text = " '*.log'"
desc = "匹配所有以 .log 结尾的文件名"
[commands.dictation]
prompt = "在当前目录及其子目录中查找所有 .log 文件"
answers = ["find . -name '*.log'", "find ./ -name '*.log'", "find . -name \"*.log\""]

[[commands]]
id = "find-type-file"
command = "find /var/log -type f"
summary = "在 /var/log 目录下查找所有普通文件"
simulated_output = "/var/log/syslog\n/var/log/auth.log\n/var/log/kern.log\n/var/log/alternatives.log\n/var/log/bootstrap.log\n/var/log/nginx/access.log\n/var/log/nginx/error.log"
[[commands.tokens]]
text = "find"
desc = "在目录树中递归查找文件和目录"
[[commands.tokens]]
text = " /var/log"
desc = "文件路径： /var/log"
[[commands.tokens]]
text = " -type"
desc = "按文件类型筛选"
[[commands.tokens]]
text = " f"
desc = "只匹配普通文件"
[commands.dictation]
prompt = "在 /var/log 目录下查找所有普通文件"
answers = ["find /var/log -type f", "find /var/log/ -type f"]

[[commands]]
id = "tar-create-gzip"
command = "archive=$(mktemp ./backup-XXXXXX.tar.gz)\ntar -czf \"$archive\" project\nprintf '已创建并检查：%s\\n' \"$archive\"\ntar -tzf \"$archive\""
summary = "创建唯一 gzip 归档后，立即用同一变量只读检查它的成员清单；逐条回车，确认成功再继续"
simulated_output = "已创建并检查：./backup-Q7m2Xa.tar.gz\nproject/\nproject/README.md\nproject/src/\nproject/src/main.py"
[[commands.tokens]]
text = "archive=$(mktemp ./backup-XXXXXX.tar.gz)\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "tar -czf \"$archive\" project\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "printf '已创建并检查：%s\\n' \"$archive\"\n"
desc = "准备或执行本步骤；确认成功后按 Enter 进入下一条。"
[[commands.tokens]]
text = "tar -tzf \"$archive\""
desc = "创建唯一 gzip 归档后，立即用同一变量只读检查它的成员清单"
[commands.dictation]
prompt = "为 project 创建一个 mktemp 生成的唯一 gzip tar 归档；成功后输出实际文件名，并用同一个 archive 变量立即列出该归档内容以核对成员"
answers = ["archive=$(mktemp ./backup-XXXXXX.tar.gz)\ntar -czf \"$archive\" project\nprintf '已创建并检查：%s\\n' \"$archive\"\ntar -tzf \"$archive\""]

[[commands]]
id = "tar-extract-gzip"
command = "tar -tzf backup.tar.gz"
summary = "只读检查当前目录中预先准备的固定示例归档 backup.tar.gz"
simulated_output = "project/\nproject/README.md\nproject/src/\nproject/src/main.py\n"
[[commands.tokens]]
text = "tar"
desc = "归档工具；本题只检查归档目录，不写入文件系统"
[[commands.tokens]]
text = " -tzf"
desc = "-t 列出成员 + -z 读取 gzip 压缩 + -f 指定归档文件；不会执行提取"
[[commands.tokens]]
text = " backup.tar.gz"
desc = "独立提供的固定示例归档，不是上一题随机命名的产物；只读检查后再规划隔离提取"
[commands.dictation]
prompt = "把 backup.tar.gz 当作独立提供的固定示例归档：提取前只读列出全部成员路径，检查绝对路径、.. 路径和顶层目录结构"
answers = ["tar -tzf backup.tar.gz", "tar --list --gzip --file backup.tar.gz"]

[[commands]]
id = "ps-aux"
command = "ps aux"
summary = "以详细格式显示当前系统中的所有进程"
simulated_output = "USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND\nroot         1  0.0  0.1 169356 13280 ?        Ss   Mar08   0:03 /sbin/init\nroot         2  0.0  0.0      0     0 ?        S    Mar08   0:00 [kthreadd]\nroot       412  0.0  0.2  72312 20148 ?        Ss   Mar08   0:01 /usr/sbin/sshd -D\nwww-data  1024  0.2  0.5 145892 42360 ?        S    Mar08   2:15 nginx: worker process\nace       1587  0.0  0.1  10864  5440 pts/0    Ss   10:00   0:00 -bash\nace       2103  0.0  0.0   7060  1584 pts/0    R+   10:22   0:00 ps aux"
[[commands.tokens]]
text = "ps"
desc = "显示当前运行的进程信息"
[[commands.tokens]]
text = " aux"
desc = "显示所有用户的进程，并包含详细信息"
[commands.dictation]
prompt = "以详细格式显示系统中的所有进程"
answers = ["ps aux", "ps axu", "/bin/ps aux"]

[[commands]]
id = "kill-force"
command = "kill -TERM 1234"
summary = "在重新核对 PID 后，先向 1234 发送 SIGTERM 请求正常退出"
simulated_output = ""
[[commands.tokens]]
text = "kill"
desc = "向指定 PID 发送信号；发送前必须用最新进程信息核对所有者和完整命令行"
[[commands.tokens]]
text = " -TERM"
desc = "请求进程正常退出，使它有机会清理资源；不要把 SIGKILL 作为第一步"
[[commands.tokens]]
text = " 1234"
desc = "教学用虚构 PID；真实 PID 可能复用，必须在操作前即时复核"
[commands.dictation]
prompt = "已用最新 ps 结果确认 PID 1234 仍是目标进程；先发送 SIGTERM 请求它正常退出，不立即使用 SIGKILL"
answers = ["kill -TERM 1234", "kill 1234", "kill -s TERM 1234"]

[[commands]]
id = "top-basic"
command = "top"
summary = "实时查看系统进程和资源占用"
