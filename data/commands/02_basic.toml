[[commands.tokens]]
text = " systemctl"
desc = "管理 systemd 服务的命令"
[[commands.tokens]]
text = " status"
desc = "查看服务当前状态"
[[commands.tokens]]
text = " nginx"
desc = "要查看状态的服务名称"
[commands.dictation]
prompt = "以管理员权限查看 nginx 服务状态"
